<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .polygon-container {
            margin: 20px 0;
            text-align: center;
        }
        .given-angles {
            font-size: 14px;
            margin-top: 15px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="question">In this decagon, the angles are 149, 130, 146, 127, 131, 162, 144, 152° and one angle marked as n. Find n.
n = °</div>
    
    <div class="polygon-container">
        <svg width="400" height="300" viewBox="0 0 400 300">
            <!-- Decagon with 10 sides -->
            <polygon points="200,50 259,69 295,119 295,181 259,231 200,250 141,231 105,181 105,119 141,69" fill="lightyellow" fill-opacity="0.3" stroke="black" stroke-width="2"/>
            
            <!-- Angle labels and vertices -->
            
                <circle cx="200" cy="50" r="3" fill="black"/>
                <text x="200" y="80" font-size="14" text-anchor="middle" fill="black">
                    149°
                </text>
                <circle cx="259" cy="69" r="3" fill="black"/>
                <text x="241" y="93" font-size="14" text-anchor="middle" fill="black">
                    130°
                </text>
                <circle cx="295" cy="119" r="3" fill="black"/>
                <text x="267" y="128" font-size="14" text-anchor="middle" fill="black">
                    146°
                </text>
                <circle cx="295" cy="181" r="3" fill="black"/>
                <text x="267" y="172" font-size="14" text-anchor="middle" fill="black">
                    127°
                </text>
                <circle cx="259" cy="231" r="3" fill="black"/>
                <text x="241" y="207" font-size="14" text-anchor="middle" fill="black">
                    131°
                </text>
                <circle cx="200" cy="250" r="3" fill="black"/>
                <text x="200" y="220" font-size="14" text-anchor="middle" fill="black">
                    162°
                </text>
                <circle cx="141" cy="231" r="3" fill="black"/>
                <text x="159" y="207" font-size="14" text-anchor="middle" fill="black">
                    144°
                </text>
                <circle cx="105" cy="181" r="3" fill="black"/>
                <text x="133" y="172" font-size="14" text-anchor="middle" fill="black">
                    152°
                </text>
                <circle cx="105" cy="119" r="3" fill="black"/>
                <text x="133" y="128" font-size="14" text-anchor="middle" fill="black">
                    146°
                </text>
                <circle cx="141" cy="69" r="3" fill="red"/>
                <text x="159" y="93" font-size="16" text-anchor="middle" fill="red" font-weight="bold">
                    n
                </text>
        </svg>
    </div>
    
    <div class="given-angles">
        Given angles: 149°, 130°, 146°, 127°, 131°, 162°, 144°, 152°, 146°
    </div>
</body>
</html>
