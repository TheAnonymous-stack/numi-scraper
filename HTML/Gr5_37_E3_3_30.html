<!-- Question 3_30: Which is the best type of graph to show your daily step coun... -->
<div class="item" label="Gr5_37_3_30_step_1" style="width: 250px; padding: 15px; background: white; border: 1px solid #ddd; font-family: Arial, sans-serif;">
  <div style="margin-bottom: 15px;">
    <div style="font-weight: bold; margin-bottom: 8px; color: #28a745;">LINE GRAPH (Best choice)</div>
<svg width="220" height="140" xmlns="http://www.w3.org/2000/svg">
  <!-- Axes -->
  <line x1="30" y1="20" x2="30" y2="110" stroke="black" stroke-width="2"/>
  <line x1="30" y1="110" x2="210" y2="110" stroke="black" stroke-width="2"/>

  <!-- Line -->
  <polyline points="50,75 110,45 170,85" fill="none" stroke="#2196F3" stroke-width="2"/>

  <!-- Points -->
  <circle cx="50" cy="75" r="4" fill="#2196F3"/>
  <circle cx="110" cy="45" r="4" fill="#2196F3"/>
  <circle cx="170" cy="85" r="4" fill="#2196F3"/>

  <!-- Labels -->
  <text x="50" y="130" text-anchor="middle" font-size="11">Mon</text>
  <text x="110" y="130" text-anchor="middle" font-size="11">Tue</text>
  <text x="170" y="130" text-anchor="middle" font-size="11">Wed</text>
</svg>    <div style="margin-top: 8px; font-size: 12px; color: #28a745;">Shows change over time</div>
  </div>
  <div style="margin-bottom: 15px;">
    <div style="font-weight: bold; margin-bottom: 8px; color: #999;">Bar Graph</div>
<svg width="220" height="140" xmlns="http://www.w3.org/2000/svg">
  <!-- Axes -->
  <line x1="30" y1="20" x2="30" y2="110" stroke="black" stroke-width="2"/>
  <line x1="30" y1="110" x2="210" y2="110" stroke="black" stroke-width="2"/>

  <!-- Bars -->
  <rect x="50" y="65" width="35" height="45" fill="#4CAF50"/>
  <rect x="105" y="45" width="35" height="65" fill="#2196F3"/>
  <rect x="160" y="80" width="35" height="30" fill="#FF9800"/>

  <!-- Labels -->
  <text x="67" y="130" text-anchor="middle" font-size="11">A</text>

  <text x="177" y="130" text-anchor="middle" font-size="11">C</text>
