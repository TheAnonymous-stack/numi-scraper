<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .item {
            display: inline-block;
            width: fit-content;
            height: fit-content;
            margin: 10px;
            vertical-align: top;
        }
        .price-list {
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            background: linear-gradient(to bottom, #f0f8ff, #e6f3ff);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .price-list h3 {
            margin: 0 0 15px 0;
            color: #2c5aa0;
            text-align: center;
            font-size: 18px;
        }
        .price-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            margin: 5px 0;
            background: white;
            border-radius: 5px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.05);
        }
        .price-item .name {
            font-weight: 500;
            color: #333;
        }
        .price-item .price {
            font-weight: bold;
            color: #2c5aa0;
        }
        .addition-problem {
            border: 2px solid #4a90e2;
            border-radius: 8px;
            padding: 20px;
            background: #f9fbff;
            text-align: center;
        }
        .addition-problem .numbers {
            font-size: 24px;
            font-family: 'Courier New', monospace;
            color: #333;
            margin: 10px 0;
        }
        .addition-problem .line {
            border-bottom: 3px solid #333;
            margin: 10px auto;
            width: 150px;
        }
        .addition-problem .result {
            font-size: 28px;
            font-weight: bold;
            color: #2c5aa0;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- Question 3_9 Images -->
    
    <!-- Price List -->
    <div class="item" label="Gr5_20_3_9">
        <div class="price-list">
            <h3>Price List</h3>
            <div class="price-item">
                <span class="name">Gym Bag</span>
                <span class="price">$27.85</span>
            </div>
            <div class="price-item">
                <span class="name">Yoga Mat</span>
                <span class="price">$29.56</span>
            </div>
            <div class="price-item">
                <span class="name">Water Bottle</span>
                <span class="price">$11.62</span>
            </div>
            <div class="price-item">
                <span class="name">Tennis Racket</span>
                <span class="price">$43.62</span>
            </div>
            <div class="price-item">
                <span class="name">Basketball</span>
                <span class="price">$24.59</span>
            </div>
        </div>
    </div>
    
    <!-- Solution Addition -->
    <div class="item" label="Gr5_20_3_9_step_2">
        <div class="addition-problem">
            <div class="numbers">
                $24.59<br>
                $27.85<br>
                + $43.62
            </div>
            <div class="line"></div>
            <div class="result">$96.06</div>
        </div>
    </div>
</body>
</html>
