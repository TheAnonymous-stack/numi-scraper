<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; padding: 40px; background: #f5f5f5; }
.container { background: white; padding: 30px; border-radius: 10px; max-width: 800px; margin: 0 auto; }
.question { font-size: 18px; margin-bottom: 30px; }
.number-line { position: relative; width: 700px; height: 120px; margin: 40px auto; }
.line { position: absolute; top: 60px; left: 50px; right: 50px; height: 3px; background: #333; }
.arrow-left { position: absolute; top: 57px; left: 40px; width: 0; height: 0; border-right: 10px solid #333; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.arrow-right { position: absolute; top: 57px; right: 40px; width: 0; height: 0; border-left: 10px solid #333; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.tick { position: absolute; top: 55px; width: 2px; height: 10px; background: #333; }
.tick-label { position: absolute; top: 70px; font-size: 12px; transform: translateX(-50%); }
.point { position: absolute; top: 54px; width: 12px; height: 12px; background: #e74c3c; border-radius: 50%; transform: translateX(-50%); }
.point-label { position: absolute; top: 30px; font-size: 16px; font-weight: bold; color: #e74c3c; transform: translateX(-50%); }
.answer-section { margin-top: 40px; padding: 20px; background: #f9f9f9; border-radius: 5px; }
.choice { padding: 10px; margin: 8px 0; background: white; border: 2px solid #ddd; border-radius: 5px; cursor: pointer; display: flex; align-items: center; }
.choice:hover { background: #e3f2fd; border-color: #2196F3; }
.choice-letter { font-weight: bold; margin-right: 15px; width: 30px; height: 30px; background: #f0f0f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.correct { background: #c8e6c9; border-color: #4CAF50; }
</style>
</head>
<body>
<div class="container">
<div class="question">Which number is less than the other?<br><br>-62 or -61?<br><br>It may help to locate the points on a number line.<br></div>
<div class="number-line">
<div class="line"></div>
<div class="arrow-left"></div>
<div class="arrow-right"></div>
<div class="tick" style="left: 50px;"></div>
<div class="tick-label" style="left: 50px;">-78</div>
<div class="tick" style="left: 103px;"></div>
<div class="tick-label" style="left: 103px;">-68</div>
<div class="tick" style="left: 155px;"></div>
<div class="tick-label" style="left: 155px;">-58</div>
<div class="tick" style="left: 208px;"></div>
<div class="tick-label" style="left: 208px;">-48</div>
<div class="tick" style="left: 261px;"></div>
<div class="tick-label" style="left: 261px;">-38</div>
<div class="tick" style="left: 313px;"></div>
<div class="tick-label" style="left: 313px;">-28</div>
<div class="tick" style="left: 366px;"></div>
<div class="tick-label" style="left: 366px;">-18</div>
<div class="tick" style="left: 418px;"></div>
<div class="tick-label" style="left: 418px;">-8</div>
<div class="tick" style="left: 461px;"></div>
<div class="tick-label" style="left: 461px;">0</div>
<div class="tick" style="left: 471px;"></div>
<div class="tick-label" style="left: 471px;">2</div>
<div class="tick" style="left: 524px;"></div>
<div class="tick-label" style="left: 524px;">12</div>
<div class="tick" style="left: 576px;"></div>
<div class="tick-label" style="left: 576px;">22</div>
<div class="tick" style="left: 629px;"></div>
<div class="tick-label" style="left: 629px;">32</div>
<div class="point" style="left: 134px;"></div>
<div class="point-label" style="left: 134px;">-62</div>
<div class="point" style="left: 139px;"></div>
<div class="point-label" style="left: 139px;">-61</div>
</div>
<div class="answer-section">
<strong>Select your answer:</strong><br><br>
<div class="choice correct"><span class="choice-letter">A</span> -62</div>
<div class="choice"><span class="choice-letter">B</span> -61</div>
</div>
</div>
</body>
</html>
