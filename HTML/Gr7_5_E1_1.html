<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr7_5_E1 1_1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item {
            margin: 20px 0;
            display: inline-block;
        }
        .equation {
            font-size: 28px;
            margin: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.8;
        }
        .numerator {
            border-bottom: 2px solid black;
            padding: 4px 12px;
            min-width: 20px;
            text-align: center;
        }
        .denominator {
            padding: 4px 12px;
            min-width: 20px;
            text-align: center;
        }
        .box {
            width: 40px;
            height: 30px;
            border: 2px solid black;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="item" label="Gr7_5_1_2">
        <div class="equation">
            <div class="fraction">
                <span class="numerator">3</span>
                <span class="denominator">9</span>
            </div>
            <span>=</span>
            <div class="fraction">
                <span class="numerator"><span class="box"></span></span>
                <span class="denominator">3</span>
            </div>
        </div>
    </div>
</body>
</html>
