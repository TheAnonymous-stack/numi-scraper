<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 5 Week 20 Exercise 3 - Question 3_43</title>
</head>
<body>
<div class="item" label="Gr5_20_3_43">
    <style>
        .price-list {
            font-family: Arial, sans-serif;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            background-color: #f9f9f9;
            width: fit-content;
        }
        .price-list h3 {
            margin: 0 0 15px 0;
            color: #333;
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .price-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
            min-width: 250px;
        }
        .price-item:last-child {
            border-bottom: none;
        }
        .item-name {
            font-weight: 500;
            text-transform: capitalize;
        }
        .item-price {
            font-weight: bold;
            color: #2c5aa0;
        }
    </style>
    <div class="price-list">
        <h3>Price List</h3>
        <div class="price-item">
            <span class="item-name">A basketball</span>
            <span class="item-price">$12.89</span>
        </div>
        <div class="price-item">
            <span class="item-name">A basketball hoop</span>
            <span class="item-price">$15.00</span>
        </div>
        <div class="price-item">
            <span class="item-name">Binder</span>
            <span class="item-price">$7.97</span>
        </div>
        <div class="price-item">
            <span class="item-name">Highlighter</span>
            <span class="item-price">$4.73</span>
        </div>
        <div class="price-item">
            <span class="item-name">Push pins</span>
            <span class="item-price">$5.36</span>
        </div>
    </div>
</div>

<div class="item" label="Gr5_20_3_43_step_1">
    <style>
        .math-solution {
            font-family: "Courier New", monospace;
            font-size: 18px;
            padding: 20px;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 5px;
            display: inline-block;
        }
        .math-line {
            text-align: right;
            margin: 2px 0;
            min-width: 120px;
        }
        .math-operator {
            text-align: left;
            display: inline-block;
            width: 20px;
            margin-right: 10px;
        }
        .math-total {
            border-top: 2px solid #333;
            padding-top: 5px;
            margin-top: 5px;
            font-weight: bold;
        }
        .dollar-sign {
            display: inline-block;
            margin-right: 5px;
        }
    </style>
    <div class="math-solution">
        <div class="math-line">
            <span class="math-operator"> </span>
            <span class="dollar-sign">$</span>15.00
        </div>
        <div class="math-line">
            <span class="math-operator">−</span>
            <span class="dollar-sign">$</span>12.89
        </div>
        <div class="math-line math-total">
            <span class="math-operator"> </span>
            <span class="dollar-sign">$</span>2.11
        </div>
    </div>
</div>
</body>
</html>
