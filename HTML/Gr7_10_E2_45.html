<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr7_10_E2 2_45</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .number-line {
            position: relative;
            width: 100%;
            height: 100px;
            margin: 30px 0;
        }
        .line {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: #333;
        }
        .tick {
            position: absolute;
            top: 45%;
            width: 2px;
            height: 10px;
            background: #333;
        }
        .number {
            position: absolute;
            top: 60%;
            transform: translateX(-50%);
            font-size: 14px;
        }
        .arrow {
            position: absolute;
            top: 30%;
            height: 30px;
        }
        .arrow-path {
            stroke: #4169E1;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }
        .point {
            position: absolute;
            top: 48%;
            width: 8px;
            height: 8px;
            background: #FF0000;
            border-radius: 50%;
            transform: translateX(-50%);
        }
        .operation {
            font-size: 24px;
            margin: 20px 0;
            font-weight: bold;
        }
        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 10px;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Addition with Number Lines</h2>
    <div class="operation">-3 + -33 = ?</div>
    
    <div class="item" label="Gr7_10_2_45)">
        <label>Visualizing -3 + -33 on the number line:</label>
        <div class="number-line">
            <div class="line"></div>
            <!-- Create tick marks and numbers -->
            <div class="tick" style="left: 10.0%;"></div>
            <div class="number" style="left: 10.0%;">-41</div>
            <div class="tick" style="left: 19.30232558139535%;"></div>
            <div class="number" style="left: 19.30232558139535%;">-36</div>
            <div class="tick" style="left: 28.6046511627907%;"></div>
            <div class="number" style="left: 28.6046511627907%;">-31</div>
            <div class="tick" style="left: 37.906976744186046%;"></div>
            <div class="number" style="left: 37.906976744186046%;">-26</div>
            <div class="tick" style="left: 47.2093023255814%;"></div>
            <div class="number" style="left: 47.2093023255814%;">-21</div>
            <div class="tick" style="left: 56.51162790697674%;"></div>
            <div class="number" style="left: 56.51162790697674%;">-16</div>
            <div class="tick" style="left: 65.81395348837209%;"></div>
            <div class="number" style="left: 65.81395348837209%;">-11</div>
            <div class="tick" style="left: 75.11627906976744%;"></div>
            <div class="number" style="left: 75.11627906976744%;">-6</div>
            <div class="tick" style="left: 84.4186046511628%;"></div>
            <div class="number" style="left: 84.4186046511628%;">-1</div>
            <div class="point" style="left: 80.69767441860465%;"></div>
            <svg class="arrow" style="left: 19.30232558139535%; width: 61.3953488372093%;">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="10" 
                            refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#4169E1" />
                    </marker>
                </defs>
                <path class="arrow-path" d="M 100% 15 
                                              Q 50% 0 
                                                0% 15" />
            </svg>
        </div>
        <p>Starting at -3, move 33 units to the left to reach -36</p>
    </div>
    <h3>Solution Steps:</h3>
    <div class="item" label="Gr7_10_2_45_step_2)">
        <label>Step 1: Number line with a point marked at -3</label>
    </div>
    <div class="item" label="Gr7_10_2_45_step_3)">
        <label>Step 2: Number line with an arrow from -3 moving left 33 units to -36</label>
    </div>
</body>
</html>
