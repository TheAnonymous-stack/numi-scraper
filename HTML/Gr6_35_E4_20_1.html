<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Angle Measurement</title>
<style>
    .item {
        display: inline-block;
        margin: 10px;
        vertical-align: top;
    }
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    svg {
        border: 1px solid #ddd;
    }
</style>
</head>
<body>
<div class="item" label="Gr6_35_E4_20_1_image_tag">
<svg height="300" viewBox="0 0 400 300" width="400">
    <!-- Protractor semicircle -->
    <path d="M 50 150 A 150 150 0 0 1 350 150" fill="none" stroke="black" stroke-width="2"/>
    
    <!-- Degree markings --><line x1="50.0" y1="150" x2="60.0" y2="150" stroke="black" stroke-width="2"/><text x="70.0" y="145" font-size="10" text-anchor="middle">0°</text><line x1="100.1" y1="150" x2="110.1" y2="150" stroke="black" stroke-width="2"/><text x="120.1" y="145" font-size="10" text-anchor="middle">30°</text><line x1="150.2" y1="150" x2="160.2" y2="150" stroke="black" stroke-width="2"/><text x="170.2" y="145" font-size="10" text-anchor="middle">60°</text><line x1="200.29999999999998" y1="150" x2="210.29999999999998" y2="150" stroke="black" stroke-width="2"/><text x="220.29999999999998" y="145" font-size="10" text-anchor="middle">90°</text><line x1="250.39999999999998" y1="150" x2="260.4" y2="150" stroke="black" stroke-width="2"/><text x="270.4" y="145" font-size="10" text-anchor="middle">120°</text><line x1="300.5" y1="150" x2="310.5" y2="150" stroke="black" stroke-width="2"/><text x="320.5" y="145" font-size="10" text-anchor="middle">150°</text><line x1="350.59999999999997" y1="150" x2="360.59999999999997" y2="150" stroke="black" stroke-width="2"/><text x="370.59999999999997" y="145" font-size="10" text-anchor="middle">180°</text>
    
    <!-- Base line -->
    <line x1="200" y1="150" x2="350" y2="150" stroke="red" stroke-width="3"/>
    
    <!-- Angle line -->
    <line x1="200" y1="150" x2="320" y2="0" stroke="red" stroke-width="3"/>
    
    <!-- Angle arc -->
    <path d="M 250 150 A 50 50 0 0 0 250 50" fill="none" stroke="blue" stroke-width="2"/>
    
    <!-- Angle label -->
    <text x="240" y="130" font-size="16" font-weight="bold" fill="blue">300°</text>
    
    <!-- Center point -->
    <circle cx="200" cy="150" r="3" fill="red"/>
</svg>
</div>
</body>
</html>
