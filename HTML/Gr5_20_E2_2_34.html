<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            font-family: Arial, sans-serif;
            padding: 0;
            margin: 0;
        }
        .subtraction {
            display: inline-block;
            text-align: right;
            border-bottom: 2px solid black;
            padding: 5px;
            min-width: 80px;
        }
        .number {
            margin: 2px 0;
        }
        .operator {
            position: absolute;
            left: -15px;
        }
        .result {
            margin-top: 5px;
            border-top: 2px solid black;
            padding-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Question 2_34: Subtraction 18.05 - 7.58 = 10.47 -->
    <div class="item" label="Gr5_20_2_34_step_2">
        <div class="subtraction">
            <div class="number">$18.05</div>
            <div class="number" style="position: relative;">
                <span class="operator">-</span>$7.58
            </div>
            <div class="result">$10.47</div>
        </div>
    </div>
</body>
</html>
