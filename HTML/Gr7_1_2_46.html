<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; padding: 40px; background: #f5f5f5; }
.container { background: white; padding: 30px; border-radius: 10px; max-width: 800px; margin: 0 auto; }
.question { font-size: 18px; margin-bottom: 30px; }
.number-line { position: relative; width: 700px; height: 120px; margin: 40px auto; }
.line { position: absolute; top: 60px; left: 50px; right: 50px; height: 3px; background: #333; }
.arrow-left { position: absolute; top: 57px; left: 40px; width: 0; height: 0; border-right: 10px solid #333; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.arrow-right { position: absolute; top: 57px; right: 40px; width: 0; height: 0; border-left: 10px solid #333; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.tick { position: absolute; top: 55px; width: 2px; height: 10px; background: #333; }
.tick-label { position: absolute; top: 70px; font-size: 12px; transform: translateX(-50%); }
.point { position: absolute; top: 54px; width: 12px; height: 12px; background: #e74c3c; border-radius: 50%; transform: translateX(-50%); }
.point-label { position: absolute; top: 30px; font-size: 16px; font-weight: bold; color: #e74c3c; transform: translateX(-50%); }
.answer-section { margin-top: 40px; padding: 20px; background: #f9f9f9; border-radius: 5px; }
.choice { padding: 10px; margin: 8px 0; background: white; border: 2px solid #ddd; border-radius: 5px; cursor: pointer; display: flex; align-items: center; }
.choice:hover { background: #e3f2fd; border-color: #2196F3; }
.choice-letter { font-weight: bold; margin-right: 15px; width: 30px; height: 30px; background: #f0f0f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.correct { background: #c8e6c9; border-color: #4CAF50; }
</style>
</head>
<body>
<div class="container">

</div>
</div>
</body>
</html>
