<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr7_28_E2_1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
        }
        .item {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
        }
        table {
            border-collapse: collapse;
            font-size: 18px;
            margin: 10px auto;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px 20px;
            text-align: center;
        }
        th {
            background-color: #f0f0f0;
            font-weight: bold;
        }
        .blank-cell {
            background-color: #f9f9f9;
            min-width: 60px;
            min-height: 30px;
        }
        .graph-container {
            width: 350px;
            height: 350px;
            position: relative;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        .choice-label {
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main problem table -->
        <div class="item" label="Gr7_28_2_2">
            <div style="text-align: center; margin-bottom: 10px; font-size: 16px;">
                <strong>y = x + 2</strong>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>x</th>
                        <th>y</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>2</td>
                        <td class="blank-cell"></td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>5</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>6</td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td class="blank-cell"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Graph A -->
        <div class="item" label="Gr7_28_2_1_2">
            <div class="choice-label">Graph A</div>
            <div class="graph-container">
                <svg viewBox="0 0 350 350">
                    <!-- Grid lines -->
                    <defs>
                        <pattern id="grid28a" width="35" height="35" patternUnits="userSpaceOnUse">
                            <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#e0e0e0" stroke-width="1"/>
                        </pattern>
                    </defs>
                    <rect width="350" height="350" fill="white"/>
                    <rect width="350" height="350" fill="url(#grid28a)" />

                    <!-- Axes -->
                    <line x1="35" y1="315" x2="330" y2="315" stroke="black" stroke-width="2"/>
                    <line x1="35" y1="20" x2="35" y2="315" stroke="black" stroke-width="2"/>

                    <!-- Scale marks and numbers on x-axis -->
                    <text x="35" y="335" text-anchor="middle" font-size="11">0</text>
                    <text x="70" y="335" text-anchor="middle" font-size="11">1</text>
                    <text x="105" y="335" text-anchor="middle" font-size="11">2</text>
                    <text x="140" y="335" text-anchor="middle" font-size="11">3</text>
                    <text x="175" y="335" text-anchor="middle" font-size="11">4</text>
                    <text x="210" y="335" text-anchor="middle" font-size="11">5</text>
                    <text x="245" y="335" text-anchor="middle" font-size="11">6</text>
                    <text x="280" y="335" text-anchor="middle" font-size="11">7</text>
                    <text x="315" y="335" text-anchor="middle" font-size="11">8</text>

                    <!-- Scale marks and numbers on y-axis -->
                    <text x="20" y="285" text-anchor="end" font-size="11">2</text>
                    <text x="20" y="250" text-anchor="end" font-size="11">4</text>
                    <text x="20" y="215" text-anchor="end" font-size="11">6</text>
                    <text x="20" y="180" text-anchor="end" font-size="11">8</text>
                    <text x="20" y="145" text-anchor="end" font-size="11">10</text>

                    <!-- Line y = x + 2 -->
                    <line x1="35" y1="280" x2="280" y2="35" stroke="#4169E1" stroke-width="2"/>

                    <!-- Points on the line -->
                    <circle cx="105" cy="245" r="4" fill="#FF6347"/>
                    <circle cx="140" cy="210" r="4" fill="#FF6347"/>
                    <circle cx="175" cy="175" r="4" fill="#FF6347"/>
                    <circle cx="210" cy="140" r="4" fill="#FF6347"/>
                </svg>
            </div>
        </div>

        <!-- Graph B -->
        <div class="item" label="Gr7_28_2_1_2">
            <div class="choice-label">Graph B</div>
            <div class="graph-container">
                <svg viewBox="0 0 350 350">
                    <!-- Grid lines -->
                    <rect width="350" height="350" fill="white"/>
                    <rect width="350" height="350" fill="url(#grid28a)" />

                    <!-- Axes -->
                    <line x1="35" y1="315" x2="330" y2="315" stroke="black" stroke-width="2"/>
                    <line x1="35" y1="20" x2="35" y2="315" stroke="black" stroke-width="2"/>

                    <!-- Scale marks and numbers on x-axis -->
                    <text x="35" y="335" text-anchor="middle" font-size="11">0</text>
                    <text x="70" y="335" text-anchor="middle" font-size="11">1</text>
                    <text x="105" y="335" text-anchor="middle" font-size="11">2</text>
                    <text x="140" y="335" text-anchor="middle" font-size="11">3</text>
                    <text x="175" y="335" text-anchor="middle" font-size="11">4</text>
                    <text x="210" y="335" text-anchor="middle" font-size="11">5</text>
                    <text x="245" y="335" text-anchor="middle" font-size="11">6</text>
                    <text x="280" y="335" text-anchor="middle" font-size="11">7</text>
                    <text x="315" y="335" text-anchor="middle" font-size="11">8</text>

                    <!-- Scale marks and numbers on y-axis -->
                    <text x="20" y="285" text-anchor="end" font-size="11">2</text>
                    <text x="20" y="250" text-anchor="end" font-size="11">4</text>
                    <text x="20" y="215" text-anchor="end" font-size="11">6</text>
                    <text x="20" y="180" text-anchor="end" font-size="11">8</text>
                    <text x="20" y="145" text-anchor="end" font-size="11">10</text>

                    <!-- Different line (y = x) -->
                    <line x1="35" y1="315" x2="315" y2="35" stroke="#4169E1" stroke-width="2"/>

                    <!-- Points on this line -->
                    <circle cx="105" cy="245" r="4" fill="#FF6347"/>
                    <circle cx="175" cy="175" r="4" fill="#FF6347"/>
                    <circle cx="245" cy="105" r="4" fill="#FF6347"/>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
