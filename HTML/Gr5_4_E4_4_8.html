<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            margin: 0;
            padding: 0;
        }
        .shape-container {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
            max-width: 250px;
        }
        .triangle {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 35px solid #FFD700;
            position: relative;
        }
        .triangle.divided {
            border-bottom-color: white;
            display: inline-block;
        }
        .triangle.divided::after {
            content: '';
            position: absolute;
            left: -20px;
            top: 0;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 35px solid white;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <!-- Question 4_8: One Piece treasure maps - 10 triangles, 9 fully shaded, last with 1/3 parts shaded -->
    <div class="item" label="Gr5_4_4_8">
        <div class="shape-container">
            <div class="triangle"></div>
            <div class="triangle"></div>
            <div class="triangle"></div>
            <div class="triangle"></div>
            <div class="triangle"></div>
            <div class="triangle"></div>
            <div class="triangle"></div>
            <div class="triangle"></div>
            <div class="triangle"></div>
            <svg width="40" height="35">
                <polygon points="20,0 0,35 40,35" fill="white" stroke="black" stroke-width="1"/>
                <path d="M 20,20 L 20,2 L 35,10 Z" fill="black" stroke="black" stroke-width="1"/>
                <path d="M 20,20 L 35,10 L 35,30 Z" fill="black" stroke="black" stroke-width="1"/>
                <path d="M 20,20 L 35,30 L 20,38 Z" fill="black" stroke="black" stroke-width="1"/>
                <path d="M 20,20 L 20,38 L 5,30 Z" fill="black" stroke="black" stroke-width="1"/>
                <path d="M 20,20 L 5,30 L 5,10 Z" fill="black" stroke="black" stroke-width="1"/>
                <path d="M 20,20 L 5,10 L 20,2 Z" fill="black" stroke="black" stroke-width="1"/>
                <line x1="20" y1="0" x2="20" y2="35" stroke="black" stroke-width="0.5"/>
                <line x1="20" y1="0" x2="10" y2="17.5" stroke="black" stroke-width="0.5"/>
                <line x1="20" y1="0" x2="30" y2="17.5" stroke="black" stroke-width="0.5"/>
                <path d="M 20,0 L 0,35 L 13.33,35 Z" fill="#FFD700"/>
            </svg>
        </div>
    </div>
</body>
</html>
