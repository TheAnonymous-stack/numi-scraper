        const circlesPerRowGr7_10_1_1_A = 5;

            const x = startXGr7_10_1_1_A + col * circleSpacingGr7_10_1_1_A;
            const y = startYGr7_10_1_1_A + row * circleSpacingGr7_10_1_1_A;
            
            // Draw circle
            ctxGr7_10_1_1_A.beginPath();

            ctxGr7_10_1_1_A.fillStyle = '#FF6B6B';

            ctxGr7_10_1_1_A.strokeStyle = '#333';
            ctxGr7_10_1_1_A.lineWidth = 2;
            ctxGr7_10_1_1_A.stroke();

            ctxGr7_10_1_1_A.textAlign = 'center';
