<!DOCTYPE html>
<html>
<head>
        <style>
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            background: white;
            display: inline-block;
        }
        .container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }
        .fraction-model {
            text-align: center;
        }
        .fraction-label {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="fraction-model">
            <div class="fraction-label">6/10</div>
            <svg width="100" height="100" viewBox="0 0 100 100">
    <!-- Circle divided into 10 triangular sections -->
    <circle cx="50" cy="50" r="35" fill="white" stroke="black" stroke-width="2"/>

    <!-- 6 out of 10 sections shaded in dark blue -->
    <path d="M 50 50 L 50.0 15.0 A 35 35 0 0 1 70.57 21.68 Z" fill="#00008B" fill-opacity="0.7" stroke="none"/>
    <path d="M 50 50 L 70.57 21.68 A 35 35 0 0 1 83.29 39.18 Z" fill="#00008B" fill-opacity="0.7" stroke="none"/>
    <path d="M 50 50 L 83.29 39.18 A 35 35 0 0 1 83.29 60.82 Z" fill="#00008B" fill-opacity="0.7" stroke="none"/>
    <path d="M 50 50 L 83.29 60.82 A 35 35 0 0 1 70.57 78.32 Z" fill="#00008B" fill-opacity="0.7" stroke="none"/>
    <path d="M 50 50 L 70.57 78.32 A 35 35 0 0 1 50.0 85.0 Z" fill="#00008B" fill-opacity="0.7" stroke="none"/>
    <path d="M 50 50 L 50.0 85.0 A 35 35 0 0 1 29.43 78.32 Z" fill="#00008B" fill-opacity="0.7" stroke="none"/>

    <!-- Lines dividing the circle into 10 triangular sections -->
    <line x1="50" y1="50" x2="50.0" y2="15.0" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="70.57" y2="21.68" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="83.29" y2="39.18" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="83.29" y2="60.82" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="70.57" y2="78.32" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="50.0" y2="85.0" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="29.43" y2="78.32" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="16.71" y2="60.82" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="16.71" y2="39.18" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="29.43" y2="21.68" stroke="black" stroke-width="1"/>
</svg>
        </div>
        <div class="fraction-model">
            <div class="fraction-label">6/8</div>
            <svg width="100" height="100" viewBox="0 0 100 100">
    <!-- Circle divided into 8 triangular sections -->
    <circle cx="50" cy="50" r="35" fill="white" stroke="black" stroke-width="2"/>

    <!-- 6 out of 8 sections shaded in yellow -->
    <path d="M 50 50 L 50.0 15.0 A 35 35 0 0 1 74.75 25.25 Z" fill="#FFFF00" fill-opacity="0.7" stroke="none"/>
    <path d="M 50 50 L 74.75 25.25 A 35 35 0 0 1 85.0 50.0 Z" fill="#FFFF00" fill-opacity="0.7" stroke="none"/>
    <path d="M 50 50 L 85.0 50.0 A 35 35 0 0 1 74.75 74.75 Z" fill="#FFFF00" fill-opacity="0.7" stroke="none"/>
    <path d="M 50 50 L 74.75 74.75 A 35 35 0 0 1 50.0 85.0 Z" fill="#FFFF00" fill-opacity="0.7" stroke="none"/>
    <path d="M 50 50 L 50.0 85.0 A 35 35 0 0 1 25.25 74.75 Z" fill="#FFFF00" fill-opacity="0.7" stroke="none"/>
    <path d="M 50 50 L 25.25 74.75 A 35 35 0 0 1 15.0 50.0 Z" fill="#FFFF00" fill-opacity="0.7" stroke="none"/>

    <!-- Lines dividing the circle into 8 triangular sections -->
    <line x1="50" y1="50" x2="50.0" y2="15.0" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="74.75" y2="25.25" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="85.0" y2="50.0" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="74.75" y2="74.75" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="50.0" y2="85.0" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="25.25" y2="74.75" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="15.0" y2="50.0" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="25.25" y2="25.25" stroke="black" stroke-width="1"/>
</svg>
        </div>
    </div>
</body>
</html>
