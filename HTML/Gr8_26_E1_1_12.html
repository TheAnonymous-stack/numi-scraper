<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr8_26_1_12 - Linear Function Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .item {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        table {
            border-collapse: collapse;
            margin: 0 auto;
            font-size: 18px;
        }
        th, td {
            border: 2px solid #333;
            padding: 15px 25px;
            text-align: center;
        }
        th {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        td {
            background-color: #f9f9f9;
        }
        tr:nth-child(even) td {
            background-color: #e8f5e8;
        }
    </style>
</head>
<body>
    <div class="item" label="Gr8_26_1_12">
        <table>
            <thead>
                <tr>
                    <th>x</th>
                    <th>y</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>7</td>
                    <td>-5</td>
                </tr>
                <tr>
                    <td>8</td>
                    <td>-6</td>
                </tr>
                <tr>
                    <td>9</td>
                    <td>-7</td>
                </tr>
                <tr>
                    <td>10</td>
                    <td>-8</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
