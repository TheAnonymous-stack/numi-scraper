<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr5_41_E3 3_34</title>
    <style>
        .item {
            display: inline-block;
            position: relative;
        }
        
        /* Ensure divs are only as large as their content */
        .item svg {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Question 3_34: Spinner with afternoon and morning -->
    <div class="item" label="Gr5_41_3_34">
        <svg width="200" height="200" viewBox="0 0 200 200">
            <!-- Black outline circle -->
            <circle cx="100" cy="100" r="90" fill="none" stroke="black" stroke-width="2"/>
            
            <!-- afternoon section (approximately 88%) -->
            <path d="M 100 100 L 100 10 A 90 90 0 1 1 38.4 34.4 Z" fill="#FFA500" stroke="black" stroke-width="1"/>
            
            <!-- morning section (approximately 12%) -->
            <path d="M 100 100 L 38.4 34.4 A 90 90 0 0 1 100 10 Z" fill="#87CEEB" stroke="black" stroke-width="1"/>
            
            <!-- Labels -->
            <text x="70" y="80" font-family="Arial" font-size="14" fill="black">afternoon</text>
            <text x="110" y="45" font-family="Arial" font-size="14" fill="black">morning</text>
            
            <!-- Center point -->
            <circle cx="100" cy="100" r="4" fill="black"/>
            
            <!-- Arrow/pointer -->
            <polygon points="100,100 95,85 105,85" fill="gray" transform="rotate(45 100 100)"/>
        </svg>
    </div>
</body>
</html>
