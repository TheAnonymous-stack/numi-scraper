<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    .item {
      display: inline-block;
      padding: 10px;
    }
    .title {
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="item" label="Gr6_42_3_16_step_3">
    <div class="title">Cups of coffee sold</div>
    <svg width="350" height="250" xmlns="http://www.w3.org/2000/svg">
      <!-- Grid -->
      <line x1="60" y1="200" x2="320" y2="200" stroke="#333" stroke-width="2"/>
      <line x1="60" y1="200" x2="60" y2="30" stroke="#333" stroke-width="2"/>
      
      <!-- Y-axis labels -->
      <text x="50" y="200" text-anchor="end" font-size="12">10</text>
      <text x="50" y="150" text-anchor="end" font-size="12">15</text>
      <text x="50" y="100" text-anchor="end" font-size="12">20</text>
      <text x="25" y="120" text-anchor="middle" font-size="12" transform="rotate(-90, 25, 120)">Number of cups</text>
      
      <!-- X-axis labels -->
      <text x="100" y="220" text-anchor="middle" font-size="11">Sunday</text>
      <text x="160" y="220" text-anchor="middle" font-size="11">Monday</text>
      <text x="220" y="220" text-anchor="middle" font-size="11">Tuesday</text>
      <text x="280" y="220" text-anchor="middle" font-size="11">Wednesday</text>
      <text x="190" y="245" text-anchor="middle" font-size="12">Day</text>
      
      <!-- Grid lines -->
      <line x1="60" y1="150" x2="320" y2="150" stroke="#ddd" stroke-width="1"/>
      <line x1="60" y1="100" x2="320" y2="100" stroke="#ddd" stroke-width="1"/>
      
      <!-- Line graph -->
      <polyline points="100,60 160,160 220,140 280,120" fill="none" stroke="#4CAF50" stroke-width="2"/>
      
      <!-- Data points -->
      <circle cx="100" cy="60" r="6" fill="#4CAF50"/>
      <circle cx="160" cy="160" r="6" fill="#4CAF50"/>
      <circle cx="220" cy="140" r="6" fill="#4CAF50"/>
      <circle cx="280" cy="120" r="6" fill="#4CAF50"/>
    </svg>
  </div>
</body>
</html>
