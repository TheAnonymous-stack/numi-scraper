</g>

<div class="item" label="Gr5_49_3_46_B">
    <svg width="200" height="93" viewBox="40.0 190.0 150.0 70.0">
        <!-- Rectangle formed by tessellation -->
        <g>
            
            <!-- Original triangle (bottom) -->
            <polygon points="50,250 180,250 84,200" 
                     fill="#4A90E2" 
                     stroke="#2C3E50" 
                     stroke-width="2"/>
            
            <!-- Left piece after cut and flip -->
            <polygon points="50,200 84,200 50,250" 
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
            
            <!-- Right piece after cut and flip -->
            <polygon points="84,200 180,200 180,250" 
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
            
        
        </g>
        
    </svg>
