<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            width: fit-content;
            height: fit-content;
        }
        .circles-grid {
            display: inline-block;
            padding: 2px;
        }
        .circle-row {
            display: flex;
            margin: 1px 0;
        }
        .circle {
            width: 16px;
            height: 16px;
            background-color: green;
            border-radius: 50%;
            margin: 1px;
        }
        .number-line {
            position: relative;
            width: 310px;
            height: 85px;
            padding: 0;
        }
        .line {
            position: absolute;
            top: 50px;
            height: 2px;
            background-color: black;
            width: 300px;
            left: 5px;
        }
        .tick {
            position: absolute;
            top: 45px;
            width: 2px;
            height: 10px;
            background-color: black;
        }
        .number {
            position: absolute;
            top: 60px;
            font-size: 12px;
            transform: translateX(-50%);
        }
        .arrow {
            position: absolute;
            top: 20px;
            width: 30px;
            height: 25px;
            border: 2px solid blue;
            border-bottom: none;
            border-radius: 25px 25px 0 0;
        }
        .result-box {
            position: absolute;
            top: 55px;
            transform: translateX(-50%);
            padding: 2px 6px;
            border: 2px solid blue;
            background-color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Step 1: 7 rows of 3 circles -->
    <div class="item" label="Gr5_15_1_47_step_1">
        <div class="circles-grid">
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
        </div>
    </div>

    <!-- Step 2: Number line with 7 jumps of 3 -->
    <div class="item" label="Gr5_15_1_47_step_2">
        <div class="number-line">
            <div class="line"></div>
            <!-- Ticks and numbers -->
            <div class="tick" style="left: 5px;"></div>
            <div class="number" style="left: 5px;">0</div>
            <div class="tick" style="left: 35px;"></div>
            <div class="number" style="left: 35px;">3</div>
            <div class="tick" style="left: 65px;"></div>
            <div class="number" style="left: 65px;">6</div>
            <div class="tick" style="left: 95px;"></div>
            <div class="number" style="left: 95px;">9</div>
            <div class="tick" style="left: 125px;"></div>
            <div class="number" style="left: 125px;">12</div>
            <div class="tick" style="left: 155px;"></div>
            <div class="number" style="left: 155px;">15</div>
            <div class="tick" style="left: 185px;"></div>
            <div class="number" style="left: 185px;">18</div>
            <div class="tick" style="left: 215px;"></div>
            <div class="number" style="left: 215px;">21</div>
            <div class="tick" style="left: 245px;"></div>
            <div class="number" style="left: 245px;">24</div>
            <div class="tick" style="left: 275px;"></div>
            <div class="number" style="left: 275px;">27</div>
            <div class="tick" style="left: 305px;"></div>
            <div class="number" style="left: 305px;">30</div>
            <!-- Arrows showing jumps -->
            <div class="arrow" style="left: 5px;"></div>
            <div class="arrow" style="left: 35px;"></div>
            <div class="arrow" style="left: 65px;"></div>
            <div class="arrow" style="left: 95px;"></div>
            <div class="arrow" style="left: 125px;"></div>
            <div class="arrow" style="left: 155px;"></div>
            <div class="arrow" style="left: 185px;"></div>
            <!-- Result box at 21 -->
            <div class="result-box" style="left: 215px;">21</div>
        </div>
    </div>
</body>
</html>
