<!-- Question 2_4: Candy bar graph -->
<div class="item" label="Gr5_40_2_4" style="width: 320px; height: 240px; display: inline-block; position: relative; background: white; border: 1px solid #ddd; padding: 10px;">
    <svg width="300" height="220" xmlns="http://www.w3.org/2000/svg">
        <!-- Title -->
        <text x="150" y="20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Candy</text>
        
        <!-- Grid lines -->
        <g stroke="#e0e0e0" stroke-width="1">
            <line x1="50" y1="180" x2="270" y2="180"/>
            <line x1="50" y1="160" x2="270" y2="160"/>
            <line x1="50" y1="140" x2="270" y2="140"/>

            <line x1="50" y1="80" x2="270" y2="80"/>
            <line x1="50" y1="60" x2="270" y2="60"/>
        </g>
        
        <!-- Axes -->
        <line x1="50" y1="60" x2="50" y2="180" stroke="black" stroke-width="2"/>
        <line x1="50" y1="180" x2="270" y2="180" stroke="black" stroke-width="2"/>
        
        <!-- Y-axis labels -->
        <text x="40" y="185" text-anchor="end" font-family="Arial" font-size="12">0</text>
        <text x="40" y="165" text-anchor="end" font-family="Arial" font-size="12">1</text>
        <text x="40" y="145" text-anchor="end" font-family="Arial" font-size="12">2</text>

        <text x="40" y="65" text-anchor="end" font-family="Arial" font-size="12">6</text>
        
        <!-- Bars -->
        <!-- Candy canes (6 pieces) -->
        <rect x="65" y="60" width="40" height="120" fill="#FF0000"/>
        <text x="85" y="200" text-anchor="middle" font-family="Arial" font-size="10">candy canes</text>
        
        <!-- Chocolate (5 pieces) -->
        <rect x="115" y="80" width="40" height="100" fill="#8B4513"/>
        <text x="135" y="200" text-anchor="middle" font-family="Arial" font-size="10">chocolate</text>

        <text x="235" y="200" text-anchor="middle" font-family="Arial" font-size="10">mints</text>
