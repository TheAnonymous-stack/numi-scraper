<body>
<div class="item" label="Gr5_48_2_26" style="width: 320px; height: 320px; display: inline-block;">
    <svg width="320" height="320" xmlns="http://www.w3.org/2000/svg">

        <path d="M 160 160
                 L 184.7 184.7
                 A 35 35 0 0 0 135.3 135.3
                 Z"
              fill="#2196F3" opacity="0.2"/>
        
        <!-- Starting ray -->
        <line x1="160" y1="160" x2="230.7" y2="230.7"

              stroke="#333" stroke-width="3"/>
        
        <!-- Arc showing the angle (semicircle) -->
        <path d="M 230.7 230.7
                 A 100 100 0 0 0 89.3 89.3"
              fill="none" stroke="#2196F3" stroke-width="3" opacity="0.7"/>

        <circle cx="160" cy="160" r="4" fill="#333"/>
        
        <!-- Arrow marker -->
        <defs>
            <marker id="arrow_27" markerWidth="10" markerHeight="7" 
                    refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#2196F3"/>

        <!-- Arrow on arc -->
