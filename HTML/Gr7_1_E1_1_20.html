<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; padding: 40px; background: #f5f5f5; }
.container { background: white; padding: 30px; border-radius: 10px; max-width: 800px; margin: 0 auto; }
.question { font-size: 18px; margin-bottom: 30px; }
.item { position: relative; width: 700px; height: 120px; margin: 40px auto; }
.line { position: absolute; top: 60px; left: 50px; right: 50px; height: 3px; background: #333; }
.arrow-left { position: absolute; top: 57px; left: 40px; width: 0; height: 0; border-right: 10px solid #333; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.arrow-right { position: absolute; top: 57px; right: 40px; width: 0; height: 0; border-left: 10px solid #333; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.tick { position: absolute; top: 55px; width: 2px; height: 10px; background: #333; }
.tick-label { position: absolute; top: 75px; font-size: 14px; transform: translateX(-50%); }
.missing-box { position: absolute; top: 70px; width: 50px; height: 30px; border: 2px solid #2196F3; background: white; transform: translateX(-50%); border-radius: 3px; text-align: center; line-height: 30px; font-size: 14px; }
.answer-section { margin-top: 40px; padding: 20px; background: #f9f9f9; border-radius: 5px; }
.answer-input { width: 100px; height: 40px; font-size: 18px; padding: 5px; border: 2px solid #2196F3; border-radius: 5px; text-align: center; }
.correct-answer { color: #4CAF50; font-weight: bold; margin-top: 10px; }
</style>
</head>
<body>
<div class="container" label="Gr7_1_1_20" label="Gr7_1_1_20">
<div class="question">Type the missing number.</div>
<div class="item" label="Gr7_1_1_20">
<div class="line"></div>
<div class="arrow-left"></div>
<div class="arrow-right"></div>
<div class="tick" style="left: 50px;"></div>
<div class="tick" style="left: 125px;"></div>
<div class="tick" style="left: 200px;"></div>
<div class="tick" style="left: 275px;"></div>
<div class="tick-label" style="left: 275px;">11</div>
<div class="tick" style="left: 350px;"></div>
<div class="missing-box" style="left: 350px;">?</div>
<div class="tick" style="left: 425px;"></div>
<div class="tick-label" style="left: 425px;">13</div>
<div class="tick" style="left: 500px;"></div>
<div class="tick" style="left: 575px;"></div>
<div class="tick" style="left: 650px;"></div>

</div>
<div class="answer-section">
<strong>Type your answer:</strong><br><br>
<input type="text" class="answer-input" placeholder="?">
<div class="correct-answer">Correct answer: 12</div>
</div>
</div>
</body>
</html>
