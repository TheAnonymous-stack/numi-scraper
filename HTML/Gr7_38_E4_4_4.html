<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .item { display: inline-block; margin: 20px; }
        table { border-collapse: collapse; }
        th, td { border: 1px solid #333; padding: 8px 12px; text-align: center; }
        th { background-color: #f0f0f0; font-weight: bold; }
        .title { font-size: 14px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="item" label="Gr7_38_4_4"><div class="title">Pieces of mail received</div>
        <table id="Gr7_38_4_4">
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Pieces of Mail</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>Saturday</td><td>3</td></tr>
                <tr><td>Monday</td><td>6</td></tr>
                <tr><td>Tuesday</td><td>5</td></tr>
                <tr><td>Wednesday</td><td>2</td></tr>
                <tr><td>Thursday</td><td>3</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
