<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        .item {
            display: inline-block;
            width: fit-content;
            height: fit-content;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 18px;
        }
        .calculation {
            display: inline-block;
            vertical-align: top;
            margin: 0 5px;
        }
        .number {
            text-align: right;
            margin: 2px 0;
        }
        .line {
            border-top: 2px solid black;
            margin: 5px 0;
        }
        .highlight {
            background-color: #ffeb3b;
            padding: 0 2px;
        }
    </style>
</head>
<body>
    <!-- Question 1_50 -->
    <!-- The image shows a vertical subtraction problem with the numbers 74,678 and 22,225 aligned by place value. The calculation for the ones place is highlighted. -->
    <div class="item" label="Gr5_17_1_50_step_1">
        <div class="calculation">
            <div class="number">74,678</div>
            <div class="number">- 22,225</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">3</span></div>
        </div>
    </div>
    
    <!-- The image shows a vertical subtraction problem with the numbers 74,678 and 22,225 aligned by place value. The calculation for the tens place is highlighted. -->
    <div class="item" label="Gr5_17_1_50_step_2">
        <div class="calculation">
            <div class="number">74,678</div>
            <div class="number">- 22,225</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">5</span>3</div>
        </div>
    </div>
    
    <!-- The image shows a vertical subtraction problem with the numbers 74,678 and 22,225 aligned by place value. The calculation for the hundreds place is highlighted. -->
    <div class="item" label="Gr5_17_1_50_step_3">
        <div class="calculation">
            <div class="number">74,678</div>
            <div class="number">- 22,225</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">4</span>53</div>
        </div>
    </div>
    
    <!-- The image shows a vertical subtraction problem with the numbers 74,678 and 22,225 aligned by place value. The calculation for the thousands place is highlighted. -->
    <div class="item" label="Gr5_17_1_50_step_4">
        <div class="calculation">
            <div class="number">74,678</div>
            <div class="number">- 22,225</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">2</span>,453</div>
        </div>
    </div>
    
    <!-- The image shows a vertical subtraction problem with the numbers 74,678 and 22,225 aligned by place value. The calculation for the ten-thousands place is highlighted. -->
    <div class="item" label="Gr5_17_1_50_step_5">
        <div class="calculation">
            <div class="number">74,678</div>
            <div class="number">- 22,225</div>
            <div class="line"></div>
            <div class="number">52,453</div>
        </div>
    </div>
</body>
</html>
