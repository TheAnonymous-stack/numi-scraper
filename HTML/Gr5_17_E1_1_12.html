<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        .item {
            display: inline-block;
            width: fit-content;
            height: fit-content;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 18px;
        }
        .calculation {
            display: inline-block;
            vertical-align: top;
            margin: 0 5px;
        }
        .number {
            text-align: right;
            margin: 2px 0;
        }
        .line {
            border-top: 2px solid black;
            margin: 5px 0;
        }
        .highlight {
            background-color: #ffeb3b;
            padding: 0 2px;
        }
    </style>
</head>
<body>
    <!-- Question 1_12: Addition problem 1412 + 6201 -->
    
    <!-- Step 1: Calculation for the ones place -->
    <div class="item" label="Gr5_17_1_12_step_1">
        <div class="calculation">
            <div class="number">1,412</div>
            <div class="number">+ 6,201</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">3</span></div>
        </div>
    </div>
    
    <!-- Step 2: Calculation for the tens place -->
    <div class="item" label="Gr5_17_1_12_step_2">
        <div class="calculation">
            <div class="number">1,412</div>
            <div class="number">+ 6,201</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">1</span>3</div>
        </div>
    </div>
    
    <!-- Step 3: Calculation for the hundreds place -->
    <div class="item" label="Gr5_17_1_12_step_3">
        <div class="calculation">
            <div class="number">1,412</div>
            <div class="number">+ 6,201</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">6</span>13</div>
        </div>
    </div>
    
    <!-- Step 4: Calculation for the thousands place -->
    <div class="item" label="Gr5_17_1_12_step_4">
        <div class="calculation">
            <div class="number">1,412</div>
            <div class="number">+ 6,201</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">7</span>,613</div>
        </div>
    </div>
</body>
</html>
