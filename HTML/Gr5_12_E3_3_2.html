<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr5_12_E3 3_2</title>
    <style>
        .item {
            display: inline-block;
            margin: 10px;
            vertical-align: top;
        }
        
        .bar-comparison {
            font-family: Arial, sans-serif;
        }
        
        .bar-container {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        
        .label {
            width: 80px;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .squares {
            display: flex;
            gap: 2px;
        }
        
        .square {
            width: 40px;
            height: 40px;
            border: 1px solid #333;
        }
        
        .blue-square {
            background-color: #4285F4;
        }
        
        .orange-square {
            background-color: #FF9800;
        }
        
        .division-container {
            font-family: "Courier New", monospace;
            font-size: 18px;
            line-height: 1.4;
        }
        
        .division-line {
            border-top: 2px solid black;
            margin: 0;
        }
    </style>
</head>
<body>
    <!-- Step 1: Bar comparison showing Reigen vs Mob -->
    <div class="item" label="Gr5_12_3_2_step_1">
        <div class="bar-comparison">
            <div class="bar-container">
                <div class="label">Reigen:</div>
                <div class="squares">
                    <div class="square blue-square"></div>
                </div>
            </div>
            <div class="bar-container">
                <div class="label">Mob:</div>
                <div class="squares">
                    <div class="square orange-square"></div>
                    <div class="square orange-square"></div>
                    <div class="square orange-square"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Step 3: Long division of 328 ÷ 4 -->
    <div class="item" label="Gr5_12_3_2_step_3">
        <div class="division-container">
            <pre>
     82
   ____
4 | 328
    32↓
    ---
     08
      8
    ---
      0
            </pre>
        </div>
    </div>
</body>
</html>
