<!DOCTYPE html>

    <title>Gr7_33_E2_1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .item {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            background: #f9f9f9;
        }
        .choice-label {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }
        .algebra-tiles {
            display: flex;
            align-items: center;
            justify-content: space-around;
            min-height: 100px;
            padding: 20px;
            background: white;
            border-radius: 5px;
        }
        .equation-side {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
            justify-content: center;
        }
        .x-tile {
            width: 60px;
            height: 30px;
            background: #90EE90;
            border: 1px solid #228B22;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .one-tile {
            width: 25px;
            height: 25px;
            background: #FFFFE0;
            border: 1px solid #FFD700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .equals {
            font-size: 24px;
            font-weight: bold;
            margin: 0 20px;
        }
        .question-text {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
        }
    </style>
</head>
