<!DOCTYPE html>
<html>
 <head>
  <style>
   body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .polygon-container {
            margin: 20px 0;
            text-align: center;
        }
        .given-angles {
            font-size: 14px;
            margin-top: 15px;
            color: #333;
        }
  </style>
 </head>
 <body>
  <div class="question">
   In this octagon, the angles are 145, 139, 120, 149, 155, 73° and one angle marked as q. Find q.
q = °
  </div>
  <div class="polygon-container">
   <div class="visual-element item" label="Gr6_51_1_6_step_1">
    <svg height="300" viewbox="0 0 400 300" width="400">
     <!-- Octagon with 8 sides -->
     <polygon fill="lightyellow" fill-opacity="0.3" points="200,50 271,79 300,150 271,221 200,250 129,221 100,150 129,79" stroke="black" stroke-width="2">
     </polygon>
     <!-- Angle labels and vertices -->
     <circle cx="200" cy="50" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="200" y="80">
      145°
     </text>
     <circle cx="271" cy="79" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="249" y="101">
      139°
     </text>
     <circle cx="300" cy="150" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="270" y="150">
      120°
     </text>
     <circle cx="271" cy="221" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="249" y="199">
      149°
     </text>
     <circle cx="200" cy="250" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="200" y="220">
      155°
     </text>
     <circle cx="129" cy="221" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="151" y="199">
      73°
     </text>
     <circle cx="100" cy="150" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="130" y="150">
      155°
     </text>
     <circle cx="129" cy="79" fill="red" r="3">
     </circle>
     <text fill="red" font-size="16" font-weight="bold" text-anchor="middle" x="151" y="101">
      q
     </text>
    </svg>
   </div>
  </div>
  <div class="given-angles">
   Given angles: 145°, 139°, 120°, 149°, 155°, 73°, 155°
  </div>
 </body>
</html>
