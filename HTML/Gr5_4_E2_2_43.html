<!DOCTYPE html>
<html>
<head>
<style>
  .item {
    display: inline-block;
    margin: 10px;
    vertical-align: top;
  }
  .fraction-bar-container {
    margin: 10px 0;
  }
  .fraction-label {
    font-family: Arial, sans-serif;
    font-size: 14px;
    margin-bottom: 5px;
    font-weight: bold;
  }
  .fraction-bar {
    height: 30px;
    border: 2px solid #333;
    position: relative;
    background: #f9f9f9;
    box-sizing: border-box;
  }
  .fraction-fill {
    height: 100%;
    background: #4a90e2;
    position: absolute;
    left: 0;
    top: 0;
  }
</style>
</head>
<body>
<!-- Gr5_4_2_43_step_3 -->
<div class="item" label="Gr5_4_2_43_step_3">
  <div class="fraction-bar-container">
    <div class="fraction-label">2/3</div>
    <div class="fraction-bar" style="width: 200px;">
      <div class="fraction-fill" style="width: 66%;"></div>
    </div>
  </div>
  <div class="fraction-bar-container">
    <div class="fraction-label">1</div>
    <div class="fraction-bar" style="width: 200px;">
      <div class="fraction-fill" style="width: 100%;"></div>
    </div>
  </div>
</div>

<!-- Gr5_4_2_43_step_5 -->
<div class="item" label="Gr5_4_2_43_step_5">
  <div class="fraction-bar-container">
    <div class="fraction-label">5/3</div>
    <div class="fraction-bar" style="width: 333px;">
      <div class="fraction-fill" style="width: 100%;"></div>
    </div>
  </div>
  <div class="fraction-bar-container">
    <div class="fraction-label">1</div>
    <div class="fraction-bar" style="width: 200px;">
      <div class="fraction-fill" style="width: 100%;"></div>
    </div>
  </div>
</div>

</body>
</html>
