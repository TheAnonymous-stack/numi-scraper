<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr5_41_E3 3_4</title>
    <style>
        .item {
            display: inline-block;
            position: relative;
        }
        
        /* Ensure divs are only as large as their content */
        .item svg {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Question 3_4: Weather predictor with foggy (71%) and clear (29%) sections -->
    <div class="item" label="Gr5_41_3_4">
        <svg width="200" height="200" viewBox="0 0 200 200">
            <!-- Black outline circle -->
            <circle cx="100" cy="100" r="90" fill="none" stroke="black" stroke-width="2"/>
            
            <!-- Foggy section (approximately 71% = 255.6 degrees) -->
            <path d="M 100 100 L 100 10 A 90 90 0 1 1 30 140 Z" fill="#D3D3D3" stroke="black" stroke-width="1"/>
            
            <!-- Clear section (approximately 29% = 104.4 degrees) -->
            <path d="M 100 100 L 30 140 A 90 90 0 0 1 100 10 Z" fill="#87CEEB" stroke="black" stroke-width="1"/>
            
            <!-- Labels -->
            <text x="70" y="80" font-family="Arial" font-size="14" fill="black">foggy</text>
            <text x="120" y="50" font-family="Arial" font-size="14" fill="black">clear</text>
            
            <!-- Center point -->
            <circle cx="100" cy="100" r="4" fill="black"/>
            
            <!-- Arrow/pointer -->
            <polygon points="100,100 95,85 105,85" fill="gray" transform="rotate(45 100 100)"/>
        </svg>
    </div>
</body>
</html>
