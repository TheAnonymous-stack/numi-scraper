<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            margin: 10px;
        }
        .circles-grid {
            display: inline-block;
        }
        .circle-row {
            display: flex;
            margin: 2px 0;
        }
        .circle {
            width: 20px;
            height: 20px;
            background-color: green;
            border-radius: 50%;
            margin: 2px;
        }
        .number-line {
            position: relative;
            width: fit-content;
            height: 80px;
            margin-top: 20px;
        }
        .line {
            position: absolute;
            top: 50px;
            height: 2px;
            background-color: black;
            width: 900px;
        }
        .tick {
            position: absolute;
            top: 45px;
            width: 2px;
            height: 10px;
            background-color: black;
        }
        .number {
            position: absolute;
            top: 60px;
            font-size: 12px;
            transform: translateX(-50%);
        }
        .arrow {
            position: absolute;
            top: 20px;
            width: 90px;
            height: 25px;
            border: 2px solid blue;
            border-bottom: none;
            border-radius: 45px 45px 0 0;
        }
        .result-box {
            position: absolute;
            top: 55px;
            transform: translateX(-50%);
            padding: 2px 6px;
            border: 2px solid blue;
            background-color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Step 1: 9 rows of 10 circles -->
    <div class="item" label="Gr5_15_1_10_step_1">
        <div class="circles-grid">
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
        </div>
    </div>

    <!-- Step 2: Number line with 9 jumps of 10 -->
    <div class="item" label="Gr5_15_1_10_step_2">
        <div class="number-line">
            <div class="line"></div>
            <!-- Ticks and numbers at intervals of 10 -->
            <div class="tick" style="left: 0px;"></div>
            <div class="number" style="left: 0px;">0</div>
            <div class="tick" style="left: 90px;"></div>
            <div class="number" style="left: 90px;">10</div>
            <div class="tick" style="left: 180px;"></div>
            <div class="number" style="left: 180px;">20</div>
            <div class="tick" style="left: 270px;"></div>
            <div class="number" style="left: 270px;">30</div>
            <div class="tick" style="left: 360px;"></div>
            <div class="number" style="left: 360px;">40</div>
            <div class="tick" style="left: 450px;"></div>
            <div class="number" style="left: 450px;">50</div>
            <div class="tick" style="left: 540px;"></div>
            <div class="number" style="left: 540px;">60</div>
            <div class="tick" style="left: 630px;"></div>
            <div class="number" style="left: 630px;">70</div>
            <div class="tick" style="left: 720px;"></div>
            <div class="number" style="left: 720px;">80</div>
            <div class="tick" style="left: 810px;"></div>
            <div class="number" style="left: 810px;">90</div>
            <div class="tick" style="left: 900px;"></div>
            <div class="number" style="left: 900px;">100</div>
            <!-- 9 Arrows -->
            <div class="arrow" style="left: 0px;"></div>
            <div class="arrow" style="left: 90px;"></div>
            <div class="arrow" style="left: 180px;"></div>
            <div class="arrow" style="left: 270px;"></div>
            <div class="arrow" style="left: 360px;"></div>
            <div class="arrow" style="left: 450px;"></div>
            <div class="arrow" style="left: 540px;"></div>
            <div class="arrow" style="left: 630px;"></div>
            <div class="arrow" style="left: 720px;"></div>
            <!-- Result box -->
            <div class="result-box" style="left: 810px;">90</div>
        </div>
    </div>
</body>
</html>
