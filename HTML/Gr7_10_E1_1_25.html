
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {

            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }
        .item {
            border: 2px solid #333;
            background-color: white;
            padding: 15px;
            margin: 10px 0;
            width: fit-content;
            text-align: center;
        }
        canvas {
            border: 1px solid #ccc;
            background-color: white;
        }
        .problem {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .instruction {
            font-size: 16px;

        }
    </style>
</head>
<body>
    <div class="container"> 
        <!-- Multiple Choice Options -->
        <div class="item" label="Gr7_10_1_25_A">
            <canvas id="Gr7_10_1_25_A" width="400" height="150"></canvas>
        </div>
        <div class="item" label="Gr7_10_1_25_B">

    <script>
        
        // Canvas Gr7_10_1_25_A - Zero (no counters)
        const canvasGr7_10_1_25_A = document.getElementById('Gr7_10_1_25_A');
        const ctxGr7_10_1_25_A = canvasGr7_10_1_25_A.getContext('2d');
        ctxGr7_10_1_25_A.clearRect(0, 0, 400, 150);
        ctxGr7_10_1_25_A.fillStyle = '#666';
        ctxGr7_10_1_25_A.font = '18px Arial';
        ctxGr7_10_1_25_A.textAlign = 'center';
        ctxGr7_10_1_25_A.fillText('No counters (represents 0)', 200, 75);
        
        // Canvas Gr7_10_1_25_B - -1
        const canvasGr7_10_1_25_B = document.getElementById('Gr7_10_1_25_B');
        const ctxGr7_10_1_25_B = canvasGr7_10_1_25_B.getContext('2d');
        ctxGr7_10_1_25_B.clearRect(0, 0, 400, 150);
        
        const startXGr7_10_1_25_B = 193.75;
        const startYGr7_10_1_25_B = 68.75;
        const circleRadiusGr7_10_1_25_B = 25;
        const circleSpacingGr7_10_1_25_B = 62.5;
        const circlesPerRowGr7_10_1_25_B = 1;
        
        for (let i = 0; i < 1; i++) {
            const row = Math.floor(i / circlesPerRowGr7_10_1_25_B);
            const col = i % circlesPerRowGr7_10_1_25_B;
            
            const x = startXGr7_10_1_25_B + col * circleSpacingGr7_10_1_25_B;
            const y = startYGr7_10_1_25_B + row * circleSpacingGr7_10_1_25_B;
            
            // Draw circle
            ctxGr7_10_1_25_B.beginPath();
            ctxGr7_10_1_25_B.arc(x, y, circleRadiusGr7_10_1_25_B, 0, 2 * Math.PI);
            ctxGr7_10_1_25_B.fillStyle = '#FF6B6B';
            ctxGr7_10_1_25_B.fill();
            ctxGr7_10_1_25_B.strokeStyle = '#333';
            ctxGr7_10_1_25_B.lineWidth = 2;
            ctxGr7_10_1_25_B.stroke();
            
            // Draw sign
            ctxGr7_10_1_25_B.fillStyle = '#000';
            ctxGr7_10_1_25_B.font = 'bold 30px Arial';
            ctxGr7_10_1_25_B.textAlign = 'center';
            ctxGr7_10_1_25_B.textBaseline = 'middle';
            ctxGr7_10_1_25_B.fillText('-', x, y);
