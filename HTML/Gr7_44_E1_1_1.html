        <text x="300" y="90" font-size="14" font-family="Arial" text-anchor="middle" fill="#666">

            <text x="0" y="-15" font-size="16" font-family="Arial" text-anchor="middle" fill="#00aa00">

            </text>
        </g>

        <!-- Explanation -->

            Each coordinate is multiplied by the scale factor
        </text>
        <text x="300" y="180" font-size="11" font-family="Arial" text-anchor="middle" fill="#888">
            (-3 × 3 = -3, 0 × 3 = 0)
