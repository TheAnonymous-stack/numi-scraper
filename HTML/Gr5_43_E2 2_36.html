            border-left: 75px solid transparent;
            border-right: 75px solid transparent;
            border-bottom: 129px solid #00FF00;
        }
        
        .side-label {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            background: white;
            padding: 2px 4px;
            border-radius: 3px;
        }
        
        .label-left {
            top: 50%;
            left: -105px;
            transform: translateY(-50%);
        }
        
        .label-right {
            top: 50%;
            right: -105px;
            transform: translateY(-50%);
        }
        
        .label-bottom {
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
