<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            border: 1px solid #ccc;
            padding: 10px;
            margin: 5px;
        }
        table {
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: yellow;
            font-weight: bold;
        }
        .table-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- Question 1_29 image -->
    <div class="item" label="Gr5_2_1_29">
        <div class="table-title">Pizzas Delivered</div>
        <table>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Number of pizzas</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Saturday</td>
                    <td>799</td>
                </tr>
                <tr>
                    <td>Sunday</td>
                    <td>719</td>
                </tr>
                <tr>
                    <td>Monday</td>
                    <td>959</td>
                </tr>
                <tr>
                    <td>Tuesday</td>

                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
