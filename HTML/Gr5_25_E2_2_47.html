<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Visualization: 44 × 91</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
            background-color: #f5f5f5;
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        
        .multiplication-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            width: 400px;
            height: 300px;
            border: 3px solid #333;
            position: relative;
        }
        
        .rectangle {
            border: 2px solid #666;
            background-color: white;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        .label {
            position: absolute;
            font-size: 16px;
            font-weight: bold;
            color: #0066cc;
        }
        
        .top-label {
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .left-label {
            left: -25px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .summary {
            margin-top: 30px;
            font-size: 18px;
            text-align: center;
        }
        
        .calculation {
            margin: 10px 0;
            font-size: 16px;
            color: #555;
        }
        
        .total {
            font-size: 20px;
            font-weight: bold;
            color: #0066cc;
            margin-top: 15px;
        }
        
        .item {
            position: relative;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    
    <div class="item" label="Gr5_25_2_47">
    <div class="multiplication-grid">
        <div class="rectangle">
            <div class="label top-label">90</div>
            <div class="label left-label">40</div>
            <div class="product">3600</div>
        </div>
        <div class="rectangle">
            <div class="label top-label">1</div>
            <div class="product">40</div>
        </div>
        <div class="rectangle">
            <div class="label left-label">4</div>
            <div class="product">360</div>
        </div>
        <div class="rectangle">
            <div class="product">4</div>
        </div>
    </div>
</div>        
</body>
</html>
