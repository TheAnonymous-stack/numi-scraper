        .main-container {
            max-width: 1200px;
            
        }
        
        .section {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .side-by-side {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .problem-section, .solution-section {
            flex: 1;
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .question {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: bold;

            text-align: center;
            color: #1e40af;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }
        
        .svg-container {
            display: flex;
            justify-content: center;
            
        }
        
        .polygon {
            fill: rgba(135, 206, 250, 0.3);
            stroke: #1e40af;
            stroke-width: 2;
        }
        
        .info {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            border-radius: 4px;
        }
        
        .polygon-info {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
        
        .answer {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            text-align: center;
        }
        
        .answer-label {
            font-weight: bold;
            color: #166534;
            margin-bottom: 5px;
        }
        
        .answer-value {
            font-size: 24px;
            font-weight: bold;
            color: #16a34a;
        }
        
        .triangulation-info {
            margin-top: 20px;
            padding: 15px;
            background-color: #fef3c7;
            border-left: 4px solid #f59e0b;
            border-radius: 4px;
        }
