<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        .item {
            display: inline-block;
            width: fit-content;
            height: fit-content;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 18px;
        }
        .calculation {
            display: inline-block;
            vertical-align: top;
            margin: 0 5px;
        }
        .number {
            text-align: right;
            margin: 2px 0;
        }
        .line {
            border-top: 2px solid black;
            margin: 5px 0;
        }
        .highlight {
            background-color: #ffeb3b;
            padding: 0 2px;
        }
    </style>
</head>
<body>
    <!-- Question 1_29 -->
    <!-- The image shows a vertical subtraction problem with the numbers 41,916 and 36,999 aligned by place value. The calculation for the ones place is highlighted. -->
    <div class="item" label="Gr5_17_1_29_step_1">
        <div class="calculation">
            <div class="number">41,916</div>
            <div class="number">- 36,999</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">7</span></div>
        </div>
    </div>
    
    <!-- The image shows a vertical subtraction problem with the numbers 41,916 and 36,999 aligned by place value. The calculation for the tens place is highlighted. -->
    <div class="item" label="Gr5_17_1_29_step_2">
        <div class="calculation">
            <div class="number">41,916</div>
            <div class="number">- 36,999</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">1</span>7</div>
        </div>
    </div>
    
    <!-- The image shows a vertical subtraction problem with the numbers 41,916 and 36,999 aligned by place value. The calculation for the hundreds place is highlighted. -->
    <div class="item" label="Gr5_17_1_29_step_3">
        <div class="calculation">
            <div class="number">41,916</div>
            <div class="number">- 36,999</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">9</span>17</div>
        </div>
    </div>
    
    <!-- The image shows a vertical subtraction problem with the numbers 41,916 and 36,999 aligned by place value. The calculation for the thousands place is highlighted. -->
    <div class="item" label="Gr5_17_1_29_step_4">
        <div class="calculation">
            <div class="number">41,916</div>
            <div class="number">- 36,999</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">4</span>,917</div>
        </div>
    </div>
    
    <!-- The image shows a vertical subtraction problem with the numbers 41,916 and 36,999 aligned by place value. The calculation for the ten-thousands place is highlighted. -->
    <div class="item" label="Gr5_17_1_29_step_5">
        <div class="calculation">
            <div class="number">41,916</div>
            <div class="number">- 36,999</div>
            <div class="line"></div>
            <div class="number">4,917</div>
        </div>
    </div>
</body>
</html>
