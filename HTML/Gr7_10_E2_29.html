<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr7_10_E2 2_29</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .number-line {
            position: relative;
            width: 100%;
            height: 100px;
            margin: 30px 0;
        }
        .line {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: #333;
        }
        .tick {
            position: absolute;
            top: 45%;
            width: 2px;
            height: 10px;
            background: #333;
        }
        .number {
            position: absolute;
            top: 60%;
            transform: translateX(-50%);
            font-size: 14px;
        }
        .arrow {
            position: absolute;
            top: 30%;
            height: 30px;
        }
        .arrow-path {
            stroke: #4169E1;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }
        .point {
            position: absolute;
            top: 48%;
            width: 8px;
            height: 8px;
            background: #FF0000;
            border-radius: 50%;
            transform: translateX(-50%);
        }
        .operation {
            font-size: 24px;
            margin: 20px 0;
            font-weight: bold;
        }
        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 10px;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Addition with Number Lines</h2>
    <div class="operation">-12 + -28 = ?</div>
    
    <div class="item" label="Gr7_10_2_29)">
        <label>Visualizing -12 + -28 on the number line:</label>
        <div class="number-line">
            <div class="line"></div>
            <!-- Create tick marks and numbers -->
            <div class="tick" style="left: 10.0%;"></div>
            <div class="number" style="left: 10.0%;">-45</div>
            <div class="tick" style="left: 20.526315789473685%;"></div>
            <div class="number" style="left: 20.526315789473685%;">-40</div>
            <div class="tick" style="left: 31.05263157894737%;"></div>
            <div class="number" style="left: 31.05263157894737%;">-35</div>
            <div class="tick" style="left: 41.578947368421055%;"></div>
            <div class="number" style="left: 41.578947368421055%;">-30</div>
            <div class="tick" style="left: 52.10526315789474%;"></div>
            <div class="number" style="left: 52.10526315789474%;">-25</div>
            <div class="tick" style="left: 62.63157894736842%;"></div>
            <div class="number" style="left: 62.63157894736842%;">-20</div>
            <div class="tick" style="left: 73.15789473684211%;"></div>
            <div class="number" style="left: 73.15789473684211%;">-15</div>
            <div class="tick" style="left: 83.6842105263158%;"></div>
            <div class="number" style="left: 83.6842105263158%;">-10</div>
            <div class="point" style="left: 79.47368421052632%;"></div>
            <svg class="arrow" style="left: 20.526315789473685%; width: 58.94736842105263%;">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="10" 
                            refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#4169E1" />
                    </marker>
                </defs>
                <path class="arrow-path" d="M 100% 15 
                                              Q 50% 0 
                                                0% 15" />
            </svg>
        </div>
        <p>Starting at -12, move 28 units to the left to reach -40</p>
    </div>
    <h3>Solution Steps:</h3>
    <div class="item" label="Gr7_10_2_29_step_2)">
        <label>Step 1: Number line with a point marked at -12</label>
    </div>
    <div class="item" label="Gr7_10_2_29_step_3)">
        <label>Step 2: Number line with an arrow from -12 moving left 28 units to -40</label>
    </div>
</body>
</html>
