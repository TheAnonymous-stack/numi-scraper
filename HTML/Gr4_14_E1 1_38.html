<head>

            display: inline-block;

    <h1>Gr4_14_E1 Question 1_38</h1>

    <!-- Two aligned horizontal number lines from 0 to 2. The top number line has 32 equal divisions (sixteenths) with a green diamond marking 24/16. The bottom number line has 8 equal divisions (fourths) with a blue diamond marking 6/4. Both diamonds are at the same horizontal position (1.5), demonstrating that 24/16 and 6/4 are equivalent fractions. -->
    <div class="item" label="Gr4_14_1_38_step_1" style="display: inline-block; padding: 10px;">
<svg width="500" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Top number line: 0 to 2 in sixteenths (32 divisions) -->
  <line x1="40" y1="50" x2="460" y2="50" stroke="black" stroke-width="2"/>

  <!-- Major ticks at 0, 1, 2 -->
  <line x1="40" y1="40" x2="40" y2="60" stroke="black" stroke-width="2"/>
  <text x="40" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">0</text>

  <line x1="250" y1="40" x2="250" y2="60" stroke="black" stroke-width="2"/>
  <text x="250" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">1</text>

  <line x1="460" y1="40" x2="460" y2="60" stroke="black" stroke-width="2"/>
  <text x="460" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">2</text>

  <!-- Minor ticks for sixteenths (every 13.125 px) -->
  <line x1="53.125" y1="45" x2="53.125" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="66.25" y1="45" x2="66.25" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="79.375" y1="45" x2="79.375" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="92.5" y1="45" x2="92.5" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="105.625" y1="45" x2="105.625" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="118.75" y1="45" x2="118.75" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="131.875" y1="45" x2="131.875" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="145" y1="45" x2="145" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="158.125" y1="45" x2="158.125" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="171.25" y1="45" x2="171.25" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="184.375" y1="45" x2="184.375" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="197.5" y1="45" x2="197.5" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="210.625" y1="45" x2="210.625" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="223.75" y1="45" x2="223.75" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="236.875" y1="45" x2="236.875" y2="55" stroke="gray" stroke-width="1"/>

  <!-- Green diamond at 24/16 = 1.5 (x = 40 + 1.5 * 210 = 355) -->
  <polygon points="350,42 360,50 350,58 340,50" fill="green" stroke="black" stroke-width="1"/>
  <text x="350" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="green">24/16</text>

  <!-- Bottom number line: 0 to 2 in fourths (8 divisions) -->
  <line x1="40" y1="100" x2="460" y2="100" stroke="black" stroke-width="2"/>

  <!-- Major ticks at 0, 1, 2 -->
  <line x1="40" y1="90" x2="40" y2="110" stroke="black" stroke-width="2"/>
  <text x="40" y="125" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">0</text>

  <line x1="250" y1="90" x2="250" y2="110" stroke="black" stroke-width="2"/>
  <text x="250" y="125" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">1</text>

  <line x1="460" y1="90" x2="460" y2="110" stroke="black" stroke-width="2"/>
  <text x="460" y="125" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">2</text>

  <!-- Ticks for fourths -->
  <line x1="92.5" y1="95" x2="92.5" y2="105" stroke="gray" stroke-width="1"/>
  <text x="92.5" y="88" text-anchor="middle" font-family="Arial" font-size="9">1/4</text>
  <line x1="145" y1="95" x2="145" y2="105" stroke="gray" stroke-width="1"/>
  <text x="145" y="88" text-anchor="middle" font-family="Arial" font-size="9">2/4</text>
  <line x1="197.5" y1="95" x2="197.5" y2="105" stroke="gray" stroke-width="1"/>
  <text x="197.5" y="88" text-anchor="middle" font-family="Arial" font-size="9">3/4</text>
  <line x1="302.5" y1="95" x2="302.5" y2="105" stroke="gray" stroke-width="1"/>
  <text x="302.5" y="88" text-anchor="middle" font-family="Arial" font-size="9">5/4</text>
  <line x1="407.5" y1="95" x2="407.5" y2="105" stroke="gray" stroke-width="1"/>
  <text x="407.5" y="88" text-anchor="middle" font-family="Arial" font-size="9">7/4</text>

  <!-- Blue diamond at 6/4 = 1.5 (x = 40 + 1.5 * 210 = 355) -->
  <polygon points="350,92 360,100 350,108 340,100" fill="blue" stroke="black" stroke-width="1"/>
  <text x="350" y="140" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="blue">6/4</text>

  <!-- Dashed line connecting the two diamonds -->
  <line x1="350" y1="58" x2="350" y2="92" stroke="purple" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
    </div>

</body>
