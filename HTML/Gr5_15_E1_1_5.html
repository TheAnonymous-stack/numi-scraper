<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            margin: 10px;
        }
        .circles-grid {
            display: inline-block;
        }
        .circle-row {
            display: flex;
            margin: 2px 0;
        }
        .circle {
            width: 20px;
            height: 20px;
            background-color: green;
            border-radius: 50%;
            margin: 2px;
        }
        .number-line {
            position: relative;
            width: fit-content;
            height: 80px;
            margin-top: 20px;
        }
        .line {
            position: absolute;
            top: 50px;
            height: 2px;
            background-color: black;
            width: 640px;
        }
        .tick {
            position: absolute;
            top: 45px;
            width: 2px;
            height: 10px;
            background-color: black;
        }
        .number {
            position: absolute;
            top: 60px;
            font-size: 12px;
            transform: translateX(-50%);
        }
        .arrow {
            position: absolute;
            top: 20px;
            width: 80px;
            height: 25px;
            border: 2px solid blue;
            border-bottom: none;
            border-radius: 40px 40px 0 0;
        }
        .result-box {
            position: absolute;
            top: 55px;
            transform: translateX(-50%);
            padding: 2px 6px;
            border: 2px solid blue;
            background-color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Step 1: 8 rows of 8 circles -->
    <div class="item" label="Gr5_15_1_5_step_1">
        <div class="circles-grid">
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
        </div>
    </div>

    <!-- Step 2: Number line with 8 jumps of 8 -->
    <div class="item" label="Gr5_15_1_5_step_2">
        <div class="number-line">
            <div class="line"></div>
            <!-- Ticks and numbers -->
            <div class="tick" style="left: 0px;"></div>
            <div class="number" style="left: 0px;">0</div>
            <div class="tick" style="left: 80px;"></div>
            <div class="number" style="left: 80px;">8</div>
            <div class="tick" style="left: 160px;"></div>
            <div class="number" style="left: 160px;">16</div>
            <div class="tick" style="left: 240px;"></div>
            <div class="number" style="left: 240px;">24</div>
            <div class="tick" style="left: 320px;"></div>
            <div class="number" style="left: 320px;">32</div>
            <div class="tick" style="left: 400px;"></div>
            <div class="number" style="left: 400px;">40</div>
            <div class="tick" style="left: 480px;"></div>
            <div class="number" style="left: 480px;">48</div>
            <div class="tick" style="left: 560px;"></div>
            <div class="number" style="left: 560px;">56</div>
            <div class="tick" style="left: 640px;"></div>
            <div class="number" style="left: 640px;">64</div>
            <div class="tick" style="left: 720px;"></div>
            <div class="number" style="left: 720px;">72</div>
            <div class="tick" style="left: 800px;"></div>
            <div class="number" style="left: 800px;">80</div>
            <!-- Arrows -->
            <div class="arrow" style="left: 0px;"></div>
            <div class="arrow" style="left: 80px;"></div>
            <div class="arrow" style="left: 160px;"></div>
            <div class="arrow" style="left: 240px;"></div>
            <div class="arrow" style="left: 320px;"></div>
            <div class="arrow" style="left: 400px;"></div>
            <div class="arrow" style="left: 480px;"></div>
            <div class="arrow" style="left: 560px;"></div>
            <!-- Result box -->
            <div class="result-box" style="left: 640px;">64</div>
        </div>
    </div>
</body>
</html>
