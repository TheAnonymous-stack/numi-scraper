<!DOCTYPE html>
<html>
<head>
    <title>Question</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .question { margin-bottom: 20px; }
        .image-container { margin: 20px 0; }
        .choices { display: flex; flex-wrap: wrap; gap: 20px; }
        .choice { border: 2px solid #ddd; padding: 10px; cursor: pointer; }
        .choice:hover { border-color: #007bff; }
        .solution { margin-top: 30px; border-top: 2px solid #ccc; padding-top: 20px; }
        .solution-step { margin: 15px 0; }
        .solution-image { margin: 10px 0; }
    </style>
</head>
<body>
    <div class="question">
        <h2>Question 35</h2>
        <p>Calculate: 29 + 32 = ?</p>
    </div>

    <div class="choices">
        <div class="choice">
            <img src="Gr7_10_2_1_36.png" alt="Choice A">
        </div>
        <div class="choice">
            <img src="Gr7_10_2_1_36.png" alt="Choice B">
        </div>

    </div>

    <div class="solution">
        <h3>Solution</h3>
        <div class="solution-step">
            <p>When you add two negative numbers, the answer is also negative.</p>
        </div>
        <div class="solution-step">
            <p>Start at –6 on the number line.</p>
        </div>
        <div class="solution-step">
            <p>You are adding –2, so move 2 steps to the left.</p>
        </div>
        <div class="solution-step">
            <p>–6 + (–2) = –8, so the arrow should start on -6 and land on -8.</p>
        </div>

    </div>
</body>
</html>
