<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr6_52_4_48</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
        }
        .item {
            display: inline-block;
        }
        svg {
            display: block;
        }
        .label {
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
        }
        .dimension {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="item" label="Gr6_52_4_48">
        <svg width="300" height="300" viewBox="0 0 300 300">
            <!-- Rectangle A (larger) - light blue -->
            <rect x="50" y="100" width="200" height="150"
                  fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>

            <!-- Rectangle B (smaller) - light red, on top-left -->
            <rect x="50" y="50" width="60" height="50"
                  fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>

            <!-- Label A -->
            <text x="150.0" y="175.0"
                  text-anchor="middle" dominant-baseline="middle"
                  class="label" fill="#1976D2">A</text>

            <!-- Label B -->
            <text x="80.0" y="75.0"
                  text-anchor="middle" dominant-baseline="middle"
                  class="label" fill="#C62828">B</text>

            <!-- Dimension labels for Rectangle A -->
            <!-- Width of A (bottom) -->
            <text x="150.0" y="268"
                  text-anchor="middle" class="dimension">20</text>

            <!-- Height of A (right side) -->
            <text x="260" y="175.0"
                  text-anchor="start" dominant-baseline="middle" class="dimension">15</text>

            <!-- Dimension labels for Rectangle B -->
            <!-- Width of B (top) -->
            <text x="80.0" y="42"
                  text-anchor="middle" class="dimension">6</text>

            <!-- Height of B (left side) -->
            <text x="40" y="75.0"
                  text-anchor="end" dominant-baseline="middle" class="dimension">5</text>
        </svg>
    </div>
</body>
</html>
