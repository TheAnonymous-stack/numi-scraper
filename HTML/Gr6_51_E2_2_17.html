<!DOCTYPE html>
<html>
 <head>
  <style>
   body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .polygon-container {
            margin: 20px 0;
            text-align: center;
        }
        .info {
            font-size: 14px;
            color: #666;
            margin-top: 15px;
        }
  </style>
 </head>
 <body>
  <div class="question">
   What is the sum of the exterior angle measures of this decagon?
  </div>
  <div class="polygon-container">
   <div class="visual-element item" label="Gr6_51_2_17_step_1">
    <svg height="300" viewbox="0 0 400 300" width="400">
     <!-- Decagon -->
     <polygon fill="lightblue" fill-opacity="0.3" points="200,70 247,85 276,125 276,175 247,215 200,230 153,215 124,175 124,125 153,85" stroke="black" stroke-width="2">
     </polygon>
     <!-- Exterior angle indicators -->
     <path d="M 190 70 A 15 15 0 0 1 200 60" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 237 85 A 15 15 0 0 1 247 75" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 266 125 A 15 15 0 0 1 276 115" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 266 175 A 15 15 0 0 1 276 165" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 237 215 A 15 15 0 0 1 247 205" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 190 230 A 15 15 0 0 1 200 220" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 143 215 A 15 15 0 0 1 153 205" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 114 175 A 15 15 0 0 1 124 165" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 114 125 A 15 15 0 0 1 124 115" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 143 85 A 15 15 0 0 1 153 75" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <!-- Label -->
     <text font-size="16" font-weight="bold" text-anchor="middle" x="200" y="250">
      Sum of exterior angles = 360°
     </text>
    </svg>
   </div>
  </div>
  <div class="info">
   For any convex polygon, the sum of exterior angles is always 360°
  </div>
 </body>
</html>
