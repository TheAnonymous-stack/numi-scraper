<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 5 - Week 48 - Exercise 2 - Question 2_1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .item {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="item" label="Gr5_48_2_1" style="width: 320px; height: 320px; display: inline-block;">
    <svg width="320" height="320" xmlns="http://www.w3.org/2000/svg">
        <!-- Angle sector (filled area) -->
        <path d="M 160 160
                 L 230.7 160.0
                 A 35 35 0 1 1 160.0 89.3
                 Z"
              fill="#9C27B0" opacity="0.2"/>

        <!-- Starting ray -->
        <line x1="160" y1="160" x2="260.0" y2="160.0"
              stroke="#333" stroke-width="3"/>

        <!-- Ending ray -->
        <line x1="160" y1="160" x2="160.0" y2="60.0"
              stroke="#333" stroke-width="3"/>

        <!-- Arc showing the angle -->
        <path d="M 260.0 160.0
                 A 100 100 0 1 1 160.0 60.0"
              fill="none" stroke="#9C27B0" stroke-width="3" opacity="0.7"/>

        <!-- Center point -->
        <circle cx="160" cy="160" r="4" fill="#333"/>

        <!-- Arrow marker -->
        <defs>
            <marker id="arrow_1" markerWidth="10" markerHeight="7"
                    refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#9C27B0"/>
            </marker>
        </defs>

        <!-- Arrow on arc -->
        <path d="M 239.8 165.6
                 A 80 80 0 1 1 154.4 80.2"
              fill="none" stroke="#9C27B0" stroke-width="2" marker-end="url(#arrow_1)" opacity="0.8"/>
    </svg>
</div>
</body>
</html>
