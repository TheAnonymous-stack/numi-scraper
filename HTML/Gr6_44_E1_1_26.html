<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hours of streaming per day.</title>
    <style>
        .item {
            display: inline-block;
            padding: 10px;
            background: #fff;
        }
        .histogram-container {
            font-family: Arial, sans-serif;
        }
        .chart-title {
            text-anchor: middle;
            font-size: 14px;
            font-weight: bold;
            fill: #333;
        }
        .axis-label {
            font-size: 12px;
            fill: #333;
        }
    </style>
</head>
<body>
    <div class="item" label="Gr6_44_1_26">
        <div class="histogram-container">
            <svg width="360" height="340" viewBox="0 0 360 340">
                <!-- Title -->
                <text x="180.0" y="20" class="chart-title">Hours of streaming per day.</text>

                <!-- Y-axis label -->
                <text x="15" y="150.0" class="axis-label" transform="rotate(-90, 15, 150.0)">Number of users</text>

                <!-- Y-axis ticks and grid lines -->
                
        <text x="50" y="264.0" text-anchor="end" font-size="10" fill="#333">0</text>
        <line x1="55" y1="260.0" x2="350" y2="260.0" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="220.0" text-anchor="end" font-size="10" fill="#333">5</text>
        <line x1="55" y1="216.0" x2="350" y2="216.0" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="176.0" text-anchor="end" font-size="10" fill="#333">10</text>
        <line x1="55" y1="172.0" x2="350" y2="172.0" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="132.0" text-anchor="end" font-size="10" fill="#333">15</text>
        <line x1="55" y1="128.0" x2="350" y2="128.0" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="88.0" text-anchor="end" font-size="10" fill="#333">20</text>
        <line x1="55" y1="84.0" x2="350" y2="84.0" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="43.99999999999997" text-anchor="end" font-size="10" fill="#333">25</text>
        <line x1="55" y1="39.99999999999997" x2="350" y2="39.99999999999997" stroke="#ddd" stroke-width="1" />
        

                <!-- Y-axis line -->
                <line x1="55" y1="30" x2="55" y2="260" stroke="#333" stroke-width="2" />

                <!-- X-axis line -->
                <line x1="55" y1="260" x2="350" y2="260" stroke="#333" stroke-width="2" />

                <!-- Bars -->
                
        <rect x="60" y="39.99999999999997" width="50" height="220.00000000000003" fill="#4CAF50" />
        <text x="85.0" y="280" text-anchor="middle" font-size="11" fill="#333">1-15</text>
        
        <rect x="120" y="207.2" width="50" height="52.800000000000004" fill="#4CAF50" />
        <text x="145.0" y="280" text-anchor="middle" font-size="11" fill="#333">16-30</text>
        
        <rect x="180" y="172.0" width="50" height="88.0" fill="#4CAF50" />
        <text x="205.0" y="280" text-anchor="middle" font-size="11" fill="#333">31-45</text>
        
        <rect x="240" y="172.0" width="50" height="88.0" fill="#4CAF50" />
        <text x="265.0" y="280" text-anchor="middle" font-size="11" fill="#333">46-60</text>
        
        <rect x="300" y="180.8" width="50" height="79.2" fill="#4CAF50" />
        <text x="325.0" y="280" text-anchor="middle" font-size="11" fill="#333">61-75</text>
        

                <!-- X-axis label -->
                <text x="180.0" y="320" class="axis-label" text-anchor="middle">Hours</text>
            </svg>
        </div>
    </div>
</body>
</html>
