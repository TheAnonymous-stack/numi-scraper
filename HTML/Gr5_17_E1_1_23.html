<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        .item {
            display: inline-block;
            width: fit-content;
            height: fit-content;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 18px;
        }
        .calculation {
            display: inline-block;
            vertical-align: top;
            margin: 0 5px;
        }
        .number {
            text-align: right;
            margin: 2px 0;
        }
        .line {
            border-top: 2px solid black;
            margin: 5px 0;
        }
        .highlight {
            background-color: #ffeb3b;
            padding: 0 2px;
        }
    </style>
</head>
<body>
    <!-- Question 1_23 -->
    <!-- The image shows a vertical subtraction problem with the numbers 38,100 and 8,960 aligned by place value. The calculation for the ones place is highlighted. -->
    <div class="item" label="Gr5_17_1_23_step_1">
        <div class="calculation">
            <div class="number">38,100</div>
            <div class="number">- 8,960</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">0</span></div>
        </div>
    </div>
    
    <!-- The image shows a vertical subtraction problem with the numbers 38,100 and 8,960 aligned by place value. The calculation for the tens place is highlighted. -->
    <div class="item" label="Gr5_17_1_23_step_2">
        <div class="calculation">
            <div class="number">38,100</div>
            <div class="number">- 8,960</div>
            <div class="line"></div>
            <div class="number">4<span class="highlight">0</span></div>
        </div>
    </div>
    
    <!-- The image shows a vertical subtraction problem with the numbers 38,100 and 8,960 aligned by place value. The calculation for the hundreds place is highlighted. -->
    <div class="item" label="Gr5_17_1_23_step_3">
        <div class="calculation">
            <div class="number">38,100</div>
            <div class="number">- 8,960</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">1</span>40</div>
        </div>
    </div>
    
    <!-- The image shows a vertical subtraction problem with the numbers 38,100 and 8,960 aligned by place value. The calculation for the thousands place is highlighted. -->
    <div class="item" label="Gr5_17_1_23_step_4">
        <div class="calculation">
            <div class="number">38,100</div>
            <div class="number">- 8,960</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">29</span>,140</div>
        </div>
    </div>
    
    <!-- The image shows a vertical subtraction problem with the numbers 38,100 and 8,960 aligned by place value. The calculation for the ten-thousands place is highlighted. -->
    <div class="item" label="Gr5_17_1_23_step_5">
        <div class="calculation">
            <div class="number">38,100</div>
            <div class="number">- 8,960</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">29</span>,140</div>
        </div>
    </div>
</body>
</html>
