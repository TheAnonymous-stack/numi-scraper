<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .polygon-container {
            margin: 20px 0;
            text-align: center;
        }
        .info {
            font-size: 14px;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="question">What is the sum of the exterior angle measures of this quadrilateral?</div>
    
    <div class="polygon-container">
        <svg width="400" height="300" viewBox="0 0 400 300">
            <!-- Quadrilateral -->
            <polygon points="200,70 280,150 200,230 120,150" fill="lightblue" fill-opacity="0.3" stroke="black" stroke-width="2"/>
            
            <!-- Exterior angle indicators -->
            
            <path d="M 190 70 A 15 15 0 0 1 200 60" 
                  fill="none" stroke="red" stroke-width="1.5" opacity="0.7"/>
            <path d="M 270 150 A 15 15 0 0 1 280 140" 
                  fill="none" stroke="red" stroke-width="1.5" opacity="0.7"/>
            <path d="M 190 230 A 15 15 0 0 1 200 220" 
                  fill="none" stroke="red" stroke-width="1.5" opacity="0.7"/>
            <path d="M 110 150 A 15 15 0 0 1 120 140" 
                  fill="none" stroke="red" stroke-width="1.5" opacity="0.7"/>
            
            <!-- Label -->
            <text x="200" y="250" font-size="16" text-anchor="middle" font-weight="bold">
                Sum of exterior angles = 360°
            </text>
        </svg>
    </div>
    
    <div class="info">
        For any convex polygon, the sum of exterior angles is always 360°
    </div>
</body>
</html>
