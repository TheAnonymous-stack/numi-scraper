<!DOCTYPE html>
<html>
 <head>
  <style>
   body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .polygon-container {
            margin: 20px 0;
            text-align: center;
        }
        .given-angles {
            font-size: 14px;
            margin-top: 15px;
            color: #333;
        }
  </style>
 </head>
 <body>
  <div class="question">
   In this hexagon, the angles are 116, 97, 124, 113° and one angle marked as y. Find y.
y = °
  </div>
  <div class="polygon-container">
   <div class="visual-element item" label="Gr6_51_1_18_step_1">
    <svg height="300" viewbox="0 0 400 300" width="400">
     <!-- Hexagon with 6 sides -->
     <polygon fill="lightyellow" fill-opacity="0.3" points="200,50 287,100 287,200 200,250 113,200 113,100" stroke="black" stroke-width="2">
     </polygon>
     <!-- Angle labels and vertices -->
     <circle cx="200" cy="50" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="200" y="80">
      116°
     </text>
     <circle cx="287" cy="100" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="261" y="115">
      97°
     </text>
     <circle cx="287" cy="200" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="261" y="185">
      124°
     </text>
     <circle cx="200" cy="250" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="200" y="220">
      113°
     </text>
     <circle cx="113" cy="200" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="139" y="185">
      135°
     </text>
     <circle cx="113" cy="100" fill="red" r="3">
     </circle>
     <text fill="red" font-size="16" font-weight="bold" text-anchor="middle" x="139" y="115">
      y
     </text>
    </svg>
   </div>
  </div>
  <div class="given-angles">
   Given angles: 116°, 97°, 124°, 113°, 135°
  </div>
 </body>
</html>
