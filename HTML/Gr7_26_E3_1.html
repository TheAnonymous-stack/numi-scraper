<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr7_26_E3_1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
        }
        .item {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
        }
        .graph-container {
            width: 400px;
            height: 400px;
            position: relative;
        }
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main problem graph -->
        <div class="item" label="Gr7_26_3_2">
            <div class="graph-container">
                <svg viewBox="0 0 400 400">
                    <!-- Grid lines -->
                    <defs>
                        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="1"/>
                        </pattern>
                    </defs>
                    <rect width="400" height="400" fill="white"/>
                    <rect width="400" height="400" fill="url(#grid)" />

                    <!-- Axes -->
                    <line x1="40" y1="360" x2="380" y2="360" stroke="black" stroke-width="2"/>
                    <line x1="40" y1="20" x2="40" y2="360" stroke="black" stroke-width="2"/>

                    <!-- Arrow heads -->
                    <polygon points="380,360 375,355 375,365" fill="black"/>
                    <polygon points="40,20 35,25 45,25" fill="black"/>

                    <!-- Axis labels -->
                    <text x="200" y="395" text-anchor="middle" font-size="14">Laps (x)</text>
                    <text x="15" y="200" text-anchor="middle" font-size="14" transform="rotate(-90 15 200)">Money Raised (y)</text>

                    <!-- Scale marks and numbers on x-axis -->
                    <text x="40" y="380" text-anchor="middle" font-size="12">0</text>
                    <text x="80" y="380" text-anchor="middle" font-size="12">1</text>
                    <text x="120" y="380" text-anchor="middle" font-size="12">2</text>
                    <text x="160" y="380" text-anchor="middle" font-size="12">3</text>
                    <text x="200" y="380" text-anchor="middle" font-size="12">4</text>
                    <text x="240" y="380" text-anchor="middle" font-size="12">5</text>
                    <text x="280" y="380" text-anchor="middle" font-size="12">6</text>
                    <text x="320" y="380" text-anchor="middle" font-size="12">7</text>
                    <text x="360" y="380" text-anchor="middle" font-size="12">8</text>

                    <!-- Scale marks and numbers on y-axis -->
                    <text x="25" y="325" text-anchor="end" font-size="12">7</text>
                    <text x="25" y="285" text-anchor="end" font-size="12">14</text>
                    <text x="25" y="245" text-anchor="end" font-size="12">21</text>
                    <text x="25" y="205" text-anchor="end" font-size="12">28</text>
                    <text x="25" y="165" text-anchor="end" font-size="12">35</text>
                    <text x="25" y="125" text-anchor="end" font-size="12">42</text>
                    <text x="25" y="85" text-anchor="end" font-size="12">49</text>
                    <text x="25" y="45" text-anchor="end" font-size="12">56</text>

                    <!-- Proportional relationship line -->
                    <line x1="40" y1="360" x2="360" y2="40" stroke="#4169E1" stroke-width="2"/>

                    <!-- Point (1, 7) -->
                    <circle cx="80" cy="320" r="5" fill="#FF6347"/>
                </svg>
            </div>
        </div>

        <!-- Solution graph with highlighted point -->
        <div class="item" label="Gr7_26_3_1_step_2">
            <div class="graph-container">
                <svg viewBox="0 0 400 400">
                    <!-- Grid lines -->
                    <rect width="400" height="400" fill="white"/>
                    <rect width="400" height="400" fill="url(#grid)" />

                    <!-- Axes -->
                    <line x1="40" y1="360" x2="380" y2="360" stroke="black" stroke-width="2"/>
                    <line x1="40" y1="20" x2="40" y2="360" stroke="black" stroke-width="2"/>

                    <!-- Arrow heads -->
                    <polygon points="380,360 375,355 375,365" fill="black"/>
                    <polygon points="40,20 35,25 45,25" fill="black"/>

                    <!-- Axis labels -->
                    <text x="200" y="395" text-anchor="middle" font-size="14">Laps (x)</text>
                    <text x="15" y="200" text-anchor="middle" font-size="14" transform="rotate(-90 15 200)">Money Raised (y)</text>

                    <!-- Scale marks and numbers on x-axis -->
                    <text x="40" y="380" text-anchor="middle" font-size="12">0</text>
                    <text x="80" y="380" text-anchor="middle" font-size="12">1</text>
                    <text x="120" y="380" text-anchor="middle" font-size="12">2</text>
                    <text x="160" y="380" text-anchor="middle" font-size="12">3</text>
                    <text x="200" y="380" text-anchor="middle" font-size="12">4</text>
                    <text x="240" y="380" text-anchor="middle" font-size="12">5</text>
                    <text x="280" y="380" text-anchor="middle" font-size="12">6</text>
                    <text x="320" y="380" text-anchor="middle" font-size="12">7</text>
                    <text x="360" y="380" text-anchor="middle" font-size="12">8</text>

                    <!-- Scale marks and numbers on y-axis -->
                    <text x="25" y="325" text-anchor="end" font-size="12">7</text>
                    <text x="25" y="285" text-anchor="end" font-size="12">14</text>
                    <text x="25" y="245" text-anchor="end" font-size="12">21</text>
                    <text x="25" y="205" text-anchor="end" font-size="12">28</text>
                    <text x="25" y="165" text-anchor="end" font-size="12">35</text>
                    <text x="25" y="125" text-anchor="end" font-size="12">42</text>
                    <text x="25" y="85" text-anchor="end" font-size="12">49</text>
                    <text x="25" y="45" text-anchor="end" font-size="12">56</text>

                    <!-- Proportional relationship line -->
                    <line x1="40" y1="360" x2="360" y2="40" stroke="#4169E1" stroke-width="2"/>

                    <!-- Highlighted point (1, 7) -->
                    <circle cx="80" cy="320" r="6" fill="#FF6347" stroke="black" stroke-width="2"/>
                    <text x="95" y="315" font-size="14" font-weight="bold">(1, 7)</text>

                    <!-- Origin point -->
                    <circle cx="40" cy="360" r="5" fill="#32CD32"/>
                    <text x="50" y="350" font-size="12">(0, 0)</text>
                </svg>
            </div>
            <div style="margin-top: 10px; text-align: center; font-size: 16px; color: #666;">
                Constant of proportionality = 7 dollars per lap
            </div>
        </div>
    </div>
</body>
</html>
