<!DOCTYPE html>
<html>
 <head>
  <style>
   body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .polygon-container {
            margin: 20px 0;
            text-align: center;
        }
        .given-angles {
            font-size: 14px;
            margin-top: 15px;
            color: #333;
        }
  </style>
 </head>
 <body>
  <div class="question">
   In this heptagon, the angles are 132, 141, 108, 132, 124° and one angle marked as x. Find x.
x = °
  </div>
  <div class="polygon-container">
   <div class="visual-element item" label="Gr6_51_1_5_step_1">
    <svg height="300" viewbox="0 0 400 300" width="400">
     <!-- Heptagon with 7 sides -->
     <polygon fill="lightyellow" fill-opacity="0.3" points="200,50 278,88 297,172 243,240 157,240 103,172 122,88" stroke="black" stroke-width="2">
     </polygon>
     <!-- Angle labels and vertices -->
     <circle cx="200" cy="50" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="200" y="80">
      132°
     </text>
     <circle cx="278" cy="88" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="255" y="106">
      141°
     </text>
     <circle cx="297" cy="172" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="268" y="166">
      108°
     </text>
     <circle cx="243" cy="240" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="230" y="213">
      132°
     </text>
     <circle cx="157" cy="240" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="170" y="213">
      124°
     </text>
     <circle cx="103" cy="172" fill="black" r="3">
     </circle>
     <text fill="black" font-size="14" text-anchor="middle" x="132" y="166">
      133°
     </text>
     <circle cx="122" cy="88" fill="red" r="3">
     </circle>
     <text fill="red" font-size="16" font-weight="bold" text-anchor="middle" x="145" y="106">
      x
     </text>
    </svg>
   </div>
  </div>
  <div class="given-angles">
   Given angles: 132°, 141°, 108°, 132°, 124°, 133°
  </div>
 </body>
</html>
