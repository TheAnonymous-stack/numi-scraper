<!DOCTYPE html>
<html>
<head>
        <style>
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            background: white;
            display: inline-block;
        }
        .container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }
        .fraction-model {
            text-align: center;
        }
        .fraction-label {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="fraction-model">
            <div class="fraction-label">3/8</div>
            <svg width="100" height="100" viewBox="0 0 100 100">
    <!-- Circle divided into 8 equal wedges -->
    <circle cx="50" cy="50" r="35" fill="white" stroke="black" stroke-width="2"/>

    <!-- 3 out of 8 wedges shaded in specified color -->
    <path d="M 50 50 L 50.00 15.00 A 35 35 0 0 1 74.75 25.25 Z" fill="#90EE90" fill-opacity="0.7"/>
    <path d="M 50 50 L 74.75 25.25 A 35 35 0 0 1 85.00 50.00 Z" fill="#90EE90" fill-opacity="0.7"/>
    <path d="M 50 50 L 85.00 50.00 A 35 35 0 0 1 74.75 74.75 Z" fill="#90EE90" fill-opacity="0.7"/>

    <!-- Lines dividing the circle -->
    <line x1="50" y1="50" x2="50.00" y2="15.00" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="74.75" y2="25.25" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="85.00" y2="50.00" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="74.75" y2="74.75" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="50.00" y2="85.00" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="25.25" y2="74.75" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="15.00" y2="50.00" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="25.25" y2="25.25" stroke="black" stroke-width="1"/>
</svg>
        </div>
        <div class="fraction-model">
            <div class="fraction-label">3/4</div>
            <svg width="100" height="100" viewBox="0 0 100 100">
    <!-- Circle divided into 4 equal wedges -->
    <circle cx="50" cy="50" r="35" fill="white" stroke="black" stroke-width="2"/>

    <!-- 3 out of 4 wedges shaded in specified color -->
    <path d="M 50 50 L 50.00 15.00 A 35 35 0 0 1 85.00 50.00 Z" fill="#DDA0DD" fill-opacity="0.7"/>
    <path d="M 50 50 L 85.00 50.00 A 35 35 0 0 1 50.00 85.00 Z" fill="#DDA0DD" fill-opacity="0.7"/>
    <path d="M 50 50 L 50.00 85.00 A 35 35 0 0 1 15.00 50.00 Z" fill="#DDA0DD" fill-opacity="0.7"/>

    <!-- Lines dividing the circle -->
    <line x1="50" y1="50" x2="50.00" y2="15.00" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="85.00" y2="50.00" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="50.00" y2="85.00" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="15.00" y2="50.00" stroke="black" stroke-width="1"/>
</svg>
        </div>
    </div>
</body>
</html>
