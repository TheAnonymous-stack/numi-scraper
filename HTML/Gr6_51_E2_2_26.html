<!DOCTYPE html>
<html>
 <head>
  <style>
   body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .polygon-container {
            margin: 20px 0;
            text-align: center;
        }
        .info {
            font-size: 14px;
            color: #666;
            margin-top: 15px;
        }
  </style>
 </head>
 <body>
  <div class="question">
   What is the sum of the exterior angle measures of this octagon?
  </div>
  <div class="polygon-container">
   <div class="visual-element item" label="Gr6_51_2_26_step_1">
    <svg height="300" viewbox="0 0 400 300" width="400">
     <!-- Octagon -->
     <polygon fill="lightblue" fill-opacity="0.3" points="200,70 257,93 280,150 257,207 200,230 143,207 120,150 143,93" stroke="black" stroke-width="2">
     </polygon>
     <!-- Exterior angle indicators -->
     <path d="M 190 70 A 15 15 0 0 1 200 60" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 247 93 A 15 15 0 0 1 257 83" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 270 150 A 15 15 0 0 1 280 140" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 247 207 A 15 15 0 0 1 257 197" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 190 230 A 15 15 0 0 1 200 220" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 133 207 A 15 15 0 0 1 143 197" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 110 150 A 15 15 0 0 1 120 140" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 133 93 A 15 15 0 0 1 143 83" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <!-- Label -->
     <text font-size="16" font-weight="bold" text-anchor="middle" x="200" y="250">
      Sum of exterior angles = 360°
     </text>
    </svg>
   </div>
  </div>
  <div class="info">
   For any convex polygon, the sum of exterior angles is always 360°
  </div>
 </body>
</html>
