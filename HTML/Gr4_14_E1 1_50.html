<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr4_14_E1 Question 1_50</title>
    <style>
        .item {
            margin: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Gr4_14_E1 Question 1_50</h1>

    <!-- Two aligned horizontal number lines from 0 to 2. The top number line shows fifteenths with a green diamond marking 18/15. The bottom number line shows fifths with a blue diamond marking 6/5. Both diamonds are at the same horizontal position (1.2), demonstrating that 18/15 and 6/5 are equivalent fractions. -->
    <div class="item" label="Gr4_14_1_50_step_1" style="display: inline-block; padding: 10px;">
<svg width="500" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Top number line: 0 to 2 in fifteenths -->
  <line x1="40" y1="50" x2="460" y2="50" stroke="black" stroke-width="2"/>

  <!-- Major ticks at 0, 1, 2 -->
  <line x1="40" y1="40" x2="40" y2="60" stroke="black" stroke-width="2"/>
  <text x="40" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">0</text>

  <line x1="250" y1="40" x2="250" y2="60" stroke="black" stroke-width="2"/>
  <text x="250" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">1</text>

  <line x1="460" y1="40" x2="460" y2="60" stroke="black" stroke-width="2"/>
  <text x="460" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">2</text>

  <!-- Minor ticks for fifteenths (210px per unit, so 14px per fifteenth) -->
  <line x1="54" y1="45" x2="54" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="68" y1="45" x2="68" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="82" y1="45" x2="82" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="96" y1="45" x2="96" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="110" y1="45" x2="110" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="124" y1="45" x2="124" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="138" y1="45" x2="138" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="152" y1="45" x2="152" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="166" y1="45" x2="166" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="180" y1="45" x2="180" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="194" y1="45" x2="194" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="208" y1="45" x2="208" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="222" y1="45" x2="222" y2="55" stroke="gray" stroke-width="1"/>
  <line x1="236" y1="45" x2="236" y2="55" stroke="gray" stroke-width="1"/>

  <!-- Green diamond at 18/15 = 1.2 (x = 40 + 1.2 * 210 = 292) -->
  <polygon points="292,42 302,50 292,58 282,50" fill="green" stroke="black" stroke-width="1"/>
  <text x="292" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="green">18/15</text>

  <!-- Bottom number line: 0 to 2 in fifths -->
  <line x1="40" y1="100" x2="460" y2="100" stroke="black" stroke-width="2"/>

  <!-- Major ticks at 0, 1, 2 -->
  <line x1="40" y1="90" x2="40" y2="110" stroke="black" stroke-width="2"/>
  <text x="40" y="125" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">0</text>

  <line x1="250" y1="90" x2="250" y2="110" stroke="black" stroke-width="2"/>
  <text x="250" y="125" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">1</text>

  <line x1="460" y1="90" x2="460" y2="110" stroke="black" stroke-width="2"/>
  <text x="460" y="125" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">2</text>

  <!-- Ticks for fifths (42px per fifth) -->
  <line x1="82" y1="95" x2="82" y2="105" stroke="gray" stroke-width="1"/>
  <text x="82" y="88" text-anchor="middle" font-family="Arial" font-size="9">1/5</text>
  <line x1="124" y1="95" x2="124" y2="105" stroke="gray" stroke-width="1"/>
  <text x="124" y="88" text-anchor="middle" font-family="Arial" font-size="9">2/5</text>
  <line x1="166" y1="95" x2="166" y2="105" stroke="gray" stroke-width="1"/>
  <text x="166" y="88" text-anchor="middle" font-family="Arial" font-size="9">3/5</text>
  <line x1="208" y1="95" x2="208" y2="105" stroke="gray" stroke-width="1"/>
  <text x="208" y="88" text-anchor="middle" font-family="Arial" font-size="9">4/5</text>
  <line x1="292" y1="95" x2="292" y2="105" stroke="gray" stroke-width="1"/>
  <text x="292" y="88" text-anchor="middle" font-family="Arial" font-size="9">6/5</text>
  <line x1="334" y1="95" x2="334" y2="105" stroke="gray" stroke-width="1"/>
  <text x="334" y="88" text-anchor="middle" font-family="Arial" font-size="9">7/5</text>
  <line x1="376" y1="95" x2="376" y2="105" stroke="gray" stroke-width="1"/>
  <text x="376" y="88" text-anchor="middle" font-family="Arial" font-size="9">8/5</text>
  <line x1="418" y1="95" x2="418" y2="105" stroke="gray" stroke-width="1"/>
  <text x="418" y="88" text-anchor="middle" font-family="Arial" font-size="9">9/5</text>

  <!-- Blue diamond at 6/5 = 1.2 (x = 40 + 1.2 * 210 = 292) -->
  <polygon points="292,92 302,100 292,108 282,100" fill="blue" stroke="black" stroke-width="1"/>
  <text x="292" y="140" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="blue">6/5</text>

  <!-- Dashed line connecting the two diamonds -->
  <line x1="292" y1="58" x2="292" y2="92" stroke="purple" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
    </div>

</body>
</html>
