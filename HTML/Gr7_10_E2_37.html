<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr7_10_E2 2_37</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .number-line {
            position: relative;
            width: 100%;
            height: 100px;
            margin: 30px 0;
        }
        .line {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: #333;
        }
        .tick {
            position: absolute;
            top: 45%;
            width: 2px;
            height: 10px;
            background: #333;
        }
        .number {
            position: absolute;
            top: 60%;
            transform: translateX(-50%);
            font-size: 14px;
        }
        .arrow {
            position: absolute;
            top: 30%;
            height: 30px;
        }
        .arrow-path {
            stroke: #4169E1;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }
        .point {
            position: absolute;
            top: 48%;
            width: 8px;
            height: 8px;
            background: #FF0000;
            border-radius: 50%;
            transform: translateX(-50%);
        }
        .operation {
            font-size: 24px;
            margin: 20px 0;
            font-weight: bold;
        }
        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 10px;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Addition with Number Lines</h2>
    <div class="operation">-46 + 43 = ?</div>

        <div class="number-line">

            <div class="tick" style="left: 10.0%;"></div>

            <div class="number" style="left: 17.547169811320757%;">-46</div>
            <div class="tick" style="left: 25.09433962264151%;"></div>
            <div class="number" style="left: 25.09433962264151%;">-41</div>
            <div class="tick" style="left: 32.64150943396226%;"></div>
            <div class="number" style="left: 32.64150943396226%;">-36</div>
            <div class="tick" style="left: 40.18867924528302%;"></div>
            <div class="number" style="left: 40.18867924528302%;">-31</div>
            <div class="tick" style="left: 47.735849056603776%;"></div>
            <div class="number" style="left: 47.735849056603776%;">-26</div>

            <div class="number" style="left: 55.283018867924525%;">-21</div>
            <div class="tick" style="left: 62.83018867924528%;"></div>
            <div class="number" style="left: 62.83018867924528%;">-16</div>
            <div class="tick" style="left: 70.37735849056604%;"></div>

            <div class="point" style="left: 17.547169811320757%;"></div>
            <svg class="arrow" style="left: 17.547169811320757%; width: 64.90566037735849%;">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="10" 
                            refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#4169E1" />
                    </marker>
                </defs>
                <path class="arrow-path" d="M 0 15 
                                              Q 50% 0 
                                                100% 15" />
            </svg>
        </div>
        <p>Starting at -46, move 43 units to the right to reach -3</p>
    </div>
    <h3>Solution Steps:</h3>
    <div class="item" label="Gr7_10_2_37_step_2)">
        <label>Step 1: Number line with a point marked at -46</label>
    </div>
    <div class="item" label="Gr7_10_2_37_step_3)">
        <label>Step 2: Number line with an arrow from -46 moving right 43 units to -3</label>
    </div>
</body>
</html>
