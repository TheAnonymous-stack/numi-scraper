<!DOCTYPE html>
<html>
<head>
        <style>
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            background: white;
            display: inline-block;
        }
        .container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }
        .fraction-model {
            text-align: center;
        }
        .fraction-label {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="fraction-model">
            <div class="fraction-label">5/10</div>
            <svg width="100" height="100" viewBox="0 0 100 100">
    <!-- Circle divided into 10 equal wedges -->
    <circle cx="50" cy="50" r="35" fill="white" stroke="black" stroke-width="2"/>

    <!-- 5 out of 10 wedges shaded in specified color -->
    <path d="M 50 50 L 50.00 15.00 A 35 35 0 0 1 70.57 21.68 Z" fill="#90EE90" fill-opacity="0.7"/>
    <path d="M 50 50 L 70.57 21.68 A 35 35 0 0 1 83.29 39.18 Z" fill="#90EE90" fill-opacity="0.7"/>
    <path d="M 50 50 L 83.29 39.18 A 35 35 0 0 1 83.29 60.82 Z" fill="#90EE90" fill-opacity="0.7"/>
    <path d="M 50 50 L 83.29 60.82 A 35 35 0 0 1 70.57 78.32 Z" fill="#90EE90" fill-opacity="0.7"/>
    <path d="M 50 50 L 70.57 78.32 A 35 35 0 0 1 50.00 85.00 Z" fill="#90EE90" fill-opacity="0.7"/>

    <!-- Lines dividing the circle -->
    <line x1="50" y1="50" x2="50.00" y2="15.00" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="70.57" y2="21.68" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="83.29" y2="39.18" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="83.29" y2="60.82" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="70.57" y2="78.32" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="50.00" y2="85.00" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="29.43" y2="78.32" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="16.71" y2="60.82" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="16.71" y2="39.18" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="29.43" y2="21.68" stroke="black" stroke-width="1"/>
</svg>
        </div>
        <div class="fraction-model">
            <div class="fraction-label">5/6</div>
            <svg width="100" height="100" viewBox="0 0 100 100">
    <!-- Circle divided into 6 equal wedges -->
    <circle cx="50" cy="50" r="35" fill="white" stroke="black" stroke-width="2"/>

    <!-- 5 out of 6 wedges shaded in specified color -->
    <path d="M 50 50 L 50.00 15.00 A 35 35 0 0 1 80.31 32.50 Z" fill="#DDA0DD" fill-opacity="0.7"/>
    <path d="M 50 50 L 80.31 32.50 A 35 35 0 0 1 80.31 67.50 Z" fill="#DDA0DD" fill-opacity="0.7"/>
    <path d="M 50 50 L 80.31 67.50 A 35 35 0 0 1 50.00 85.00 Z" fill="#DDA0DD" fill-opacity="0.7"/>
    <path d="M 50 50 L 50.00 85.00 A 35 35 0 0 1 19.69 67.50 Z" fill="#DDA0DD" fill-opacity="0.7"/>
    <path d="M 50 50 L 19.69 67.50 A 35 35 0 0 1 19.69 32.50 Z" fill="#DDA0DD" fill-opacity="0.7"/>

    <!-- Lines dividing the circle -->
    <line x1="50" y1="50" x2="50.00" y2="15.00" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="80.31" y2="32.50" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="80.31" y2="67.50" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="50.00" y2="85.00" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="19.69" y2="67.50" stroke="black" stroke-width="1"/>
    <line x1="50" y1="50" x2="19.69" y2="32.50" stroke="black" stroke-width="1"/>
</svg>
        </div>
    </div>
</body>
</html>
