<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            width: fit-content;
            height: fit-content;
        }
        .circles-grid {
            display: inline-block;
            padding: 2px;
        }
        .circle-row {
            display: flex;
            margin: 1px 0;
        }
        .circle {
            width: 16px;
            height: 16px;
            background-color: green;
            border-radius: 50%;
            margin: 1px;
        }
        .number-line {
            position: relative;
            width: 810px;
            height: 85px;
            padding: 0;
        }
        .line {
            position: absolute;
            top: 50px;
            height: 2px;
            background-color: black;
            width: 800px;
            left: 5px;
        }
        .tick {
            position: absolute;
            top: 45px;
            width: 2px;
            height: 10px;
            background-color: black;
        }
        .number {
            position: absolute;
            top: 60px;
            font-size: 12px;
            transform: translateX(-50%);
        }
        .arrow {
            position: absolute;
            top: 20px;
            width: 80px;
            height: 25px;
            border: 2px solid blue;
            border-bottom: none;
            border-radius: 25px 25px 0 0;
        }
        .result-box {
            position: absolute;
            top: 55px;
            transform: translateX(-50%);
            padding: 2px 6px;
            border: 2px solid blue;
            background-color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Step 1: 7 rows of 8 circles -->
    <div class="item" label="Gr5_15_1_37_step_1">
        <div class="circles-grid">
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
        </div>
    </div>

    <!-- Step 2: Number line with 7 jumps of 8 -->
    <div class="item" label="Gr5_15_1_37_step_2">
        <div class="number-line">
            <div class="line"></div>
            <!-- Ticks and numbers -->
            <div class="tick" style="left: 5px;"></div>
            <div class="number" style="left: 5px;">0</div>
            <div class="tick" style="left: 85px;"></div>
            <div class="number" style="left: 85px;">8</div>
            <div class="tick" style="left: 165px;"></div>
            <div class="number" style="left: 165px;">16</div>
            <div class="tick" style="left: 245px;"></div>
            <div class="number" style="left: 245px;">24</div>
            <div class="tick" style="left: 325px;"></div>
            <div class="number" style="left: 325px;">32</div>
            <div class="tick" style="left: 405px;"></div>
            <div class="number" style="left: 405px;">40</div>
            <div class="tick" style="left: 485px;"></div>
            <div class="number" style="left: 485px;">48</div>
            <div class="tick" style="left: 565px;"></div>
            <div class="number" style="left: 565px;">56</div>
            <div class="tick" style="left: 645px;"></div>
            <div class="number" style="left: 645px;">64</div>
            <div class="tick" style="left: 725px;"></div>
            <div class="number" style="left: 725px;">72</div>
            <div class="tick" style="left: 805px;"></div>
            <div class="number" style="left: 805px;">80</div>
            <!-- Arrows showing jumps -->
            <div class="arrow" style="left: 5px;"></div>
            <div class="arrow" style="left: 85px;"></div>
            <div class="arrow" style="left: 165px;"></div>
            <div class="arrow" style="left: 245px;"></div>
            <div class="arrow" style="left: 325px;"></div>
            <div class="arrow" style="left: 405px;"></div>
            <div class="arrow" style="left: 485px;"></div>
            <!-- Result box at 56 -->
            <div class="result-box" style="left: 565px;">56</div>
        </div>
    </div>
</body>
</html>
