<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            margin: 10px;
        }
        .circles-grid {
            display: inline-block;
        }
        .circle-row {
            display: flex;
            margin: 2px 0;
        }
        .circle {
            width: 20px;
            height: 20px;
            background-color: green;
            border-radius: 50%;
            margin: 2px;
        }
        .number-line {
            position: relative;
            width: fit-content;
            height: 80px;
            margin-top: 20px;
        }
        .line {
            position: absolute;
            top: 50px;
            height: 2px;
            background-color: black;
            width: 700px;
        }
        .tick {
            position: absolute;
            top: 45px;
            width: 2px;
            height: 10px;
            background-color: black;
        }
        .number {
            position: absolute;
            top: 60px;
            font-size: 12px;
            transform: translateX(-50%);
        }
        .arrow {
            position: absolute;
            top: 20px;
            width: 70px;
            height: 25px;
            border: 2px solid blue;
            border-bottom: none;
            border-radius: 35px 35px 0 0;
        }
        .result-box {
            position: absolute;
            top: 55px;
            transform: translateX(-50%);
            padding: 2px 6px;
            border: 2px solid blue;
            background-color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Step 1: 10 rows of 7 circles -->
    <div class="item" label="Gr5_15_1_17_step_1">
        <div class="circles-grid">
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
        </div>
    </div>

    <!-- Step 2: Number line with 10 jumps of 7 -->
    <div class="item" label="Gr5_15_1_17_step_2">
        <div class="number-line">
            <div class="line"></div>
            <!-- Ticks and numbers -->
            <div class="tick" style="left: 0px;"></div>
            <div class="number" style="left: 0px;">0</div>
            <div class="tick" style="left: 70px;"></div>
            <div class="number" style="left: 70px;">7</div>
            <div class="tick" style="left: 140px;"></div>
            <div class="number" style="left: 140px;">14</div>
            <div class="tick" style="left: 210px;"></div>
            <div class="number" style="left: 210px;">21</div>
            <div class="tick" style="left: 280px;"></div>
            <div class="number" style="left: 280px;">28</div>
            <div class="tick" style="left: 350px;"></div>
            <div class="number" style="left: 350px;">35</div>
            <div class="tick" style="left: 420px;"></div>
            <div class="number" style="left: 420px;">42</div>
            <div class="tick" style="left: 490px;"></div>
            <div class="number" style="left: 490px;">49</div>
            <div class="tick" style="left: 560px;"></div>
            <div class="number" style="left: 560px;">56</div>
            <div class="tick" style="left: 630px;"></div>
            <div class="number" style="left: 630px;">63</div>
            <div class="tick" style="left: 700px;"></div>
            <div class="number" style="left: 700px;">70</div>
            <!-- 10 Arrows -->
            <div class="arrow" style="left: 0px;"></div>
            <div class="arrow" style="left: 70px;"></div>
            <div class="arrow" style="left: 140px;"></div>
            <div class="arrow" style="left: 210px;"></div>
            <div class="arrow" style="left: 280px;"></div>
            <div class="arrow" style="left: 350px;"></div>
            <div class="arrow" style="left: 420px;"></div>
            <div class="arrow" style="left: 490px;"></div>
            <div class="arrow" style="left: 560px;"></div>
            <div class="arrow" style="left: 630px;"></div>
            <!-- Result box -->
            <div class="result-box" style="left: 700px;">70</div>
        </div>
    </div>
</body>
</html>
