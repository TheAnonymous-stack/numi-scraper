<!DOCTYPE html>
<html>
 <head>
  <style>
   body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .trapezoid-container {
            margin: 30px 0;
            text-align: center;
        }
        .options {
            margin: 30px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option:hover {
            background-color: #f0f8ff;
            border-color: #4CAF50;
            transform: scale(1.02);
        }
        .option-label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
  </style>
 </head>
 <body>
  <div class="question">
   Maggie cuts a trapezoid along the vertical dashed line through the middle. Which two shapes does she make?
  </div>
  <div class="trapezoid-container">
   <div class="visual-element item" label="Gr6_52_1_19_step_1">
    <svg height="250" viewbox="0 0 500 250" width="500">
     <!-- Trapezoid -->
     <polygon fill="lightblue" points="150,70 350,70 380,180 120,180" stroke="black" stroke-width="2">
     </polygon>
     <!-- Vertical cutting line -->
     <line stroke="red" stroke-dasharray="5,5" stroke-width="2" x1="250" x2="250" y1="70" y2="180">
     </line>
     <!-- Dimensions -->
     <text font-size="12" text-anchor="middle" x="250" y="60">
      Top: 200
     </text>
     <text font-size="12" text-anchor="middle" x="250" y="200">
      Bottom: 260
     </text>
     <text font-size="12" text-anchor="middle" x="100" y="125">
      H: 110
     </text>
     <!-- Cut label -->
     <text fill="red" font-size="11" x="260" y="125">
      cut line
     </text>
     <!-- Arrows showing the cut -->
     <path d="M 235 100 L 245 100 M 240 95 L 240 105" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 255 100 L 265 100 M 260 95 L 260 105" stroke="red" stroke-width="1.5">
     </path>
    </svg>
   </div>
  </div>
  <div class="options">
   <div class="option">
    <div class="option-label">
     A) Two identical trapezoids
    </div>
    <div class="visual-element item" label="Gr6_52_1_19_step_2">
     <svg height="100" viewbox="0 0 200 100" width="200">
      <polygon fill="#FFE4B5" points="30,25 55,25 60,75 25,75" stroke="black" stroke-width="1.5">
      </polygon>
      <polygon fill="#FFE4B5" points="90,25 115,25 120,75 85,75" stroke="black" stroke-width="1.5">
      </polygon>
      <text font-size="10" text-anchor="middle" x="42" y="50">
       Trap 1
      </text>
      <text font-size="10" text-anchor="middle" x="102" y="50">
       Trap 2
      </text>
     </svg>
    </div>
   </div>
   <div class="option">
    <div class="option-label">
     B) Two triangles
    </div>
    <div class="visual-element item" label="Gr6_52_1_20">
     <svg height="100" viewbox="0 0 200 100" width="200">
      <polygon fill="#90EE90" points="40,25 70,25 55,75" stroke="black" stroke-width="1.5">
      </polygon>
      <polygon fill="#90EE90" points="90,25 120,25 105,75" stroke="black" stroke-width="1.5">
      </polygon>
      <text font-size="10" text-anchor="middle" x="55" y="50">
       Tri 1
      </text>
      <text font-size="10" text-anchor="middle" x="105" y="50">
       Tri 2
      </text>
     </svg>
    </div>
   </div>
   <div class="option">
    <div class="option-label">
     C) Rectangle and parallelogram
    </div>
    <div class="visual-element item" label="Gr6_52_1_20_A">
     <svg height="100" viewbox="0 0 200 100" width="200">
      <rect fill="#FFFFE0" height="50" stroke="black" stroke-width="1.5" width="40" x="25" y="25">
      </rect>
      <polygon fill="#E6E6FA" points="85,25 125,25 120,75 80,75" stroke="black" stroke-width="1.5">
      </polygon>
      <text font-size="10" text-anchor="middle" x="45" y="50">
       Rect
      </text>
      <text font-size="10" text-anchor="middle" x="102" y="50">
       Para
      </text>
     </svg>
    </div>
   </div>
   <div class="option">
    <div class="option-label">
     D) Two pentagons
    </div>
    <div class="visual-element item" label="Gr6_52_1_20_B">
     <svg height="100" viewbox="0 0 200 100" width="200">
      <polygon fill="#FFB6C1" points="30,25 55,25 60,50 55,75 25,75" stroke="black" stroke-width="1.5">
      </polygon>
      <polygon fill="#FFB6C1" points="90,25 115,25 120,50 115,75 85,75" stroke="black" stroke-width="1.5">
      </polygon>
      <text font-size="10" text-anchor="middle" x="42" y="50">
       Pent 1
      </text>
      <text font-size="10" text-anchor="middle" x="102" y="50">
       Pent 2
      </text>
     </svg>
    </div>
   </div>
  </div>
 </body>
</html>
