<div class="item" label="Gr5_48_2_20" style="width: 320px; height: 320px; display: inline-block;">
    <svg width="320" height="320" xmlns="http://www.w3.org/2000/svg">
        <!-- Angle sector (filled area) -->
        <path d="M 160 160
                 L 135.3 135.3
                 A 35 35 0 1 0 184.7 135.3
                 Z"
              fill="#00BCD4" opacity="0.2"/>
        
        <!-- Starting ray -->
        <line x1="160" y1="160" x2="89.3" y2="89.3"

              stroke="#333" stroke-width="3"/>
        
        <!-- Arc showing the angle -->
        <path d="M 89.3 89.3
                 A 100 100 0 1 0 230.7 89.3"
              fill="none" stroke="#00BCD4" stroke-width="3" opacity="0.7"/>

        <circle cx="160" cy="160" r="4" fill="#333"/>
        
        <!-- Arrow marker -->
        <defs>
            <marker id="arrow_46" markerWidth="10" markerHeight="7" 
                    refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#00BCD4"/>

        <!-- Arrow on arc -->
        <path d="M 99.6 107.5
                 A 80 80 0 1 0 220.4 107.5"
              fill="none" stroke="#00BCD4" stroke-width="2" marker-end="url(#arrow_46)" opacity="0.8"/>
