<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr7_22_E3_1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
        }
        .item {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
        }
        .fraction-problem {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px;
        }
        .mixed-number {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .fraction {
            display: inline-block;
            text-align: center;
            vertical-align: middle;
            margin: 0 5px;
        }
        .fraction .numerator {
            border-bottom: 2px solid black;
            padding: 0 5px;
        }
        .fraction .denominator {
            padding: 0 5px;
        }
        .answer-box {
            width: 80px;
            height: 40px;
            border: 2px solid #333;
            background: #f0f0f0;
            display: inline-block;
            vertical-align: middle;
        }
        .step-calculation {
            font-size: 20px;
            padding: 15px;
            background: #f5f5f5;
            margin: 10px;
        }
        .equals {
            margin: 0 10px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main problem image -->
        <div class="item" label="Gr7_22_3_2">
            <div class="fraction-problem">
                <div class="mixed-number">
                    <span>1</span>
                    <div class="fraction">
                        <div class="numerator">1</div>
                        <div class="denominator">3</div>
                    </div>
                </div>
                <span>÷</span>
                <div class="fraction">
                    <div class="numerator">5</div>
                    <div class="denominator">6</div>
                </div>
                <span class="equals">=</span>
                <div class="answer-box"></div>
            </div>
        </div>

        <!-- Step 1: Convert mixed number -->
        <div class="item" label="Gr7_22_3_1_step_2">
            <div class="step-calculation">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="mixed-number">
                        <span>1</span>
                        <div class="fraction">
                            <div class="numerator">1</div>
                            <div class="denominator">3</div>
                        </div>
                    </div>
                    <span class="equals">=</span>
                    <div class="fraction">
                        <div class="numerator">(1 × 3 + 1)</div>
                        <div class="denominator">3</div>
                    </div>
                    <span class="equals">=</span>
                    <div class="fraction">
                        <div class="numerator">4</div>
                        <div class="denominator">3</div>
                    </div>
                </div>
                <div style="margin-top: 10px; font-size: 16px; color: #666;">
                    Converting mixed number to improper fraction
                </div>
            </div>
        </div>

        <!-- Step 2: Convert division to multiplication -->
        <div class="item" label="Gr7_22_3_1_step_2">
            <div class="step-calculation">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="fraction">
                        <div class="numerator">4</div>
                        <div class="denominator">3</div>
                    </div>
                    <span>÷</span>
                    <div class="fraction">
                        <div class="numerator">5</div>
                        <div class="denominator">6</div>
                    </div>
                    <span class="equals">=</span>
                    <div class="fraction">
                        <div class="numerator">4</div>
                        <div class="denominator">3</div>
                    </div>
                    <span>×</span>
                    <div class="fraction">
                        <div class="numerator">6</div>
                        <div class="denominator">5</div>
                    </div>
                </div>
                <div style="margin-top: 10px; font-size: 16px; color: #666;">
                    Multiply by the reciprocal
                </div>
            </div>
        </div>

        <!-- Step 3: Simplify and multiply -->
        <div class="item" label="Gr7_22_3_1_step_2">
            <div class="step-calculation">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="fraction">
                        <div class="numerator">4 × 2</div>
                        <div class="denominator">1 × 5</div>
                    </div>
                    <span class="equals">=</span>
                    <div class="fraction">
                        <div class="numerator">8</div>
                        <div class="denominator">5</div>
                    </div>
                </div>
                <div style="margin-top: 10px; font-size: 16px; color: #666;">
                    Simplify: 6 ÷ 3 = 2, 3 ÷ 3 = 1
                </div>
            </div>
        </div>

        <!-- Step 4: Convert to mixed number -->
        <div class="item" label="Gr7_22_3_1_step_2">
            <div class="step-calculation">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="fraction">
                        <div class="numerator">8</div>
                        <div class="denominator">5</div>
                    </div>
                    <span class="equals">=</span>
                    <div class="mixed-number">
                        <span>1</span>
                        <div class="fraction">
                            <div class="numerator">3</div>
                            <div class="denominator">5</div>
                        </div>
                    </div>
                </div>
                <div style="margin-top: 10px; font-size: 16px; color: #666;">
                    Convert improper fraction to mixed number
                </div>
            </div>
        </div>
    </div>
</body>
</html>
