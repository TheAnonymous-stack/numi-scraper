<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            font-family: Arial, sans-serif;
            padding: 0;
            margin: 0;
        }
        .subtraction {
            display: inline-block;
            text-align: right;
            border-bottom: 2px solid black;
            padding: 5px;
            min-width: 80px;
        }
        .number {
            margin: 2px 0;
        }
        .operator {
            position: absolute;
            left: -15px;
        }
        .result {
            margin-top: 5px;
            border-top: 2px solid black;
            padding-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Question 2_35: Subtraction 15.67 - 5.04 = 10.63 -->
    <div class="item" label="Gr5_20_2_35_step_2">
        <div class="subtraction">
            <div class="number">$15.67</div>
            <div class="number" style="position: relative;">
                <span class="operator">-</span>$5.04
            </div>
            <div class="result">$10.63</div>
        </div>
    </div>
</body>
</html>
