<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    .item {
      display: inline-block;
      padding: 10px;
    }
    .title {
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }
    .legend {
      font-family: Arial, sans-serif;
      font-size: 12px;
      margin-top: 10px;
    }
    .legend-item {
      display: inline-block;
      margin-right: 15px;
    }
    .legend-box {
      display: inline-block;
      width: 15px;
      height: 15px;
      margin-right: 5px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="item" label="Gr6_42_3_28_step_4">
    <div class="title">Favourite zoo animal</div>
    <svg width="400" height="280" xmlns="http://www.w3.org/2000/svg">
      <!-- Axes -->
      <line x1="60" y1="220" x2="380" y2="220" stroke="#333" stroke-width="2"/>
      <line x1="60" y1="220" x2="60" y2="30" stroke="#333" stroke-width="2"/>
      
      <!-- Y-axis labels -->
      <text x="50" y="220" text-anchor="end" font-size="11">0</text>
      <text x="50" y="172" text-anchor="end" font-size="11">250</text>
      <text x="50" y="125" text-anchor="end" font-size="11">500</text>
      <text x="50" y="78" text-anchor="end" font-size="11">750</text>
      <text x="50" y="30" text-anchor="end" font-size="11">1000</text>
      <text x="20" y="125" text-anchor="middle" font-size="11" transform="rotate(-90, 20, 125)">Number of children</text>
      
      <!-- X-axis labels -->
      <text x="105" y="240" text-anchor="middle" font-size="10">Elephants</text>
      <text x="175" y="240" text-anchor="middle" font-size="10">Lions</text>
      <text x="255" y="240" text-anchor="middle" font-size="10">Hippos</text>
      <text x="335" y="240" text-anchor="middle" font-size="10">Polar bears</text>
      <text x="220" y="260" text-anchor="middle" font-size="12">Animals</text>
      
      <!-- Grid lines -->
      <line x1="60" y1="172" x2="380" y2="172" stroke="#ddd" stroke-width="1"/>
      <line x1="60" y1="125" x2="380" y2="125" stroke="#ddd" stroke-width="1"/>
      <line x1="60" y1="78" x2="380" y2="78" stroke="#ddd" stroke-width="1"/>
      
      <!-- Bars - Girls (blue) and Boys (pink) -->
      <!-- Elephants: 1000 girls, 100 boys -->
      <rect x="85" y="30" width="20" height="190" fill="#2196F3"/>
      <rect x="105" y="201" width="20" height="19" fill="#E91E63"/>
      
      <!-- Lions: 300 girls, 900 boys -->
      <rect x="155" y="163" width="20" height="57" fill="#2196F3"/>
      <rect x="175" y="49" width="20" height="171" fill="#E91E63"/>
      
      <!-- Hippos: 300 each -->
      <rect x="235" y="163" width="20" height="57" fill="#2196F3"/>
      <rect x="255" y="163" width="20" height="57" fill="#E91E63"/>
      
      <!-- Polar bears: 1000 girls, 600 boys -->
      <rect x="315" y="30" width="20" height="190" fill="#2196F3"/>
      <rect x="335" y="106" width="20" height="114" fill="#E91E63"/>
    </svg>
    <div class="legend">
      <span class="legend-item"><span class="legend-box" style="background-color: #2196F3;"></span>Girls</span>
      <span class="legend-item"><span class="legend-box" style="background-color: #E91E63;"></span>Boys</span>
    </div>
  </div>
</body>
</html>
