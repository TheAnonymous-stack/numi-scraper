<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            margin: 0;
            padding: 0;
        }
        .shape-container {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
            max-width: 400px;
        }
        .hexagon {
            width: 40px;
            height: 35px;
            position: relative;
            margin: 11px 2px;
        }
        .hexagon.full {
            background-color: #4a90e2;
        }
        .hexagon.full:before,
        .hexagon.full:after {
            background-color: #4a90e2;
        }
        .hexagon:before,
        .hexagon:after {
            content: "";
            position: absolute;
            width: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
        }
        .hexagon:before {
            bottom: 100%;
            border-bottom: 11px solid #4a90e2;
        }
        .hexagon:after {
            top: 100%;
            border-top: 11px solid #4a90e2;
        }
        .hexagon.divided {
            background: conic-gradient(from 30deg, #4a90e2 0deg, #4a90e2 300deg, white 300deg);
            clip-path: polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <!-- Question 4_5: 8 hexagons, 7 fully shaded, last with 5/6 parts shaded -->

        <div class="shape-container">
