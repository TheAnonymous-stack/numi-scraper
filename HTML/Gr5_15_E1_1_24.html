<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            margin: 10px;
        }
        .circles-grid {
            display: inline-block;
        }
        .circle-row {
            display: flex;
            margin: 2px 0;
        }
        .circle {
            width: 20px;
            height: 20px;
            background-color: green;
            border-radius: 50%;
            margin: 2px;
        }
        .number-line {
            position: relative;
            width: fit-content;
            height: 80px;
            margin-top: 20px;
        }
        .line {
            position: absolute;
            top: 50px;
            height: 2px;
            background-color: black;
            width: 300px;
        }
        .tick {
            position: absolute;
            top: 45px;
            width: 2px;
            height: 10px;
            background-color: black;
        }
        .number {
            position: absolute;
            top: 60px;
            font-size: 12px;
            transform: translateX(-50%);
        }
        .arrow {
            position: absolute;
            top: 20px;
            width: 30px;
            height: 25px;
            border: 2px solid blue;
            border-bottom: none;
            border-radius: 15px 15px 0 0;
        }
        .result-box {
            position: absolute;
            top: 55px;
            transform: translateX(-50%);
            padding: 2px 6px;
            border: 2px solid blue;
            background-color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Step 1: 5 rows of 3 circles -->
    <div class="item" label="Gr5_15_1_24_step_1">
        <div class="circles-grid">
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div><div class="circle"></div>
            </div>
        </div>
    </div>

    <!-- Step 2: Number line with 5 jumps of 3 -->
    <div class="item" label="Gr5_15_1_24_step_2">
        <div class="number-line">
            <div class="line"></div>
            <!-- Ticks and numbers -->
            <div class="tick" style="left: 0px;"></div>
            <div class="number" style="left: 0px;">0</div>
            <div class="tick" style="left: 30px;"></div>
            <div class="number" style="left: 30px;">3</div>
            <div class="tick" style="left: 60px;"></div>
            <div class="number" style="left: 60px;">6</div>
            <div class="tick" style="left: 90px;"></div>
            <div class="number" style="left: 90px;">9</div>
            <div class="tick" style="left: 120px;"></div>
            <div class="number" style="left: 120px;">12</div>
            <div class="tick" style="left: 150px;"></div>
            <div class="number" style="left: 150px;">15</div>
            <div class="tick" style="left: 180px;"></div>
            <div class="number" style="left: 180px;">18</div>
            <div class="tick" style="left: 210px;"></div>
            <div class="number" style="left: 210px;">21</div>
            <div class="tick" style="left: 240px;"></div>
            <div class="number" style="left: 240px;">24</div>
            <div class="tick" style="left: 270px;"></div>
            <div class="number" style="left: 270px;">27</div>
            <div class="tick" style="left: 300px;"></div>
            <div class="number" style="left: 300px;">30</div>
            <!-- 5 Arrows -->
            <div class="arrow" style="left: 0px;"></div>
            <div class="arrow" style="left: 30px;"></div>
            <div class="arrow" style="left: 60px;"></div>
            <div class="arrow" style="left: 90px;"></div>
            <div class="arrow" style="left: 120px;"></div>
            <!-- Result box -->
            <div class="result-box" style="left: 150px;">15</div>
        </div>
    </div>
</body>
</html>
