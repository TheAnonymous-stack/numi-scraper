<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Episodes watched per week.</title>
    <style>
        .item {
            display: inline-block;
            padding: 10px;
            background: #fff;
        }
        .histogram-container {
            font-family: Arial, sans-serif;
        }
        .chart-title {
            text-anchor: middle;
            font-size: 14px;
            font-weight: bold;
            fill: #333;
        }
        .axis-label {
            font-size: 12px;
            fill: #333;
        }
    </style>
</head>
<body>
    <div class="item" label="Gr6_44_1_19">
        <div class="histogram-container">
            <svg width="360" height="340" viewBox="0 0 360 340">
                <!-- Title -->
                <text x="180.0" y="20" class="chart-title">Episodes watched per week.</text>

                <!-- Y-axis label -->
                <text x="15" y="150.0" class="axis-label" transform="rotate(-90, 15, 150.0)">Number of viewers</text>

                <!-- Y-axis ticks and grid lines -->
                
        <text x="50" y="264.0" text-anchor="end" font-size="10" fill="#333">0</text>
        <line x1="55" y1="260.0" x2="350" y2="260.0" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="224.0" text-anchor="end" font-size="10" fill="#333">6</text>
        <line x1="55" y1="220.0" x2="350" y2="220.0" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="177.33333333333331" text-anchor="end" font-size="10" fill="#333">13</text>
        <line x1="55" y1="173.33333333333331" x2="350" y2="173.33333333333331" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="137.33333333333331" text-anchor="end" font-size="10" fill="#333">19</text>
        <line x1="55" y1="133.33333333333331" x2="350" y2="133.33333333333331" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="90.66666666666666" text-anchor="end" font-size="10" fill="#333">26</text>
        <line x1="55" y1="86.66666666666666" x2="350" y2="86.66666666666666" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="44.0" text-anchor="end" font-size="10" fill="#333">33</text>
        <line x1="55" y1="40.0" x2="350" y2="40.0" stroke="#ddd" stroke-width="1" />
        

                <!-- Y-axis line -->
                <line x1="55" y1="30" x2="55" y2="260" stroke="#333" stroke-width="2" />

                <!-- X-axis line -->
                <line x1="55" y1="260" x2="350" y2="260" stroke="#333" stroke-width="2" />

                <!-- Bars -->
                
        <rect x="60" y="180.0" width="50" height="80.0" fill="#4CAF50" />
        <text x="85.0" y="280" text-anchor="middle" font-size="11" fill="#333">1-10</text>
        
        <rect x="120" y="213.33333333333331" width="50" height="46.66666666666667" fill="#4CAF50" />
        <text x="145.0" y="280" text-anchor="middle" font-size="11" fill="#333">11-20</text>
        
        <rect x="180" y="173.33333333333331" width="50" height="86.66666666666667" fill="#4CAF50" />
        <text x="205.0" y="280" text-anchor="middle" font-size="11" fill="#333">21-30</text>
        
        <rect x="240" y="40.0" width="50" height="220.0" fill="#4CAF50" />
        <text x="265.0" y="280" text-anchor="middle" font-size="11" fill="#333">31-40</text>
        
        <rect x="300" y="193.33333333333331" width="50" height="66.66666666666667" fill="#4CAF50" />
        <text x="325.0" y="280" text-anchor="middle" font-size="11" fill="#333">41-50</text>
        

                <!-- X-axis label -->
                <text x="180.0" y="320" class="axis-label" text-anchor="middle">Episodes</text>
            </svg>
        </div>
    </div>
</body>
</html>
