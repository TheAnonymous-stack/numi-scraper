<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swimming Freestyle - Proportional Relationship</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        svg {
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Swimming Freestyle - Distance vs Time</h1>
    <div class="container">
        <svg viewBox="0 0 500 500" width="500" height="500">
            <!-- Grid lines -->
            <defs>
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="1"/>
                </pattern>
            </defs>
            <rect width="500" height="500" fill="white"/>
            <rect x="60" y="40" width="400" height="400" fill="url(#grid)"/>

            <!-- Additional grid lines -->
            <g stroke="#e0e0e0" stroke-width="1">
                <line x1="100" y1="40" x2="100" y2="440"/>
                <line x1="140" y1="40" x2="140" y2="440"/>
                <line x1="180" y1="40" x2="180" y2="440"/>
                <line x1="220" y1="40" x2="220" y2="440"/>
                <line x1="260" y1="40" x2="260" y2="440"/>
                <line x1="300" y1="40" x2="300" y2="440"/>
                <line x1="340" y1="40" x2="340" y2="440"/>
                <line x1="380" y1="40" x2="380" y2="440"/>
                <line x1="420" y1="40" x2="420" y2="440"/>

                <line x1="60" y1="80" x2="460" y2="80"/>
                <line x1="60" y1="120" x2="460" y2="120"/>
                <line x1="60" y1="160" x2="460" y2="160"/>
                <line x1="60" y1="200" x2="460" y2="200"/>
                <line x1="60" y1="240" x2="460" y2="240"/>
                <line x1="60" y1="280" x2="460" y2="280"/>
                <line x1="60" y1="320" x2="460" y2="320"/>
                <line x1="60" y1="360" x2="460" y2="360"/>
                <line x1="60" y1="400" x2="460" y2="400"/>
            </g>

            <!-- X and Y axes -->
            <line x1="60" y1="440" x2="460" y2="440" stroke="black" stroke-width="2"/>
            <line x1="60" y1="40" x2="60" y2="440" stroke="black" stroke-width="2"/>

            <!-- Arrow heads -->
            <polygon points="460,440 455,435 455,445" fill="black"/>
            <polygon points="60,40 55,45 65,45" fill="black"/>

            <!-- The proportional line: y = 3x -->
            <!-- Goes from (0,0) through (1,3) and extends to show the relationship -->
            <!-- Scale: 40 pixels = 1 unit on x-axis, y-axis scaled differently -->
            <!-- Y-axis: each 40 pixels = 3 units -->
            <line x1="60" y1="440" x2="460" y2="40" stroke="blue" stroke-width="2.5"/>

            <!-- Points on the line -->
            <!-- Origin (0,0) -->
            <circle cx="60" cy="440" r="4" fill="blue"/>

            <!-- Point (1,3) - 1 second, 3 feet -->
            <circle cx="100" cy="400" r="4" fill="blue"/>

            <!-- Additional points to show the pattern -->
            <!-- (2,6) -->
            <circle cx="140" cy="360" r="4" fill="blue"/>

            <!-- (3,9) -->
            <circle cx="180" cy="320" r="4" fill="blue"/>

            <!-- (4,12) -->
            <circle cx="220" cy="280" r="4" fill="blue"/>

            <!-- (5,15) -->
            <circle cx="260" cy="240" r="4" fill="blue"/>

            <!-- X-axis labels -->
            <text x="60" y="460" text-anchor="middle" font-size="12">0</text>
            <text x="100" y="460" text-anchor="middle" font-size="12">1</text>
            <text x="140" y="460" text-anchor="middle" font-size="12">2</text>
            <text x="180" y="460" text-anchor="middle" font-size="12">3</text>
            <text x="220" y="460" text-anchor="middle" font-size="12">4</text>
            <text x="260" y="460" text-anchor="middle" font-size="12">5</text>
            <text x="300" y="460" text-anchor="middle" font-size="12">6</text>
            <text x="340" y="460" text-anchor="middle" font-size="12">7</text>
            <text x="380" y="460" text-anchor="middle" font-size="12">8</text>
            <text x="420" y="460" text-anchor="middle" font-size="12">9</text>
            <text x="460" y="460" text-anchor="middle" font-size="12">10</text>

            <!-- Y-axis labels -->
            <text x="45" y="445" text-anchor="end" font-size="12">0</text>
            <text x="45" y="405" text-anchor="end" font-size="12">3</text>
            <text x="45" y="365" text-anchor="end" font-size="12">6</text>
            <text x="45" y="325" text-anchor="end" font-size="12">9</text>
            <text x="45" y="285" text-anchor="end" font-size="12">12</text>
            <text x="45" y="245" text-anchor="end" font-size="12">15</text>
            <text x="45" y="205" text-anchor="end" font-size="12">18</text>
            <text x="45" y="165" text-anchor="end" font-size="12">21</text>
            <text x="45" y="125" text-anchor="end" font-size="12">24</text>
            <text x="45" y="85" text-anchor="end" font-size="12">27</text>
            <text x="45" y="45" text-anchor="end" font-size="12">30</text>

            <!-- Axis titles -->
            <text x="260" y="490" text-anchor="middle" font-size="14" font-weight="bold">Time Swimming Freestyle (seconds)</text>
            <text x="25" y="240" text-anchor="middle" font-size="14" font-weight="bold" transform="rotate(-90 25 240)">Distance Traveled (feet)</text>

            <!-- Label for key point (1,3) -->
            <text x="110" y="395" font-size="11" fill="blue">(1, 3)</text>

            <!-- Rate label -->
            <text x="250" y="200" font-size="12" fill="blue">Rate: 3 feet/second</text>
        </svg>
    </div>
</body>
</html>
