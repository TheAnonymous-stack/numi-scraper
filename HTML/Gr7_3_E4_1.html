<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr7_3_E4 4_1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item {
            margin: 20px 0;
            display: inline-block;
        }
        .comparison {
            font-size: 24px;
            margin: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .mixed-number {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.8;
        }
        .numerator {
            border-bottom: 2px solid black;
            padding: 2px 8px;
        }
        .denominator {
            padding: 2px 8px;
        }
        .box {
            width: 40px;
            height: 40px;
            border: 2px solid black;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="item" label="Gr7_3_4_2">
        <div class="comparison">
            <div class="mixed-number">
                <span>1</span>
                <div class="fraction">
                    <span class="numerator">2</span>
                    <span class="denominator">9</span>
                </div>
            </div>
            <div class="box"></div>
            <div class="mixed-number">
                <span>1</span>
                <div class="fraction">
                    <span class="numerator">1</span>
                    <span class="denominator">2</span>
                </div>
            </div>
        </div>
    </div>

    <div class="item" label="Gr7_3_4_1_step_2">
        <div style="margin: 20px; font-size: 20px;">
            <div class="fraction" style="display: inline-flex; margin: 0 10px;">
                <span class="numerator">2</span>
                <span class="denominator">9</span>
            </div>
            <span>×</span>
            <div class="fraction" style="display: inline-flex; margin: 0 10px;">
                <span class="numerator">2</span>
                <span class="denominator">2</span>
            </div>
            <span>=</span>
            <div class="fraction" style="display: inline-flex; margin: 0 10px;">
                <span class="numerator">4</span>
                <span class="denominator">18</span>
            </div>
        </div>
        <div style="margin: 20px; font-size: 20px;">
            <div class="fraction" style="display: inline-flex; margin: 0 10px;">
                <span class="numerator">1</span>
                <span class="denominator">2</span>
            </div>
            <span>×</span>
            <div class="fraction" style="display: inline-flex; margin: 0 10px;">
                <span class="numerator">9</span>
                <span class="denominator">9</span>
            </div>
            <span>=</span>
            <div class="fraction" style="display: inline-flex; margin: 0 10px;">
                <span class="numerator">9</span>
                <span class="denominator">18</span>
            </div>
        </div>
        <div style="margin: 20px; font-size: 20px;">
            <span>Since 4 &lt; 9, then </span>
            <div class="fraction" style="display: inline-flex; margin: 0 10px;">
                <span class="numerator">4</span>
                <span class="denominator">18</span>
            </div>
            <span>&lt;</span>
            <div class="fraction" style="display: inline-flex; margin: 0 10px;">
                <span class="numerator">9</span>
                <span class="denominator">18</span>
            </div>
        </div>
        <div style="margin: 20px; font-size: 20px;">
            <span>Therefore: 1</span>
            <div class="fraction" style="display: inline-flex; margin: 0 10px;">
                <span class="numerator">2</span>
                <span class="denominator">9</span>
            </div>
            <span>&lt; 1</span>
            <div class="fraction" style="display: inline-flex; margin: 0 10px;">
                <span class="numerator">1</span>
                <span class="denominator">2</span>
            </div>
        </div>
    </div>
</body>
</html>
