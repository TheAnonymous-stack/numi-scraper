<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Episodes watched per week.</title>
    <style>
        .item {
            display: inline-block;
            padding: 10px;
            background: #fff;
        }
        .histogram-container {
            font-family: Arial, sans-serif;
        }
        .chart-title {
            text-anchor: middle;
            font-size: 14px;
            font-weight: bold;
            fill: #333;
        }
        .axis-label {
            font-size: 12px;
            fill: #333;
        }
    </style>
</head>
<body>
    <div class="item" label="Gr6_44_1_50">
        <div class="histogram-container">
            <svg width="360" height="340" viewBox="0 0 360 340">
                <!-- Title -->
                <text x="180.0" y="20" class="chart-title">Episodes watched per week.</text>

                <!-- Y-axis label -->
                <text x="15" y="150.0" class="axis-label" transform="rotate(-90, 15, 150.0)">Number of viewers</text>

                <!-- Y-axis ticks and grid lines -->
                
        <text x="50" y="264.0" text-anchor="end" font-size="10" fill="#333">0</text>
        <line x1="55" y1="260.0" x2="350" y2="260.0" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="222.75" text-anchor="end" font-size="10" fill="#333">6</text>
        <line x1="55" y1="218.75" x2="350" y2="218.75" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="181.5" text-anchor="end" font-size="10" fill="#333">12</text>
        <line x1="55" y1="177.5" x2="350" y2="177.5" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="133.375" text-anchor="end" font-size="10" fill="#333">19</text>
        <line x1="55" y1="129.375" x2="350" y2="129.375" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="92.125" text-anchor="end" font-size="10" fill="#333">25</text>
        <line x1="55" y1="88.125" x2="350" y2="88.125" stroke="#ddd" stroke-width="1" />
        
        <text x="50" y="44.0" text-anchor="end" font-size="10" fill="#333">32</text>
        <line x1="55" y1="40.0" x2="350" y2="40.0" stroke="#ddd" stroke-width="1" />
        

                <!-- Y-axis line -->
                <line x1="55" y1="30" x2="55" y2="260" stroke="#333" stroke-width="2" />

                <!-- X-axis line -->
                <line x1="55" y1="260" x2="350" y2="260" stroke="#333" stroke-width="2" />

                <!-- Bars -->
                
        <rect x="60" y="156.875" width="50" height="103.125" fill="#4CAF50" />
        <text x="85.0" y="280" text-anchor="middle" font-size="11" fill="#333">1-15</text>
        
        <rect x="120" y="40.0" width="50" height="220.0" fill="#4CAF50" />
        <text x="145.0" y="280" text-anchor="middle" font-size="11" fill="#333">16-30</text>
        
        <rect x="180" y="177.5" width="50" height="82.5" fill="#4CAF50" />
        <text x="205.0" y="280" text-anchor="middle" font-size="11" fill="#333">31-45</text>
        
        <rect x="240" y="177.5" width="50" height="82.5" fill="#4CAF50" />
        <text x="265.0" y="280" text-anchor="middle" font-size="11" fill="#333">46-60</text>
        
        <rect x="300" y="191.25" width="50" height="68.75" fill="#4CAF50" />
        <text x="325.0" y="280" text-anchor="middle" font-size="11" fill="#333">61-75</text>
        

                <!-- X-axis label -->
                <text x="180.0" y="320" class="axis-label" text-anchor="middle">Episodes</text>
            </svg>
        </div>
    </div>
</body>
</html>
