<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr7_10_E2 2_44</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .number-line {
            position: relative;
            width: 100%;
            height: 100px;
            margin: 30px 0;
        }
        .line {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: #333;
        }
        .tick {
            position: absolute;
            top: 45%;
            width: 2px;
            height: 10px;
            background: #333;
        }
        .number {
            position: absolute;
            top: 60%;
            transform: translateX(-50%);
            font-size: 14px;
        }
        .arrow {
            position: absolute;
            top: 30%;
            height: 30px;
        }
        .arrow-path {
            stroke: #4169E1;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }
        .point {
            position: absolute;
            top: 48%;
            width: 8px;
            height: 8px;
            background: #FF0000;
            border-radius: 50%;
            transform: translateX(-50%);
        }
        .operation {
            font-size: 24px;
            margin: 20px 0;
            font-weight: bold;
        }
        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 10px;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>

                <defs>

            </svg>
        </div>
        <p>Starting at -28, move 39 units to the right to reach 11</p>
    </div>
    <h3>Solution Steps:</h3>
    <div class="item" label="Gr7_10_2_44_step_2)">
        <label>Step 1: Number line with a point marked at -28</label>
    </div>
    <div class="item" label="Gr7_10_2_44_step_3)">
        <label>Step 2: Number line with an arrow from -28 moving right 39 units to 11</label>
    </div>
</body>
