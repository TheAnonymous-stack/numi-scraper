<div class="item" label="Gr5_49_3_30_A">
    <svg width="350" height="350" viewBox="0 0 350 350">
        <!-- Incorrect transformation (right side) -->

            <!-- Original triangle -->
            <polygon points="50,250 170,250 141,190" 
                     fill="#4A90E2" 
                     stroke="#2C3E50" 
                     stroke-width="2"/>
            
            <!-- Duplicate triangle (flush edge contact, no overlap) -->
            <polygon points="50,250 170,250 141,310"
                     fill="#B8E0FF"
                     opacity="0.7"
                     stroke="#2C3E50"
                     stroke-width="2"/>
            
</g>

<div class="item" label="Gr5_49_3_30_B">
    <svg width="350" height="350" viewBox="0 0 350 350">
        <!-- Rectangle formed by tessellation -->
        <g>
            
            <!-- Original triangle (bottom) -->
            <polygon points="50,250 170,250 141,190" 
                     fill="#4A90E2" 
                     stroke="#2C3E50" 
                     stroke-width="2"/>
            
            <!-- Left piece after cut and flip -->
            <polygon points="50,190 141,190 50,250" 
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
            
            <!-- Right piece after cut and flip -->
            <polygon points="141,190 170,190 170,250" 
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
            
        
        </g>
        
    </svg>
</div>
