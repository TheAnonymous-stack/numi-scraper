<!-- Question 2_3: Video Games bar graph -->
<div class="item" label="Gr5_40_2_3" style="width: 320px; height: 260px; display: inline-block; position: relative; background: #f5f5f5; border: 1px solid #ddd; padding: 10px;">

        <text x="40" y="205" text-anchor="end" font-family="Arial" font-size="12">0</text>
