<!-- Question 2_8: Pokemon Cards bar graph -->
<div class="item" label="Gr5_40_2_8" style="width: 320px; height: 240px; display: inline-block; position: relative; background: white; border: 1px solid #ddd; padding: 10px;">
    <svg width="300" height="220" xmlns="http://www.w3.org/2000/svg">
        <!-- Title -->
        <text x="150" y="20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Pokemon Cards</text>
        
        <!-- Grid lines -->
        <g stroke="#e0e0e0" stroke-width="1">
            <line x1="50" y1="180" x2="270" y2="180"/>
            <line x1="50" y1="160" x2="270" y2="160"/>
            <line x1="50" y1="140" x2="270" y2="140"/>
            <line x1="50" y1="120" x2="270" y2="120"/>
            <line x1="50" y1="100" x2="270" y2="100"/>
            <line x1="50" y1="80" x2="270" y2="80"/>
            <line x1="50" y1="60" x2="270" y2="60"/>
        </g>
        
        <!-- Axes -->
        <line x1="50" y1="60" x2="50" y2="180" stroke="black" stroke-width="2"/>
        <line x1="50" y1="180" x2="270" y2="180" stroke="black" stroke-width="2"/>
        
        <!-- Y-axis labels -->
        <text x="40" y="185" text-anchor="end" font-family="Arial" font-size="12">0</text>
        <text x="40" y="165" text-anchor="end" font-family="Arial" font-size="12">1</text>
        <text x="40" y="145" text-anchor="end" font-family="Arial" font-size="12">2</text>
        <text x="40" y="125" text-anchor="end" font-family="Arial" font-size="12">3</text>
        <text x="40" y="105" text-anchor="end" font-family="Arial" font-size="12">4</text>
        <text x="40" y="85" text-anchor="end" font-family="Arial" font-size="12">5</text>
        <text x="40" y="65" text-anchor="end" font-family="Arial" font-size="12">6</text>
        <text x="40" y="45" text-anchor="end" font-family="Arial" font-size="12">7</text>
        
        <!-- Bars -->
        <!-- Charizard (6 cards) -->
        <rect x="70" y="60" width="40" height="120" fill="#FF6347"/>
        <text x="90" y="200" text-anchor="middle" font-family="Arial" font-size="11">Charizard</text>
        
        <!-- Mewtwo (5 cards) -->
        <rect x="120" y="80" width="40" height="100" fill="#9370DB"/>
        <text x="140" y="200" text-anchor="middle" font-family="Arial" font-size="11">Mewtwo</text>
        
        <!-- Eevee (6 cards) -->
        <rect x="170" y="60" width="40" height="120" fill="#8B4513"/>
        <text x="190" y="200" text-anchor="middle" font-family="Arial" font-size="11">Eevee</text>
        
        <!-- Pikachu (7 cards) -->
        <rect x="220" y="40" width="40" height="140" fill="#FFD700"/>
        <text x="240" y="200" text-anchor="middle" font-family="Arial" font-size="11">Pikachu</text>
    </svg>
</div>
