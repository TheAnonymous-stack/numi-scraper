<!-- Question 2_43 - Number Cube Image -->
<div class="item" label="Gr5_42_2_43" style="width: 80px; height: 80px;">
    <svg width="80" height="80" xmlns="http://www.w3.org/2000/svg">
        <!-- 3D cube showing faces with numbers 1, 2, 3 visible -->
        <!-- Top face -->
        <path d="M 20,20 L 60,20 L 50,10 L 30,10 Z" fill="#f0f0f0" stroke="black" stroke-width="1"/>
        <!-- Number 1 on top -->
        <circle cx="40" cy="15" r="2" fill="black"/>
        
        <!-- Front face -->
        <rect x="20" y="20" width="40" height="40" fill="#e0e0e0" stroke="black" stroke-width="1"/>
        <!-- Number 2 on front -->
        <circle cx="30" cy="30" r="2" fill="black"/>
        <circle cx="50" cy="50" r="2" fill="black"/>
        
        <!-- Right face -->
        <path d="M 60,20 L 60,60 L 50,50 L 50,10 Z" fill="#d0d0d0" stroke="black" stroke-width="1"/>
        <!-- Number 3 on right (partial view) -->
        <circle cx="55" cy="25" r="1.5" fill="black"/>
        <circle cx="55" cy="35" r="1.5" fill="black"/>
        <circle cx="55" cy="45" r="1.5" fill="black"/>
    </svg>
</div>
