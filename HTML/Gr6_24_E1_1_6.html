<!DOCTYPE html>
<html lang="en">
<head>

    <title>Array Model: 3/5 × 40</title>
    <style>

            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .circle {
            fill: #87CEEB;
            stroke: #000;
            stroke-width: 1;
        }
        .circle-shaded {
            fill: #4CAF50;
            stroke: #000;
            stroke-width: 1;
        }
        .group-border {
            fill: none;
            stroke: #FF0000;
            stroke-width: 2;
            stroke-dasharray: 5,5;
        }
        .group-label {
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            fill: #FF0000;

</head>
