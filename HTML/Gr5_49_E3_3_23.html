<!-- Incorrect Choice: Does not form rectangle -->
<div class="item" label="Gr5_49_3_23_A">
    <svg width="181" height="200" viewBox="40.0 150.0 100.0 110.0">
        <!-- Original triangle (left side) -->

        <g >
            
            <!-- Original triangle -->
            <polygon points="50,250 130,250 90.0,180"

</g>

<!-- Correct Choice: Double-flip transformation forms rectangle -->
<div class="item" label="Gr5_49_3_23_B">
    <svg width="200" height="180" viewBox="40.0 170.0 100.0 90.0">
        <!-- Original triangle (left side) -->
        
        
        <!-- Rectangle formed by tessellation (right side) -->
        <g >
            
            <!-- Original triangle (bottom) -->
            <polygon points="50,250 130,250 90.0,180" 
                     fill="#4A90E2" 
                     stroke="#2C3E50" 
                     stroke-width="2"/>
            
            <!-- Left piece after double flip (vertical then horizontal) -->
            <!-- This piece was originally left half: (x1,y1)-(mid_x,y1)-(x3,y3) -->
            <!-- After vertical flip: becomes upside down -->
            <!-- After horizontal flip: mirror image -->
            <!-- Result: fills top-right corner of rectangle -->
            <polygon points="90.0,180 130,180 130,250" 
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
            
            <!-- Right piece after double flip -->
            <!-- This piece was originally right half: (mid_x,y1)-(x2,y2)-(x3,y3) -->
            <!-- After vertical flip: becomes upside down -->
            <!-- After horizontal flip: mirror image -->
            <!-- Result: fills top-left corner of rectangle -->
            <polygon points="50,180 90.0,180 50,250" 
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
            
        
        </g>
        
    </svg>
</div>
