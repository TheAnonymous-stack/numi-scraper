<div class="item" label="Gr5_49_3_26">
    <svg width="200" height="149" viewBox="40.0 180.0 133.6 100.0">
        <!-- Triangle -->
        <polygon points="50,250 150,250 100,190" 
                 fill="#4A90E2" 
                 stroke="#2C3E50" 
                 stroke-width="2"/>
        
        <!-- Height line (dotted) -->
        <line x1="100" y1="250" 
              x2="100" y2="190" 
              stroke="#333" 
              stroke-width="1.5" 
              stroke-dasharray="5,3"/>
        
        <!-- Right angle symbol -->
        <rect x="96" y="242" 
              width="8" height="8" 
              fill="none" 
              stroke="#333" 
              stroke-width="1.5"/>
        
        <!-- Base measurement -->
        <text x="100" y="270" 
              text-anchor="middle" 
              font-size="14" 
              fill="#2C3E50">10 cm</text>
        
        <!-- Height measurement -->
        <text x="130" y="220" 
              text-anchor="start" 
              font-size="14" 
              fill="#2C3E50">6 cm</text>
    </svg>
</div>

<!-- Incorrect Choice: Does not form rectangle -->
<div class="item" label="Gr5_49_3_26_A">
    <svg width="200" height="94" viewBox="15.0 180.0 170.0 80.0">
        <!-- Incorrect transformation (right side) -->
        <g>
            
            <!-- Original triangle -->
            <polygon points="50,250 150,250 100,190" 
                     fill="#4A90E2" 
                     stroke="#2C3E50" 
                     stroke-width="2"/>
            
            <!-- Left piece - extends past right edge -->
            <polygon points="100,190 175,190 175,250 150,250"
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
            
            <!-- Right piece - extends past left edge -->
            <polygon points="25,190 100,190 50,250 25,250"
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
</g>
    </svg>
</div>
<!-- Correct Choice: Double-flip transformation forms rectangle -->
<div class="item" label="Gr5_49_3_26_B">
    <svg width="200" height="133" viewBox="40.0 180.0 120.0 80.0">
        <!-- Rectangle formed by tessellation -->
        <g>
            
            <!-- Original triangle (bottom) -->
            <polygon points="50,250 150,250 100,190" 
                     fill="#4A90E2" 
                     stroke="#2C3E50" 
                     stroke-width="2"/>
            
            <!-- Left piece after double flip -->
            <polygon points="100,190 150,190 150,250" 
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
            
            <!-- Right piece after double flip -->
            <polygon points="50,190 100,190 50,250" 
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
            
        
        </g>
        
    </svg>
</div>
