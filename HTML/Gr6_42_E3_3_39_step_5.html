<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    .item {
      display: inline-block;
      padding: 10px;
    }
    .title {
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }
    table {
      border-collapse: collapse;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    td {
      padding: 8px 15px;
      text-align: left;
    }
    .month {
      font-weight: bold;
      width: 80px;

    .key {
      font-family: Arial, sans-serif;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="item" label="Gr6_42_3_39_step_5">
    <div class="title">Library books checked out</div>
    <table>
      <tr>
        <td class="month">June</td>
        <td>📘 📘</td>
      </tr>
      <tr>
        <td class="month">July</td>
        <td>📘</td>
      </tr>
      <tr>
        <td class="month">August</td>
        <td>📘 📘 📘 📘 📘</td>
      </tr>
    </table>
    <div class="key">Key: 📘 = 5 books</div>
  </div>

</html>
