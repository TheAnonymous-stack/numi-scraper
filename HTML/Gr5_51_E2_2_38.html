<!DOCTYPE html>
<html>
<head>
<style>
.item {
    display: inline-block;
    margin: 10px;
}
table {
    border-collapse: collapse;
    font-family: Arial, sans-serif;
    width: 400px;
}
.budget-title {
    background-color: #ff9900;
    color: white;
    padding: 10px;
    text-align: center;
    font-weight: bold;
    font-size: 16px;
}
.section-header {
    background-color: #ffcc99;
    padding: 8px;
    font-weight: bold;
    border: 1px solid #ddd;
    width: 50%;
}
td {
    padding: 8px;
    border: 1px solid #ddd;
    vertical-align: top;
}
.category {
    text-align: left;
}
.amount {
    text-align: right;
    font-family: monospace;
}
.total {
    font-weight: bold;
    border-top: 2px solid #333;
}
</style>
</head>
<body>

<div class="item" label="Gr5_51_2_38">
<table>
    <tr>
        <td colspan="4" class="budget-title">David's March Budget</td>
    </tr>
    <tr>
        <td colspan="2" class="section-header">Income</td>
        <td colspan="2" class="section-header">Expenses</td>
    </tr>
    <tr>
        <td class="category">Chore money</td>
        <td class="amount">$86</td>
        <td class="category">Clothes</td>
        <td class="amount">$43</td>
    </tr>
    <tr>
        <td class="category">Gift money</td>
        <td class="amount">$82</td>
        <td class="category">Savings</td>
        <td class="amount">$73</td>
    </tr>
    <tr>
        <td class="category">Newspaper delivery</td>
        <td class="amount">$29</td>
        <td class="category">Other</td>
        <td class="amount">$115</td>
    </tr>
    
</table>
</div>

</body>
</html>
