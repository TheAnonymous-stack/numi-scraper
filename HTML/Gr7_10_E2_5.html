<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr7_10_E2 2_5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .number-line {
            position: relative;
            width: 100%;
            height: 100px;
            margin: 30px 0;
        }
        .line {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: #333;
        }
        .tick {
            position: absolute;
            top: 45%;
            width: 2px;
            height: 10px;
            background: #333;
        }
        .number {
            position: absolute;
            top: 60%;
            transform: translateX(-50%);
            font-size: 14px;
        }
        .arrow {
            position: absolute;
            top: 30%;
            height: 30px;
        }
        .arrow-path {
            stroke: #4169E1;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }
        .point {
            position: absolute;
            top: 48%;
            width: 8px;
            height: 8px;
            background: #FF0000;
            border-radius: 50%;
            transform: translateX(-50%);
        }
        .operation {
            font-size: 24px;
            margin: 20px 0;
            font-weight: bold;
        }
        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 10px;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Addition with Number Lines</h2>
    <div class="operation">24 + -47 = ?</div>
    
    <div class="item" label="Gr7_10_2_5)">
        <label>Visualizing 24 + -47 on the number line:</label>
        <div class="number-line">
            <div class="line"></div>

            <div class="tick" style="left: 10.0%;"></div>
            <div class="number" style="left: 10.0%;">-28</div>
            <div class="tick" style="left: 17.017543859649123%;"></div>
            <div class="number" style="left: 17.017543859649123%;">-23</div>
            <div class="tick" style="left: 24.035087719298247%;"></div>
            <div class="number" style="left: 24.035087719298247%;">-18</div>
            <div class="tick" style="left: 31.05263157894737%;"></div>
            <div class="number" style="left: 31.05263157894737%;">-13</div>
            <div class="tick" style="left: 38.07017543859649%;"></div>
            <div class="number" style="left: 38.07017543859649%;">-8</div>
            <div class="tick" style="left: 45.08771929824562%;"></div>
            <div class="number" style="left: 45.08771929824562%;">-3</div>
            <div class="tick" style="left: 52.10526315789474%;"></div>
            <div class="number" style="left: 52.10526315789474%;">2</div>
            <div class="tick" style="left: 59.12280701754386%;"></div>
            <div class="number" style="left: 59.12280701754386%;">7</div>
            <div class="tick" style="left: 66.14035087719299%;"></div>
            <div class="number" style="left: 66.14035087719299%;">12</div>
            <div class="tick" style="left: 73.15789473684211%;"></div>
            <div class="number" style="left: 73.15789473684211%;">17</div>
            <div class="tick" style="left: 80.17543859649123%;"></div>
            <div class="number" style="left: 80.17543859649123%;">22</div>
            <div class="tick" style="left: 87.19298245614036%;"></div>
            <div class="number" style="left: 87.19298245614036%;">27</div>
            <div class="point" style="left: 82.98245614035088%;"></div>
            <svg class="arrow" style="left: 17.017543859649123%; width: 65.96491228070175%;">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="10" 
                            refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#4169E1" />
                    </marker>
                </defs>
                <path class="arrow-path" d="M 100% 15 
                                              Q 50% 0 
                                                0% 15" />
            </svg>
        </div>
        <p>Starting at 24, move 47 units to the left to reach -23</p>
    </div>
    <h3>Solution Steps:</h3>
    <div class="item" label="Gr7_10_2_5_step_2)">
        <label>Step 1: Number line with a point marked at 24</label>
    </div>
    <div class="item" label="Gr7_10_2_5_step_3)">
        <label>Step 2: Number line with an arrow from 24 moving left 47 units to -23</label>
    </div>
</body>
</html>
