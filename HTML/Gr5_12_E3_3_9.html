<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr5_12_E3 3_9</title>
    <style>
        .item {
            display: inline-block;
            margin: 10px;
            vertical-align: top;
        }
        
        .bar-comparison {
            font-family: Arial, sans-serif;
        }
        
        .bar-container {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        
        .label {
            width: 100px;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .squares {
            display: flex;
            gap: 2px;
        }
        
        .square {
            width: 40px;
            height: 40px;
            border: 1px solid #333;
        }
        
        .blue-square {
            background-color: #4285F4;
        }
        
        .orange-square {
            background-color: #FF9800;
        }
        
        .division-container {
            font-family: "Courier New", monospace;
            font-size: 18px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <!-- This image shows two labeled bars comparing Wyatt and Grace. Wyatt has one blue square, and Grace has 2 orange squares of the same size, showing that Grace has 2 times as much as Wyatt. -->
    <div class="item" label="Gr5_12_3_9_step_1">
        <div class="bar-comparison">
            <div class="bar-container">
                <div class="label">Wyatt:</div>
                <div class="squares">
                    <div class="square blue-square"></div>
                </div>
            </div>
            <div class="bar-container">
                <div class="label">Grace:</div>
                <div class="squares">
                    <div class="square orange-square"></div>
                    <div class="square orange-square"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- This image shows a long division calculation where 288 is divided by 3. The quotient is 96. -->
    <div class="item" label="Gr5_12_3_9_step_3">
        <div class="division-container">
<pre>
       96
   _____
3 | 288
    27↓
    --
     18
    18↓
            </pre>
        </div>
    </div>
</body>
</html>
