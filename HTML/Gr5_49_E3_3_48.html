                     fill="#4A90E2" 
                     stroke="#2C3E50" 
                     stroke-width="2"/>

            <polygon points="50,180 84,180 50,250" 
                     fill="#B8E0FF" 
                     opacity="0.8"

                     stroke-width="1.5"/>
            
            <!-- Right piece after cut and flip -->
            <polygon points="84,180 150,180 150,250" 
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
            
        
        </g>
