<!-- Question 2_11 - Spinner Image (4 sections, 3 green/purple) -->
<div class="item" label="Gr5_42_2_11" style="width: 120px; height: 120px;">
    <svg width="120" height="120" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(60, 60)">
            <!-- Circle outline -->
            <circle cx="0" cy="0" r="50" fill="white" stroke="black" stroke-width="2"/>
            
            <!-- 4 equal sections (90 degrees each) - 3 green/purple, 1 other -->
            <path d="M 0,0 L 0,-50 A 50,50 0 0,1 50,0 Z" fill="#90EE90" stroke="black" stroke-width="1"/>
            <path d="M 0,0 L 50,0 A 50,50 0 0,1 0,50 Z" fill="#9370DB" stroke="black" stroke-width="1"/>
            <path d="M 0,0 L 0,50 A 50,50 0 0,1 -50,0 Z" fill="#90EE90" stroke="black" stroke-width="1"/>
            <path d="M 0,0 L -50,0 A 50,50 0 0,1 0,-50 Z" fill="#E6E6FA" stroke="black" stroke-width="1"/>
            
            <!-- Center point -->
            <circle cx="0" cy="0" r="3" fill="black"/>
            
            <!-- Arrow pointer -->
            <path d="M 0,-3 L 3,3 L 0,15 L -3,3 Z" fill="gray" stroke="black" stroke-width="0.5"/>
        </g>
    </svg>
</div>
