<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            margin: 10px;
        }
        .circles-grid {
            display: inline-block;
        }
        .circle-row {
            display: flex;
            margin: 2px 0;
        }
        .circle {
            width: 20px;
            height: 20px;
            background-color: green;
            border-radius: 50%;
            margin: 2px;
        }
        .number-line {
            position: relative;
            width: fit-content;
            height: 80px;
            margin-top: 20px;
        }
        .line {
            position: absolute;
            top: 50px;
            height: 2px;
            background-color: black;
            width: 200px;
        }
        .tick {
            position: absolute;
            top: 45px;
            width: 2px;
            height: 10px;
            background-color: black;
        }
        .number {
            position: absolute;
            top: 60px;
            font-size: 12px;
            transform: translateX(-50%);
        }
        .arrow {
            position: absolute;
            top: 20px;
            width: 20px;
            height: 25px;
            border: 2px solid blue;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
        }
        .result-box {
            position: absolute;
            top: 55px;
            transform: translateX(-50%);
            padding: 2px 6px;
            border: 2px solid blue;
            background-color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Step 1: 10 rows of 2 circles -->
    <div class="item" label="Gr5_15_1_23_step_1">
        <div class="circles-grid">
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div>
            </div>
            <div class="circle-row">
                <div class="circle"></div><div class="circle"></div>
            </div>
        </div>
    </div>

    <!-- Step 2: Number line with 10 jumps of 2 -->
    <div class="item" label="Gr5_15_1_23_step_2">
        <div class="number-line">
            <div class="line"></div>
            <!-- Ticks and numbers -->
            <div class="tick" style="left: 0px;"></div>
            <div class="number" style="left: 0px;">0</div>
            <div class="tick" style="left: 20px;"></div>
            <div class="number" style="left: 20px;">2</div>
            <div class="tick" style="left: 40px;"></div>
            <div class="number" style="left: 40px;">4</div>
            <div class="tick" style="left: 60px;"></div>
            <div class="number" style="left: 60px;">6</div>
            <div class="tick" style="left: 80px;"></div>
            <div class="number" style="left: 80px;">8</div>
            <div class="tick" style="left: 100px;"></div>
            <div class="number" style="left: 100px;">10</div>
            <div class="tick" style="left: 120px;"></div>
            <div class="number" style="left: 120px;">12</div>
            <div class="tick" style="left: 140px;"></div>
            <div class="number" style="left: 140px;">14</div>
            <div class="tick" style="left: 160px;"></div>
            <div class="number" style="left: 160px;">16</div>
            <div class="tick" style="left: 180px;"></div>
            <div class="number" style="left: 180px;">18</div>
            <div class="tick" style="left: 200px;"></div>
            <div class="number" style="left: 200px;">20</div>
            <!-- 10 Arrows -->
            <div class="arrow" style="left: 0px;"></div>
            <div class="arrow" style="left: 20px;"></div>
            <div class="arrow" style="left: 40px;"></div>
            <div class="arrow" style="left: 60px;"></div>
            <div class="arrow" style="left: 80px;"></div>
            <div class="arrow" style="left: 100px;"></div>
            <div class="arrow" style="left: 120px;"></div>
            <div class="arrow" style="left: 140px;"></div>
            <div class="arrow" style="left: 160px;"></div>
            <div class="arrow" style="left: 180px;"></div>
            <!-- Result box -->
            <div class="result-box" style="left: 200px;">20</div>
        </div>
    </div>
</body>
</html>
