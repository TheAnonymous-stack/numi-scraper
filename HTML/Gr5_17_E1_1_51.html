<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        .item {
            display: inline-block;
            width: fit-content;
            height: fit-content;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 18px;
        }
        .calculation {
            display: inline-block;
            vertical-align: top;
            margin: 0 5px;
        }
        .number {
            text-align: right;
            margin: 2px 0;
        }
        .line {
            border-top: 2px solid black;
            margin: 5px 0;
        }
        .highlight {
            background-color: #ffeb3b;
            padding: 0 2px;
        }
    </style>
</head>
<body>
    <!-- Question 1_51 -->
    <!-- The image shows a vertical addition problem with the numbers 33,594 and 15,912 aligned by place value. The calculation for the ones place is highlighted. -->
    <div class="item" label="Gr5_17_1_51_step_1">
        <div class="calculation">
            <div class="number">33,594</div>
            <div class="number">+ 15,912</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">6</span></div>
        </div>
    </div>
    
    <!-- The image shows a vertical addition problem with the numbers 33,594 and 15,912 aligned by place value. The calculation for the tens place is highlighted. -->
    <div class="item" label="Gr5_17_1_51_step_2">
        <div class="calculation">
            <div class="number">33,594</div>
            <div class="number">+ 15,912</div>
            <div class="line"></div>
            <div class="number"><span class="highlight">0</span>6</div>
        </div>
    </div>
</body>
</html>
