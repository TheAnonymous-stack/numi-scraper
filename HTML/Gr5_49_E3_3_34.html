            <polygon points="50,250 170,250 130,180"

            <polygon points="50,250 170,250 130,320"

</g>

<div class="item" label="Gr5_49_3_34_B">
    <svg width="200" height="128" viewBox="40.0 170.0 140.0 90.0">
        <!-- Rectangle formed by tessellation -->
        <g>
            
            <!-- Original triangle (bottom) -->
            <polygon points="50,250 170,250 130,180" 
                     fill="#4A90E2" 
                     stroke="#2C3E50" 
                     stroke-width="2"/>
            
            <!-- Left piece after cut and flip -->
            <polygon points="50,180 130,180 50,250" 
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
            
            <!-- Right piece after cut and flip -->
            <polygon points="130,180 170,180 170,250" 
                     fill="#B8E0FF" 
                     opacity="0.8"
                     stroke="#2C3E50" 
                     stroke-width="1.5"/>
            
        
        </g>
        
    </svg>
</div>
