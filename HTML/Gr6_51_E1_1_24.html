<!DOCTYPE html>
<html>
 <head>
  <style>
   body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;

        }

        }

  </style>
 </head>
 <body>
  <div class="question">

     <circle cx="200" cy="50" fill="black" r="3">

      160°

     </circle>
