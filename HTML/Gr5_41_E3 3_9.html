<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr5_41_E3 3_9</title>
    <style>
        .item {
            display: inline-block;
            position: relative;
        }
        
        /* Ensure divs are only as large as their content */
        .item svg {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Question 3_9: Game spinner with win points (67%) and lose points (33%) sections -->
    <div class="item" label="Gr5_41_3_9">
        <svg width="200" height="200" viewBox="0 0 200 200">
            <!-- Black outline circle -->
            <circle cx="100" cy="100" r="90" fill="none" stroke="black" stroke-width="2"/>
            
            <!-- Win points section (approximately 67% = 241.2 degrees) -->
            <path d="M 100 100 L 100 10 A 90 90 0 1 1 35 152 Z" fill="#90EE90" stroke="black" stroke-width="1"/>
            
            <!-- Lose points section (approximately 33% = 118.8 degrees) -->
            <path d="M 100 100 L 35 152 A 90 90 0 0 1 100 10 Z" fill="#FFB6C1" stroke="black" stroke-width="1"/>
            
            <!-- Labels -->
            <text x="60" y="80" font-family="Arial" font-size="12" fill="black">win points</text>
            <text x="95" y="45" font-family="Arial" font-size="12" fill="black">lose points</text>
            
            <!-- Center point -->
            <circle cx="100" cy="100" r="4" fill="black"/>
            
            <!-- Arrow/pointer -->
            <polygon points="100,100 95,85 105,85" fill="gray" transform="rotate(45 100 100)"/>
        </svg>
    </div>
</body>
</html>
