
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }
        .item {
            border: 2px solid #333;
            background-color: white;
            padding: 15px;
            margin: 10px 0;
            width: fit-content;
            text-align: center;
        }
        canvas {
            border: 1px solid #ccc;
            background-color: white;
        }
        .problem {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .instruction {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container"> 
        <!-- Multiple Choice Options -->
        <div class="item" label="Gr7_10_1_40_A">
            <canvas id="Gr7_10_1_40_A" width="400" height="150"></canvas>
        </div>
        <div class="item" label="Gr7_10_1_40_B">

        // Canvas Gr7_10_1_40_A - 4
        const canvasGr7_10_1_40_A = document.getElementById('Gr7_10_1_40_A');
        const ctxGr7_10_1_40_A = canvasGr7_10_1_40_A.getContext('2d');
        ctxGr7_10_1_40_A.clearRect(0, 0, 400, 150);
        
        const startXGr7_10_1_40_A = 100.0;
        const startYGr7_10_1_40_A = 68.75;
        const circleRadiusGr7_10_1_40_A = 25;
        const circleSpacingGr7_10_1_40_A = 62.5;
        const circlesPerRowGr7_10_1_40_A = 4;
        
        for (let i = 0; i < 4; i++) {
            const row = Math.floor(i / circlesPerRowGr7_10_1_40_A);
            const col = i % circlesPerRowGr7_10_1_40_A;
            
            const x = startXGr7_10_1_40_A + col * circleSpacingGr7_10_1_40_A;
            const y = startYGr7_10_1_40_A + row * circleSpacingGr7_10_1_40_A;
            
            // Draw circle
            ctxGr7_10_1_40_A.beginPath();
            ctxGr7_10_1_40_A.arc(x, y, circleRadiusGr7_10_1_40_A, 0, 2 * Math.PI);
            ctxGr7_10_1_40_A.fillStyle = '#FFD700';
            ctxGr7_10_1_40_A.fill();
            ctxGr7_10_1_40_A.strokeStyle = '#333';
            ctxGr7_10_1_40_A.lineWidth = 2;
            ctxGr7_10_1_40_A.stroke();
            
            // Draw sign
            ctxGr7_10_1_40_A.fillStyle = '#000';
            ctxGr7_10_1_40_A.font = 'bold 30px Arial';
            ctxGr7_10_1_40_A.textAlign = 'center';
            ctxGr7_10_1_40_A.textBaseline = 'middle';
            ctxGr7_10_1_40_A.fillText('+', x, y);
        }
