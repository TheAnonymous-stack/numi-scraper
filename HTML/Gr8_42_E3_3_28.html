
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            
        }
        .question {
            background: white;
            
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            
        }
        .main-image {
            text-align: center;
            
        }
        .info-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .solution {
            background: #f0f9ff;
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
            border: 2px solid #3498db;
        }
        .solution-step {
            margin: 20px 0;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border-left: 4px solid #3498db;
        }
        .step-header {
            color: #3498db;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .answer-box {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid #4caf50;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #2e7d32;
        }
        h1 {
            color: white;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .math {
            font-family: 'Courier New', monospace;
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .triangle-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .angle-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .angle-card.missing {
            background: #fff3e0;
            border: 2px solid #ff9800;
        }
        .angle-value {
            font-size: 28px;
            font-weight: bold;
            color: #3498db;
            margin: 10px 0;
        }
        .angle-value.unknown {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        
        
        <div class="question">
            
            
          
            
            <div class="main-image">
                <div class="item" label=Gr8_42_3_28 style="display: inline-block">
                
        <svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
            <!-- Triangle -->
            <polygon points="50,175 350,175 120,25" 
                     fill="#e8f4f8" stroke="#2c3e50" stroke-width="2"/>
            
            <!-- Angle arcs and labels -->
            
            <text x="65" y="165" font-family="Arial" font-size="14" font-weight="bold" fill="#e74c3c">
                6u
            </text>
        \n
            <text x="295" y="165" font-family="Arial" font-size="14" font-weight="bold" fill="#e74c3c">
                2u
            </text>
        \n
            <text x="120" y="60" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">
                76°
            </text>
        
            
            <!-- Vertex labels -->
            <text x="35" y="195" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">A</text>
            <text x="360" y="195" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">B</text>
            <text x="115" y="15" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">C</text>
        </svg>
                </div>
            </div>
            
            
        </div>
        
        
    </div>
    
   
</body>
</html>
