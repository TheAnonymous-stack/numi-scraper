<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 5 - Week 48 - Exercise 2 - Question 2_20</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .item {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="item" label="Gr5_48_2_20" style="width: 320px; height: 320px; display: inline-block;">
    <svg width="320" height="320" xmlns="http://www.w3.org/2000/svg">
        <!-- Background circle -->
        <circle cx="160" cy="160" r="100" fill="none" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,5"/>
        
        <!-- Center point -->
        <circle cx="160" cy="160" r="4" fill="#333"/>
        
        <!-- Starting/ending ray (same position for 360°) -->
        <line x1="160" y1="160" 
              x2="60.0" 
              y2="160.0" 
              stroke="#333" stroke-width="3"/>
        
        <!-- Full circle to show complete rotation -->
        <circle cx="160" cy="160" r="95" fill="none" stroke="#E91E63" stroke-width="4" opacity="0.6"/>
        
        <!-- Arrow showing rotation direction -->
        <defs>
            <marker id="arrowhead_20" markerWidth="10" markerHeight="7" 
                    refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#E91E63"/>
            </marker>
        </defs>
        
        <!-- Arrow arc near the end -->
        <path d="M 76.3 174.8
                 A 85 85 0 1 1 75.0 161.5"
              fill="none" stroke="#E91E63" stroke-width="3" marker-end="url(#arrowhead_20)"/>
        
        <!-- Small gap indicator to show it's a full rotation -->
        <circle cx="60.0" cy="160.0" r="4" fill="#E91E63"/>
    </svg>
</div>
</body>
</html>
