<!DOCTYPE html>
<html>
<head>
    <style>
        .item {
            display: inline-block;
            font-family: Arial, sans-serif;
            padding: 0;
            margin: 0;
        }
        .subtraction {
            display: inline-block;
            text-align: right;
            border-bottom: 2px solid black;
            padding: 5px;
            min-width: 80px;
        }
        .number {
            margin: 2px 0;
        }
        .operator {
            position: absolute;
            left: -15px;
        }
        .result {
            margin-top: 5px;
            border-top: 2px solid black;
            padding-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Question 2_51: Subtraction 6.1 - 4.19 = 1.91 -->
    <div class="item" label="Gr5_20_2_51_step_2">
        <div class="subtraction">
            <div class="number">$6.10</div>
            <div class="number" style="position: relative;">
                <span class="operator">-</span>$4.19
            </div>
            <div class="result">$1.91</div>
        </div>
    </div>
</body>
</html>
