<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gr7_10_E2 2_49</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .number-line {
            position: relative;
            width: 100%;
            height: 100px;
            margin: 30px 0;
        }
        .line {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: #333;
        }
        .tick {
            position: absolute;
            top: 45%;
            width: 2px;
            height: 10px;
            background: #333;
        }
        .number {
            position: absolute;
            top: 60%;
            transform: translateX(-50%);
            font-size: 14px;
        }
        .arrow {
            position: absolute;
            top: 30%;
            height: 30px;
        }
        .arrow-path {
            stroke: #4169E1;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }
        .point {
            position: absolute;
            top: 48%;
            width: 8px;
            height: 8px;
            background: #FF0000;
            border-radius: 50%;
            transform: translateX(-50%);
        }
        .operation {
            font-size: 24px;
            margin: 20px 0;
            font-weight: bold;
        }
        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 10px;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Addition with Number Lines</h2>
    <div class="operation">29 + 31 = ?</div>
    
    <div class="item" label="Gr7_10_2_49)">
        <label>Visualizing 29 + 31 on the number line:</label>
        <div class="number-line">
            <div class="line"></div>
            <!-- Create tick marks and numbers -->
            <div class="tick" style="left: 10.0%;"></div>
            <div class="number" style="left: 10.0%;">24</div>
            <div class="tick" style="left: 19.75609756097561%;"></div>
            <div class="number" style="left: 19.75609756097561%;">29</div>
            <div class="tick" style="left: 29.51219512195122%;"></div>
            <div class="number" style="left: 29.51219512195122%;">34</div>
            <div class="tick" style="left: 39.26829268292683%;"></div>
            <div class="number" style="left: 39.26829268292683%;">39</div>
            <div class="tick" style="left: 49.02439024390244%;"></div>
            <div class="number" style="left: 49.02439024390244%;">44</div>
            <div class="tick" style="left: 58.78048780487805%;"></div>
            <div class="number" style="left: 58.78048780487805%;">49</div>
            <div class="tick" style="left: 68.53658536585365%;"></div>
            <div class="number" style="left: 68.53658536585365%;">54</div>
            <div class="tick" style="left: 78.29268292682927%;"></div>
            <div class="number" style="left: 78.29268292682927%;">59</div>
            <div class="tick" style="left: 88.04878048780488%;"></div>
            <div class="number" style="left: 88.04878048780488%;">64</div>
            <div class="point" style="left: 19.75609756097561%;"></div>
            <svg class="arrow" style="left: 19.75609756097561%; width: 60.487804878048784%;">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="10" 
                            refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#4169E1" />
                    </marker>
                </defs>
                <path class="arrow-path" d="M 0 15 
                                              Q 50% 0 
                                                100% 15" />
            </svg>
        </div>
        <p>Starting at 29, move 31 units to the right to reach 60</p>
    </div>
    <h3>Solution Steps:</h3>
    <div class="item" label="Gr7_10_2_49_step_2)">
        <label>Step 1: Number line with a point marked at 29</label>
    </div>
    <div class="item" label="Gr7_10_2_49_step_3)">
        <label>Step 2: Number line with an arrow from 29 moving right 31 units to 60</label>
    </div>
</body>
</html>
