<!DOCTYPE html>
<html>
 <head>
  <style>
   body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .polygon-container {
            margin: 20px 0;
            text-align: center;
        }
        .info {
            font-size: 14px;
            color: #666;
            margin-top: 15px;
        }
  </style>
 </head>
 <body>
  <div class="question">
   What is the sum of the exterior angle measures of this nonagon?
  </div>
  <div class="polygon-container">
   <div class="visual-element item" label="Gr6_51_2_36_step_1">
    <svg height="300" viewbox="0 0 400 300" width="400">
     <!-- Nonagon -->
     <polygon fill="lightblue" fill-opacity="0.3" points="200,70 251,89 279,136 269,190 227,225 173,225 131,190 121,136 149,89" stroke="black" stroke-width="2">
     </polygon>
     <!-- Exterior angle indicators -->
     <path d="M 190 70 A 15 15 0 0 1 200 60" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 241 89 A 15 15 0 0 1 251 79" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 269 136 A 15 15 0 0 1 279 126" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 259 190 A 15 15 0 0 1 269 180" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 217 225 A 15 15 0 0 1 227 215" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 163 225 A 15 15 0 0 1 173 215" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 121 190 A 15 15 0 0 1 131 180" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 111 136 A 15 15 0 0 1 121 126" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <path d="M 139 89 A 15 15 0 0 1 149 79" fill="none" opacity="0.7" stroke="red" stroke-width="1.5">
     </path>
     <!-- Label -->
     <text font-size="16" font-weight="bold" text-anchor="middle" x="200" y="250">
      Sum of exterior angles = 360°
     </text>
    </svg>
   </div>
  </div>
  <div class="info">
   For any convex polygon, the sum of exterior angles is always 360°
  </div>
 </body>
</html>
