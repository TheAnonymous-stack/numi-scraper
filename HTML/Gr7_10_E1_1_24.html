        const startXGr7_10_1_24_A = 68.75;
        const startYGr7_10_1_24_A = 37.5;
        const circleRadiusGr7_10_1_24_A = 25;
        const circleSpacingGr7_10_1_24_A = 62.5;
        const circlesPerRowGr7_10_1_24_A = 5;
        
        for (let i = 0; i < 10; i++) {
            const row = Math.floor(i / circlesPerRowGr7_10_1_24_A);
            const col = i % circlesPerRowGr7_10_1_24_A;
            
            const x = startXGr7_10_1_24_A + col * circleSpacingGr7_10_1_24_A;
            const y = startYGr7_10_1_24_A + row * circleSpacingGr7_10_1_24_A;
            
            // Draw circle
            ctxGr7_10_1_24_A.beginPath();
            ctxGr7_10_1_24_A.arc(x, y, circleRadiusGr7_10_1_24_A, 0, 2 * Math.PI);
            ctxGr7_10_1_24_A.fillStyle = '#FFD700';
            ctxGr7_10_1_24_A.fill();
            ctxGr7_10_1_24_A.strokeStyle = '#333';
            ctxGr7_10_1_24_A.lineWidth = 2;
            ctxGr7_10_1_24_A.stroke();
            
            // Draw sign

            ctxGr7_10_1_24_A.font = 'bold 30px Arial';
            ctxGr7_10_1_24_A.textAlign = 'center';
            ctxGr7_10_1_24_A.textBaseline = 'middle';
            ctxGr7_10_1_24_A.fillText('+', x, y);
        }
