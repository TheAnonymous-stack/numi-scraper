<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Long side</th>
            <th>Short side</th>
            <th>Area<br>(long side × short side)</th>
            <th>Difference</th>
        </tr>
        <tr>
            <td>28</td>
            <td>1</td>
            <td>28cm²</td>
            <td>28 - 1 = 27</td>
        </tr>
        <tr>
            <td>14</td>
            <td>2</td>
            <td>28cm²</td>
            <td>14 - 2 = 12</td>
        </tr>
        <tr class="highlight">
            <td>7</td>
            <td>4</td>
            <td>28cm²</td>
            <td>7 - 4 = 3</td>
        </tr>
    </table>
</body>
</html>
