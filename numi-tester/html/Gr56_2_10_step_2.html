<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        table {
            border-collapse: collapse;
            width: auto;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 4px 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <div class="item" label="Gr56_2_10_step_2">
<table>
        <tr>
            <th>Uzun kenar</th>
            <th>Kısa kenar</th>
            <th>Alan<br>(uzun kenar × kısa kenar)</th>
            <th>Fark</th>
        </tr>
        <tr>
            <td>28</td>
            <td>1</td>
            <td>28cm²</td>
            <td>28 - 1 = 27</td>
        </tr>
        <tr>
            <td>14</td>
            <td>2</td>
            <td>28cm²</td>
            <td>14 - 2 = 12</td>
        </tr>
        <tr class="highlight">
            <td>7</td>
            <td>4</td>
            <td>28cm²</td>
            <td>7 - 4 = 3</td>
        </tr>
    </table>
    </div>
</body>
</html>
