<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Long side</th>
            <th>Short side</th>
            <th>Area</th>
            <th>Perimeter</th>
        </tr>
        <tr>
            <td>32</td>
            <td>1</td>
            <td>32cm²</td>
            <td>2(32) + 2(1) = 64 + 2 = 66 cm</td>
        </tr>
        <tr>
            <td>16</td>
            <td>2</td>
            <td>32cm²</td>
            <td>2(16) + 2(2) = 32 + 4 = 36 cm</td>
        </tr>
        <tr class="highlight">
            <td>8</td>
            <td>4</td>
            <td>32cm²</td>
            <td>2(8) + 2(4) = 16 + 8 = 24 cm</td>
        </tr>
    </table>
</body>
</html>
