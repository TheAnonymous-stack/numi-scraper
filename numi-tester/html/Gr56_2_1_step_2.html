<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        table {
            border-collapse: collapse;
            width: auto;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 4px 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <div class="item" label="Gr56_2_1_step_2">
<table>
        <tr>
            <th>Uzun kenar</th>
            <th>Kısa kenar</th>
            <th>Alan<br>(uzun kenar × kısa kenar)</th>
            <th>Fark</th>
        </tr>
        <tr>
            <td>24</td>
            <td>1</td>
            <td>24cm²</td>
            <td>24 - 1 = 23</td>
        </tr>
        <tr>
            <td>12</td>
            <td>2</td>
            <td>24cm²</td>
            <td>12 - 2 = 10</td>
        </tr>
        <tr>
            <td>8</td>
            <td>3</td>
            <td>24cm²</td>
            <td>8 - 3 = 5</td>
        </tr>
        <tr class="highlight">
            <td>6</td>
            <td>4</td>
            <td>24cm²</td>
            <td>6 - 4 = 2</td>
        </tr>
    </table>
    </div>
</body>
</html>
