<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Long side</th>
            <th>Short side</th>
            <th>Area</th>
            <th>Perimeter</th>
        </tr>
        <tr>
            <td>18</td>
            <td>1</td>
            <td>18cm²</td>
            <td>2(18) + 2(1) = 36 + 2 = 38 cm</td>
        </tr>
        <tr>
            <td>9</td>
            <td>2</td>
            <td>18cm²</td>
            <td>2(9) + 2(2) = 18 + 4 = 22 cm</td>
        </tr>
        <tr class="highlight">
            <td>6</td>
            <td>3</td>
            <td>18cm²</td>
            <td>2(6) + 2(3) = 12 + 6 = 18 cm</td>
        </tr>
    </table>
</body>
</html>
