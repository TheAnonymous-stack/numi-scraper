<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <div class="item" label="Gr56_2_12_step_2">
<table>
        <tr>
            <th>Uzun kenar</th>
            <th>Kısa kenar</th>
            <th>Alan<br>(uzun kenar × kısa kenar)</th>
            <th>Fark</th>
        </tr>
        <tr>
            <td>42</td>
            <td>1</td>
            <td>42cm²</td>
            <td>42 - 1 = 41</td>
        </tr>
        <tr>
            <td>21</td>
            <td>2</td>
            <td>42cm²</td>
            <td>21 - 2 = 19</td>
        </tr>
        <tr>
            <td>14</td>
            <td>3</td>
            <td>42cm²</td>
            <td>14 - 3 = 11</td>
        </tr>
        <tr class="highlight">
            <td>7</td>
            <td>6</td>
            <td>42cm²</td>
            <td>7 - 6 = 1</td>
        </tr>
    </table>
    </div>
</body>
</html>
