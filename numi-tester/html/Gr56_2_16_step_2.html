<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Long side</th>
            <th>Short side</th>
            <th>Area<br>(long side × short side)</th>
        </tr>
        <tr>
            <td>16</td>
            <td>1</td>
            <td>16cm²</td>
        </tr>
        <tr>
            <td>8</td>
            <td>2</td>
            <td>16cm²</td>
        </tr>
        <tr>
            <td>4</td>
            <td>4</td>
            <td>16cm²</td>
        </tr>
    </table>
</body>
</html>
