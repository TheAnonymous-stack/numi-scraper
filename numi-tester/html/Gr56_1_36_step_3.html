<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Long side</th>
            <th>Short side</th>
            <th>Area<br>(long side x short side)</th>
        </tr>
        <tr>
            <td>23</td>
            <td>1</td>
            <td>23cm²</td>
        </tr>
        <tr>
            <td>22</td>
            <td>2</td>
            <td>44cm²</td>
        </tr>
        <tr>
            <td>21</td>
            <td>3</td>
            <td>63cm²</td>
        </tr>
        <tr>
            <td>20</td>
            <td>4</td>
            <td>80cm²</td>
        </tr>
        <tr>
            <td>19</td>
            <td>5</td>
            <td>95cm²</td>
        </tr>
        <tr>
            <td>18</td>
            <td>6</td>
            <td>108cm²</td>
        </tr>
        <tr>
            <td>17</td>
            <td>7</td>
            <td>119cm²</td>
        </tr>
        <tr>
            <td>16</td>
            <td>8</td>
            <td>128cm²</td>
        </tr>
        <tr>
            <td>15</td>
            <td>9</td>
            <td>135cm²</td>
        </tr>
        <tr>
            <td>14</td>
            <td>10</td>
            <td>140cm²</td>
        </tr>
        <tr>
            <td>13</td>
            <td>11</td>
            <td>143cm²</td>
        </tr>
        <tr class="highlight">
            <td>12</td>
            <td>12</td>
            <td>144cm²</td>
        </tr>
    </table>
</body>
</html>
