<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        table {
            border-collapse: collapse;
            width: auto;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 4px 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <div class="item" label="Gr56_2_4_step_2">
<table>
        <tr>
            <th>Uzun kenar</th>
            <th>Kısa kenar</th>
            <th>Alan<br>(uzun kenar × kısa kenar)</th>
            <th>Fark</th>
        </tr>
        <tr>
            <td>40</td>
            <td>1</td>
            <td>40cm²</td>
            <td>40 - 1 = 39</td>
        </tr>
        <tr>
            <td>20</td>
            <td>2</td>
            <td>40cm²</td>
            <td>20 - 2 = 18</td>
        </tr>
        <tr>
            <td>10</td>
            <td>4</td>
            <td>40cm²</td>
            <td>10 - 4 = 6</td>
        </tr>
        <tr class="highlight">
            <td>8</td>
            <td>5</td>
            <td>40cm²</td>
            <td>8 - 5 = 3</td>
        </tr>
    </table>
    </div>
</body>
</html>
