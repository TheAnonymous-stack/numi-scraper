<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Long side</th>
            <th>Short side</th>
            <th>Area<br>(long side × short side)</th>
            <th>Difference</th>
        </tr>
        <tr>
            <td>60</td>
            <td>1</td>
            <td>60cm²</td>
            <td>60 - 1 = 59</td>
        </tr>
        <tr>
            <td>30</td>
            <td>2</td>
            <td>60cm²</td>
            <td>30 - 2 = 28</td>
        </tr>
        <tr>
            <td>20</td>
            <td>3</td>
            <td>60cm²</td>
            <td>20 - 3 = 17</td>
        </tr>
        <tr>
            <td>15</td>
            <td>4</td>
            <td>60cm²</td>
            <td>15 - 4 = 11</td>
        </tr>
        <tr>
            <td>12</td>
            <td>5</td>
            <td>60cm²</td>
            <td>12 - 5 = 7</td>
        </tr>
        <tr class="highlight">
            <td>10</td>
            <td>6</td>
            <td>60cm²</td>
            <td>10 - 6 = 4</td>
        </tr>
    </table>
</body>
</html>
