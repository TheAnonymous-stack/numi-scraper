<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Long side</th>
            <th>Short side</th>
            <th>Area</th>
            <th>Perimeter</th>
        </tr>
        <tr class="highlight">
            <td>48</td>
            <td>1</td>
            <td>48cm²</td>
            <td>2(48) + 2(1) = 96 + 2 = 98 cm</td>
        </tr>
        <tr>
            <td>24</td>
            <td>2</td>
            <td>48cm²</td>
            <td>2(24) + 2(2) = 48 + 4 = 52 cm</td>
        </tr>
        <tr>
            <td>16</td>
            <td>3</td>
            <td>48cm²</td>
            <td>2(16) + 2(3) = 32 + 6 = 38 cm</td>
        </tr>
        <tr>
            <td>12</td>
            <td>4</td>
            <td>48cm²</td>
            <td>2(12) + 2(4) = 24 + 8 = 32 cm</td>
        </tr>
        <tr>
            <td>8</td>
            <td>6</td>
            <td>48cm²</td>
            <td>2(8) + 2(6) = 16 + 12 = 28 cm</td>
        </tr>
    </table>
</body>
</html>
