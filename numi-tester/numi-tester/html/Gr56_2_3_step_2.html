<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Long side</th>
            <th>Short side</th>
            <th>Area<br>(long side × short side)</th>
            <th>Difference</th>
        </tr>
        <tr>
            <td>36</td>
            <td>1</td>
            <td>36cm²</td>
            <td>36 - 1 = 35</td>
        </tr>
        <tr>
            <td>18</td>
            <td>2</td>
            <td>36cm²</td>
            <td>18 - 2 = 16</td>
        </tr>
        <tr>
            <td>12</td>
            <td>3</td>
            <td>36cm²</td>
            <td>12 - 3 = 9</td>
        </tr>
        <tr>
            <td>9</td>
            <td>4</td>
            <td>36cm²</td>
            <td>9 - 4 = 5</td>
        </tr>
        <tr class="highlight">
            <td>6</td>
            <td>6</td>
            <td>36cm²</td>
            <td>6 - 6 = 0</td>
        </tr>
    </table>
</body>
</html>
