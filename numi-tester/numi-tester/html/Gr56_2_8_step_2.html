<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Long side</th>
            <th>Short side</th>
            <th>Area<br>(long side × short side)</th>
            <th>Difference</th>
        </tr>
        <tr>
            <td>20</td>
            <td>1</td>
            <td>20cm²</td>
            <td>20 - 1 = 19</td>
        </tr>
        <tr>
            <td>10</td>
            <td>2</td>
            <td>20cm²</td>
            <td>10 - 2 = 8</td>
        </tr>
        <tr class="highlight">
            <td>5</td>
            <td>4</td>
            <td>20cm²</td>
            <td>5 - 4 = 1</td>
        </tr>
    </table>
</body>
</html>
