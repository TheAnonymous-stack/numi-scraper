<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #ffffcc;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Long side</th>
            <th>Short side</th>
            <th>Area<br>(long side × short side)</th>
            <th>Difference</th>
        </tr>
        <tr>
            <td>54</td>
            <td>1</td>
            <td>54cm²</td>
            <td>54 - 1 = 53</td>
        </tr>
        <tr>
            <td>27</td>
            <td>2</td>
            <td>54cm²</td>
            <td>27 - 2 = 25</td>
        </tr>
        <tr>
            <td>18</td>
            <td>3</td>
            <td>54cm²</td>
            <td>18 - 3 = 15</td>
        </tr>
        <tr class="highlight">
            <td>9</td>
            <td>6</td>
            <td>54cm²</td>
            <td>9 - 6 = 3</td>
        </tr>
    </table>
</body>
</html>
